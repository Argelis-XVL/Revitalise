# ═════════════════════════════════════════════════════════════════════════════
# CI/CD workflow — REPO-WIDE AND SHARED.
#
# ⚠ This file is NOT scoped to one feature. It derives a feature slug and reads
#   config/<slug>-build.yml and config/<slug>-pipeline.yml, so a change here
#   changes CI for every feature in the repository.
#
# Revised 2026-08-12 by development-agent on three explicit reviewer decisions.
# ═════════════════════════════════════════════════════════════════════════════
#
# ─── 1. THREE-ENVIRONMENT TOPOLOGY: DEV → TST/ACC → PRD ──────────────────────
# TAD ADR-006 (`Adopted`) and TAD §9.1. Test and Acceptance are ONE combined
# environment. The previous three-job model (`deploy-test` / `deploy-acc` /
# `deploy-prd` against GitHub Environments `test` / `acc` / `prd`) is gone.
# There are exactly TWO deploy targets, `tst_acc` and `prd`, matching the
# environment keys already used in config/<slug>-pipeline.yml. There is no
# APPROVE ACC gate, because there is no Acc hop; APPROVE PRD is the single
# remaining human deployment gate below Stage 0.
#
# ─── 2. POWER PLATFORM PIPELINES OWNS PROMOTION (TAD ADR-007, now Adopted) ───
# The reviewer chose Microsoft's native Dataverse-based ALM product over a
# hand-scripted `pac solution import` promotion. This workflow no longer runs
# `pac solution import` against TST/ACC or PRD at all.
#
#   ┌──────────────────────── GITHUB ACTIONS OWNS THIS ────────────────────────┐
#   │ validate → build → stage-dev                                            │
#   │                                                                          │
#   │ • validate  : slug + both config preflights + learning-loop gates        │
#   │ • build     : the config-driven gates (secret scan, XML/JSON parse,      │
#   │               root-component resolution, field-security coverage, the    │
#   │               FR-016 special-category grep, solution checker, pack)      │
#   │ • stage-dev : import the UNMANAGED solution into DEV, publishing         │
#   │               customisations                                             │
#   └──────────────────────────────────────────────────────────────────────────┘
#                                    ▼  ── THE HAND-OFF POINT ──
#   ┌────────────────── POWER PLATFORM PIPELINES OWNS THIS ────────────────────┐
#   │ DEV → TST/ACC → PRD                                                      │
#   │                                                                          │
#   │ Pipelines EXPORTS THE SOLUTION ITSELF from DEV when a deployment is      │
#   │ requested, stores managed + unmanaged artefacts in the pipelines host,   │
#   │ and imports the managed artefact into each target stage in order.        │
#   └──────────────────────────────────────────────────────────────────────────┘
#
# WHY the hand-off is "import unmanaged into DEV" and not "hand Pipelines a zip":
#   Pipelines cannot be given a pre-built artefact. "Solutions are exported as
#   soon as a deployment request is submitted (when the maker selects Deploy
#   from within their development environment), and the same solution artifact
#   will be deployed... The system also prevents any tampering or modification
#   to the exported solution artifact."
#     — https://learn.microsoft.com/en-us/power-platform/alm/pipelines
#   So the only way to get this repository's source into a Pipelines deployment
#   is to make DEV's unmanaged solution match the repository. That is what
#   `stage-dev` does, and it is the whole of GitHub Actions' deploy role.
#
#   `--publish-changes` on that import is REQUIRED, not cosmetic: "Do pipelines
#   publish unmanaged customizations before exporting the solution? Not
#   currently." Unpublished changes would be silently absent from the export.
#     — same page
#
# CONSEQUENCES a reviewer must see, because they change existing contracts:
#   a) build/artifacts/<...>/RevitaliseGrantAutomation-managed.zip IS NO LONGER
#      THE DEPLOYED ARTEFACT. It is a build-validation and audit artefact. The
#      deployed bits are the ones Pipelines exports from DEV. See the Dev
#      Summary's C-TECH-030 entry — this changes HOW that HARD constraint is
#      met, and it is recorded, not glossed.
#   b) provisioning/deploymentSettings/pac-import-tstacc.json and
#      pac-import-prd.json ARE NO LONGER CONSUMED by the promotion path.
#      Pipelines collects connection references and environment variables in its
#      own deployment pane and does not accept a settings file
#      ("For stage owner based delegated deployments, can I use a custom
#      DeploymentSettings.json file? Not currently within the maker experience."
#      — https://learn.microsoft.com/en-us/power-platform/alm/delegated-deployments-setup).
#      Both files are retained as the reviewed record of the values an operator
#      must type into that pane.
#   c) Import behaviour is not configurable. "Pipelines default import behavior
#      is Upgrade without Overwrite customizations." `--force-overwrite` and
#      friends no longer apply to TST/ACC or PRD.
#   d) Stage order is enforced by the platform, and versions cannot skip:
#      "you can't deploy version 1.0.0.1 to production before it has been
#      deployed to test."
#
# ─── 3. OIDC / FEDERATED CREDENTIAL AUTH — C-TECH-044 RESOLVED ───────────────
# CLIENT_SECRET is gone from this workflow and from <slug>-build.yml. Auth is
# `pac auth create --githubFederated --applicationId ... --tenant ...`, which
# exchanges the GitHub OIDC token for an Entra token with no stored secret.
#   flag reference: https://learn.microsoft.com/en-us/power-platform/developer/cli/reference/auth
#   worked example: https://learn.microsoft.com/en-us/power-platform/alm/tutorials/github-actions-oidc-fic
# `azure/login@v2` is NOT required — pac performs the token exchange itself.
# Every authenticating job declares `permissions: id-token: write` (see below);
# the shared setup steps live in .github/actions/setup-powerplatform.
#
# ─── 4. ONE DEPLOY IDENTITY PER TARGET — a deliberate decision, not a default ─
# The old design used ONE `APP_ID` + `CLIENT_SECRET` for every environment.
# This revision gives DEV, TST/ACC and PRD **separate app registrations**, each
# holding **exactly one federated credential** scoped to its own GitHub
# Environment subject:
#
#   rev-grantautomation-deploy-dev     sub = repo:<org>/<repo>:environment:dev
#   rev-grantautomation-deploy-tstacc  sub = repo:<org>/<repo>:environment:tst_acc
#   rev-grantautomation-deploy-prd     sub = repo:<org>/<repo>:environment:prd
#
# WHY SEPARATE REGISTRATIONS AND NOT JUST SEPARATE CREDENTIALS ON ONE APP:
#   Scoping several federated credentials onto a single app registration gates
#   only TOKEN ISSUANCE — it says which workflow context may obtain a token. It
#   does NOT scope AUTHORITY: every one of those subjects resolves to the same
#   service principal, which is an application user in all three environments,
#   so a token minted by the `tst_acc` job could still import into PRD. The
#   boundary would be convention, exactly what the reviewer asked to avoid.
#   Separate registrations move the boundary to "this identity does not exist in
#   PRD at all", which is what C-TECH-043 least privilege actually asks for.
#   Cost: three registrations instead of one, and the `entra.appRegistrations`
#   block in test-settings.json and prd-settings.json is no longer identical.
#   Proportionate for a project holding special-category data in PRD.
#
# HOW IT IS ENFORCED IN THIS FILE: `APP_ID` is an ENVIRONMENT-SCOPED GitHub
# secret with a different value in each of `dev`, `tst_acc` and `prd`. A job can
# only read the secrets of the environment it declares, so no job can even name
# another target's identity. Nothing in this YAML needs to select between them.
#
# ═════════════════════════════════════════════════════════════════════════════
# ⚠ OPERATOR SETUP — ONE TIME. Read all four parts before the first run.
# ═════════════════════════════════════════════════════════════════════════════
#
# ── A. TENANT PREREQUISITES (none of this exists yet) ────────────────────────
# `pac admin list` on 2026-08-10 showed a single "Default" Dataverse environment
# in the tenant. Everything below is still to be provisioned, and adopting
# Pipelines ADDS to the list. Full detail: TAD §12 and
# config/<slug>-pipeline.yml → tenant_prerequisites (gate: APPROVE TENANT).
#
#   1. Power Platform environments DEV, TST/ACC, PRD — UK region, Dataverse.
#   2. A PIPELINES HOST — NEW REQUIREMENT introduced by ADR-007. A custom host
#      is required, not the auto-provisioned "platform host": platform-host
#      pipelines are personal pipelines and "can't be extended", can't be
#      shared, and cap at three environments — which rules out delegated
#      deployments and approvals.
#        - PPAC → Deployments → New custom host, OR install the "Power Platform
#          Pipelines" application into an existing Dataverse environment via
#          PPAC → Environments → <host> → Resources → Dynamics 365 apps.
#        - Then Deployment Pipeline Configuration app → Environments (one record
#          per environment, typed Development or Target) → Pipelines → stages.
#        - https://learn.microsoft.com/en-us/power-platform/alm/custom-host-pipelines
#   3. TST/ACC and PRD MUST BE MANAGED ENVIRONMENTS. "All other environments
#      used in pipelines must be enabled as managed environments. Licenses
#      granting premium use rights are required for all managed environments."
#      This is a LICENCE COST consequence of the ALM choice, and from February
#      2026 Microsoft enables it on pipeline targets automatically.
#        - https://learn.microsoft.com/en-us/power-platform/alm/pipelines
#   4. Three deploy app registrations (§4 above), each with ONE federated
#      credential, each an application user in ITS OWN environment only.
#
# ── B. GITHUB ENVIRONMENTS — create exactly these three ──────────────────────
#   Settings → Environments. Names must match exactly (they are also the OIDC
#   subject suffixes, so a typo becomes an auth failure, not a config error).
#
#   `dev`      NO required reviewers. Deliberate: this environment exists to
#              pin the OIDC subject for the build and DEV-staging jobs, not to
#              gate anything. Adding reviewers here would block every build.
#   `tst_acc`  Required reviewers: SEE PART D — depends on promote_mode.
#   `prd`      Required reviewers: YES, ALWAYS. This protection rule is what
#              enforces the APPROVE PRD gate. Without it the job deploys
#              unattended.
#
# ── C. SECRETS ───────────────────────────────────────────────────────────────
#   Repository-level (shared, non-environment-specific):
#     TENANT_ID
#     PROVISION_APP_ID, PROVISION_CERT_THUMBPRINT   ← provisioning identity used
#         by provisioning/**/*.ps1 in pre/post_deploy. Certificate-based, so
#         also C-TECH-044-compliant.
#
#   Environment `dev`:      APP_ID, ENV_URL_DEV
#   Environment `tst_acc`:  APP_ID, ENV_URL_TEST, ENV_URL_DEV [, PIPELINE_STAGE_ID]
#                           PROVISION_CERT_PFX_BASE64, PROVISION_CERT_PASSWORD
#   Environment `prd`:      APP_ID, ENV_URL_PRD,  ENV_URL_DEV [, PIPELINE_STAGE_ID]
#                           PROVISION_CERT_PFX_BASE64, PROVISION_CERT_PASSWORD
#
#   ⚠ PROVISION_CERT_PFX_BASE64 / PROVISION_CERT_PASSWORD ARE NEW (2026-08-19) AND
#     THE PROMOTE JOBS CANNOT WORK WITHOUT THEM. Until this revision the promote
#     jobs exported PROVISION_CERT_THUMBPRINT and nothing else — but a thumbprint
#     is a lookup key into a certificate store, not a credential, and the store on
#     a fresh runner is empty. Every provisioning script in pre_deploy, post_deploy
#     and smoke_tests for TST/ACC and PRD would have failed at connect time. It had
#     never surfaced because DEV provisioning has only ever been run interactively,
#     from the Mac whose keychain holds the certificate (IMP-0022).
#
#     They are ENVIRONMENT secrets, not repository secrets, deliberately: the
#     provisioning identity used against production should not be readable by a job
#     targeting test. To produce the base64, on the machine holding the cert:
#         base64 -i provisioning/certs/<name>.pfx | pbcopy
#     See .github/actions/install-provisioning-cert/action.yml for the full contract
#     and for why a federated credential is the preferred follow-up.
#
#   ⚠ APP_ID is intentionally the SAME NAME with a DIFFERENT VALUE per
#     environment — that is the mechanism in §4 above, not an oversight.
#   ⚠ ENV_URL_DEV is needed by the promote jobs because `pac pipeline deploy`
#     connects to the DEVELOPMENT environment: pipelines are visible from the
#     dev environment, not from the target.
#   ⚠ ENV_URL_TEST is the combined TST/ACC environment (ADR-006). ENV_URL_ACC
#     no longer exists. The names ENV_URL_TEST / ENV_URL_PRD are referenced
#     literally by smoke-test commands in config/<slug>-pipeline.yml.
#   ⚠ NO CLIENT_SECRET. If one is still present in this repository's secrets,
#     delete it — it is now unreferenced and is a live credential nobody rotates.
#
#   Secrets reach commands only through `env:`. They are never echoed and never
#   interpolated into a printed command.
#
# ── D. ENTRA FEDERATED CREDENTIALS — subject strings ─────────────────────────
#   On each app registration: Certificates & secrets → Federated credentials →
#   Add credential → scenario "Other issuer".
#     Issuer:   https://token.actions.githubusercontent.com
#     Audience: api://AzureADTokenExchange
#     Subject:  repo:<org>/<repo>:environment:dev        (on the -dev app)
#               repo:<org>/<repo>:environment:tst_acc    (on the -tstacc app)
#               repo:<org>/<repo>:environment:prd        (on the -prd app)
#
#   ⚠ THE SUBJECT IS THE ENVIRONMENT, NOT THE BRANCH. GitHub's OIDC `sub` claim
#     is `repo:ORG/REPO:environment:NAME` for a job that references an
#     environment, and only `repo:ORG/REPO:ref:refs/heads/BRANCH` for one that
#     does not. Entra matches subjects as exact strings.
#       - https://docs.github.com/en/actions/reference/security/oidc
#     Every job in this workflow that authenticates to Power Platform therefore
#     declares an `environment:`. That is why: this workflow triggers on
#     `feature/**`, so a branch-based subject would need one credential per
#     branch name, which is unmaintainable. The `ref:refs/heads/main` subject
#     currently declared in the deploymentSettings files does not match any job
#     here and has been replaced.
#
# ── E. PROMOTION MODE — read config/<slug>-pipeline.yml → environments.*.promote_mode
#   `manual` (the default for this feature's first release):
#       CI stops at the DEV hand-off. A human promotes DEV → TST/ACC → PRD in
#       the Pipelines UI (Solutions → the unmanaged solution → Pipelines →
#       Deploy here). The GitHub Environment approval gate IS the wait: the
#       promote job pauses for reviewers, and the operator approves it only
#       AFTER promoting. On resume the job verifies the expected version is
#       actually present in the target, then runs post_deploy and smoke tests.
#       → In this mode, add required reviewers to `tst_acc` as well as `prd`.
#   `cli`:
#       The job runs `pac pipeline deploy` itself. Requires PIPELINE_STAGE_ID.
#       → In this mode `tst_acc` needs no reviewers (auto-deploy per ADR-006).
#
#   Why `manual` is the default even though the CLI surface is real and verified:
#   see config/<slug>-pipeline.yml → alm.promotion_mechanism. Two things could
#   not be verified against documentation — whether a SERVICE PRINCIPAL may
#   REQUEST a promotion (every Microsoft example shows a maker requesting, with
#   service principals appearing only as the delegated identity that performs
#   the import), and the exact semantics of --currentVersion / --newVersion.
#   Guessing either in a production promotion path is worse than one manual click.
# ═════════════════════════════════════════════════════════════════════════════
name: CI/CD

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:
    inputs:
      feature_slug:
        description: "Feature slug — must match config/<slug>-build.yml and config/<slug>-pipeline.yml"
        required: true
        type: string

# Default for the whole workflow. Jobs that authenticate to Power Platform add
# `id-token: write` themselves — it is granted per job, never workflow-wide, so
# the `validate` job cannot mint a token it has no use for.
permissions:
  contents: read

# One pipeline at a time per ref; never cancel a deployment mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Derive the slug and verify both per-feature config files exist.
  #    No environment, no OIDC token: this job touches nothing outside the repo.
  # ───────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate feature config
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive feature slug
        id: slug
        env:
          # Passed via env (not inline ${{ }}) to avoid script injection.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLUG: ${{ inputs.feature_slug }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLUG="$INPUT_SLUG"
          else
            SLUG="${BRANCH_NAME#feature/}"
            # Nested branch segments (feature/a/b) become hyphenated slugs (a-b)
            SLUG="${SLUG//\//-}"
          fi
          if [ -z "$SLUG" ]; then
            echo "::error::Could not derive a feature slug from branch '$BRANCH_NAME' or dispatch input."
            exit 1
          fi
          echo "Feature slug: $SLUG"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Verify per-feature config files exist
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          set -euo pipefail
          MISSING=0
          for F in "config/${SLUG}-build.yml" "config/${SLUG}-pipeline.yml"; do
            if [ ! -f "$F" ]; then
              echo "::error::Missing required config file '$F' for feature '${SLUG}'. The development-agent must generate it (copy from config/build.yml.example / config/pipeline.yml.example) before CI can run."
              MISSING=1
            else
              echo "Found $F"
            fi
          done
          exit "$MISSING"

      # ── C-TECH-057 — PREFLIGHT THE BUILD CONFIG BEFORE ANYTHING RUNS ────────
      # Three of this project's own gates were found to have recorded PASS while
      # checking nothing: `lint` pointed at a source folder where a packed .zip is
      # required (and ordered before the step producing it), the HARD FR-016 gate's
      # target path was missing its .json so grep's exit 2 was inverted into a pass,
      # and `gitleaks` scanned commit history instead of the working tree. This asserts
      # step order, input existence, tool input-type contracts, and that every gate has
      # a negative test proving it can fail.
      # IMP-0002, IMP-0004, IMP-0007, IMP-0020.
      - name: Preflight the build config (C-TECH-057)
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 scripts/verify-build-config.py "config/${SLUG}-build.yml"

      # ── C-TECH-062 — PREFLIGHT THE PIPELINE CONFIG TOO ──────────────────────
      # NEW 2026-08-19. The build config has been preflighted since 08-17; the PIPELINE
      # config never has, and IMP-0042 recorded that as a blocker: "a pipeline step can
      # name a script that does not exist, a parameter that does not exist, or a path
      # that does not exist, and nothing will say so until the stage runs against a live
      # environment." Two of the seven open blockers were that same defect written twice
      # (`-AlternateKeysOnly`, `-LibraryOnly` — neither parameter exists), each found by
      # a human mid-deploy. Both are decidable in milliseconds from the script's own
      # param() block, which is what this step now does.
      # IMP-0042, IMP-0046.
      - name: Preflight the pipeline config (C-TECH-062)
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 scripts/verify-pipeline-config.py "config/${SLUG}-pipeline.yml"

      # ── C-TECH-059 — THE LEARNING SUBSTRATE MUST BE CURRENT ─────────────────
      # logs/known-failure-modes.md is the READ path: build-agent and pipeline-agent
      # load it at activation step 0. A finding appended to the log without
      # regenerating the digest teaches nobody, so a stale digest fails CI.
      # IMP-0016, IMP-0022, IMP-0023.
      - name: Verify the known-failure-modes digest is current (C-TECH-059)
        run: |
          set -euo pipefail
          python3 scripts/generate-known-failure-modes.py --check

      # ── C-TECH-061 — THE LEARNING LOOP'S OWN TRIGGERS ARE ENFORCED ──────────
      # NEW 2026-08-19. agents/WORKFLOW.md says a `blocker` finding routes to
      # improvement-agent immediately, and ten NEW findings route at the next routing
      # decision. Both rules lived only as prose in an agent file, and both have now
      # failed twice: IMP-0033 (all 32 entries still NEW, 23 of them already fixed), and
      # again on 2026-08-19 with 23 NEW entries and seven unprocessed blockers while
      # every other gate in this workflow was green.
      #
      # A rule this project relies on and has watched fail twice is a rule that needs a
      # script, not another paragraph — the same reasoning that retired C-TECH-049 in
      # favour of a gate. Schema is checked always; the triggers only under --check, so
      # a developer can validate a finding they just wrote without the queue's state
      # failing their run.
      #
      # An entry carrying an explicit `deferred_reason` does NOT trip this: a recorded
      # deferral is the reviewer's decision, visible where the next review will read it.
      - name: Verify the improvement log is valid and its triggers are honoured (C-TECH-061)
        run: |
          set -euo pipefail
          python3 scripts/verify-improvement-log.py --check

      # ── Commercial gates (C-COM-001..010) ─────────────────────────────────
      # This runs the PM gates against the repository AND asserts that each one rejects its
      # known-bad fixtures. The second half is the point: `gate-cannot-fail` is the most
      # recurrent class in logs/known-failure-modes.md (x6), including a HARD compliance gate
      # that was a silent no-op from the day it was written (IMP-0007). A commercial gate
      # shipped without proof that it goes red would be the seventh — in the one place that
      # produces documents a client relies on.
      #
      # It also fails when the generated baseline is stale relative to the signed agreement or
      # the accepted WBS (C-COM-008/009), which is how a source edited in place gets caught.
      #
      # NOT in the deploy path. PM-R30: a commercial failure never halts, retries or rolls back
      # a build or a deploy — it fails `validate`, which gates nothing downstream of itself for
      # the deploy jobs' own reasons, and reports.
      - name: Commercial gates + proof they can fail (C-COM-001..010)
        run: |
          set -euo pipefail
          bash scripts/ci/verify-pm-gates.sh

      - name: Report project status into the job summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo '### Project status'
            echo '```'
            python3 scripts/collect-project-status.py 2>&1 || echo '(snapshot unavailable)'
            echo '```'
            echo '### Baseline drift'
            python3 scripts/report-baseline-drift.py >/dev/null 2>&1 || true
            sed -n '/## 1. Total reconciliation/,/## 3./p' logs/state/baseline-drift.md 2>/dev/null \
              || echo '(no drift report)'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Build — execute the steps from config/<slug>-build.yml in order.
  #    Runs under GitHub Environment `dev` solely to pin the OIDC subject to
  #    `repo:<org>/<repo>:environment:dev`. `dev` must have NO required
  #    reviewers or every build blocks.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build (config-driven)
    runs-on: ubuntu-latest
    needs: [validate]
    environment: dev
    outputs:
      # The artifact directory THIS build resolved, for stage-dev to consume.
      artifact_dir: ${{ steps.artifact-dir.outputs.dir }}
    permissions:
      id-token: write
      contents: read
    env:
      SLUG: ${{ needs.validate.outputs.slug }}
      # Consumed by the build config's `auth` step and by `pac solution check`.
      ENV_URL_DEV: ${{ secrets.ENV_URL_DEV }}
      APP_ID: ${{ secrets.APP_ID }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      # Solution version stamped by the build (build.yml required_env_vars).
      BUILD_VERSION: ${{ vars.BUILD_VERSION || '1.0.0.0' }}
    steps:
      - uses: actions/checkout@v4

      # Installs pinned pac + yq and creates the auth profile over OIDC.
      # The build config's own `auth` step re-creates a named profile (`revdev`)
      # because the config is the contract the build-agent owns; this call makes
      # the tooling present and proves the federated credential works first.
      - uses: ./.github/actions/setup-powerplatform
        with:
          environment-url: ${{ secrets.ENV_URL_DEV }}
          app-id: ${{ secrets.APP_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          profile-name: ci-build-dev

      - name: Check required env vars from build config
        run: |
          set -euo pipefail
          BUILD_CONFIG="config/${SLUG}-build.yml"
          while IFS= read -r VAR; do
            [ -z "$VAR" ] && continue
            if [ -z "${!VAR:-}" ]; then
              echo "::error::Build config requires env var '$VAR' but it is not set. Add it as a GitHub Actions secret (or repository variable) and expose it in this job's env block."
              exit 1
            fi
            echo "Required env var '$VAR' is set."
          done < <(yq -r '.required_env_vars // [] | .[]' "$BUILD_CONFIG")

      # ── C-TECH-059 — RESOLVE A UNIQUE ARTIFACT DIRECTORY PER BUILD ──────────
      # `artifact_output` in build.yml is a template, not a literal. It used to be a
      # hardcoded date-stamped path reused by every build: six builds shared one
      # directory, the manifests for #1-#3 no longer exist, and #6 overwrote #5. Every
      # step in build.yml references "$ARTIFACT_DIR", exported here. IMP-0016.
      - name: Resolve the artifact directory
        id: artifact-dir
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$(python3 scripts/resolve-artifact-dir.py --feature "${SLUG}")"
          echo "ARTIFACT_DIR=${ARTIFACT_DIR}" >> "$GITHUB_ENV"
          # Published as a job output so `stage-dev` uses the directory this build
          # actually created, instead of a path written into the pipeline config by
          # hand months earlier (2026-08-19; see that job's artifact step).
          echo "dir=${ARTIFACT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Artifact directory for this build: ${ARTIFACT_DIR}"

      - name: Run build steps from config
        run: |
          set -euo pipefail
          bash scripts/ci/run-config-steps.sh \
            --config "config/${SLUG}-build.yml" \
            --path '.steps' \
            --label 'build' \
            --value-field 'command' \
            --name-field 'name'

      # ⚠ `path:` IS THE DIRECTORY, NOT A GLOB — CHANGED 2026-08-19.
      # It was `build/artifacts/**`. upload-artifact roots the archive at the least
      # common ancestor of everything the pattern matched, and since exactly one
      # dated directory exists in a fresh checkout, that ancestor WAS the dated
      # directory — so `<slug>-<date>-<n>/` was stripped out of the archive and the
      # download produced `build/artifacts/logs/...` with the build's identity gone.
      # Naming the parent directory instead makes its contents the archive root, so
      # the dated directory survives the round trip and `stage-dev` can find it.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ needs.validate.outputs.slug }}
          path: build/artifacts
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Stage DEV — THE HAND-OFF POINT TO POWER PLATFORM PIPELINES.
  #
  #    Imports the UNMANAGED solution into DEV so that DEV's unmanaged solution
  #    matches this repository. Everything downstream is Pipelines' job: it
  #    exports from DEV itself when a promotion is requested.
  #
  #    ⚠ DEV IS DERIVED FROM GIT. This import overwrites unmanaged
  #      customisations in DEV, which is the TAD §9.2 posture (the unpacked
  #      solution in this repo is the source of truth). A maker who edits in the
  #      maker portal and does not commit WILL lose that work here.
  # ───────────────────────────────────────────────────────────────────────────
  stage-dev:
    name: Stage to DEV (hand-off to Power Platform Pipelines)
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      SLUG: ${{ needs.validate.outputs.slug }}
      ENV_URL_DEV: ${{ secrets.ENV_URL_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-powerplatform
        with:
          environment-url: ${{ secrets.ENV_URL_DEV }}
          app-id: ${{ secrets.APP_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          profile-name: ci-stage-dev

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.validate.outputs.slug }}
          path: build/artifacts

      # ── RESOLVED, NOT READ LITERALLY — REWRITTEN 2026-08-19 ─────────────────
      # This step used to read `.artifact` out of the pipeline config verbatim. That
      # value was `build/artifacts/revitalise-grant-automation-20260810-1/`, frozen on
      # 2026-08-10, while the build began resolving a fresh `<slug>-<date>-<n>` per run
      # on 08-17 (IMP-0016). The two were never reconciled, so this check could only
      # ever fail — a guaranteed CI failure that had never been exercised because no
      # run had reached this job.
      #
      # The pipeline config now declares the same TEMPLATE as the build config
      # (`build/artifacts/${ARTIFACT_DIR_NAME}/`), and the concrete directory comes
      # from the build job that actually created it. `verify-pipeline-config.py` fails
      # the preflight if anyone puts a literal dated path back.
      - name: Resolve and verify the build artifact
        id: artifact
        env:
          ARTIFACT_DIR: ${{ needs.build.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          PIPELINE_CONFIG="config/${SLUG}-pipeline.yml"

          if [ -z "${ARTIFACT_DIR:-}" ]; then
            echo "::error::The build job published no artifact directory. Its 'Resolve the artifact directory' step must set the 'dir' output."
            exit 1
          fi

          TEMPLATE=$(yq -r '.artifact // ""' "$PIPELINE_CONFIG")
          case "$TEMPLATE" in
            *'${ARTIFACT_DIR_NAME}'*) : ;;
            *)
              echo "::error::config/${SLUG}-pipeline.yml declares artifact '$TEMPLATE', which is not the per-run template. A literal path stops existing after the next build (C-TECH-059, IMP-0016). Run: python3 scripts/verify-pipeline-config.py $PIPELINE_CONFIG"
              exit 1
              ;;
          esac

          if [ ! -d "$ARTIFACT_DIR" ]; then
            echo "::error::Artifact directory '$ARTIFACT_DIR' is not present after download. The build job uploaded 'build/artifacts'; check the upload/download paths agree."
            ls -R build/artifacts || true
            exit 1
          fi

          # A directory that exists but is empty is the `exit-zero-does-not-mean-created`
          # class (IMP-0013, IMP-0018): the check would pass and the import would then
          # fail on a missing file. Assert the solution zip the stage command needs.
          if [ -z "$(find "$ARTIFACT_DIR" -name '*.zip' -print -quit)" ]; then
            echo "::error::Artifact directory '$ARTIFACT_DIR' contains no .zip. The build produced no packed solution, or the upload did not include it."
            find "$ARTIFACT_DIR" -maxdepth 2 || true
            exit 1
          fi

          echo "artifact=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          echo "Artifact present: $ARTIFACT_DIR"

      - name: Import the unmanaged solution into DEV
        env:
          ARTIFACT: ${{ steps.artifact.outputs.artifact }}
        run: |
          set -euo pipefail
          PIPELINE_CONFIG="config/${SLUG}-pipeline.yml"
          CMD=$(yq -r '.alm.stage_dev_command // ""' "$PIPELINE_CONFIG")
          if [ -z "$CMD" ] || [ "$CMD" = "null" ]; then
            echo "::error::config/${SLUG}-pipeline.yml declares no 'alm.stage_dev_command'. Under Power Platform Pipelines (ADR-007) this is the command that stages DEV for promotion and it is required."
            exit 1
          fi
          # Substitute the config's placeholders. The resolved command is never
          # printed — it contains the DEV environment URL.
          CMD=${CMD//\{artifact\}/${ARTIFACT}}
          CMD=${CMD//\{dev_env_url\}/${ENV_URL_DEV}}
          echo "Staging feature '${SLUG}' into DEV..."
          bash -euo pipefail -c "$CMD"

      - name: Record the hand-off in the job summary
        run: |
          set -euo pipefail
          PIPELINE_CONFIG="config/${SLUG}-pipeline.yml"
          SOLUTION=$(yq -r '.alm.solution_unique_name // "(unset)"' "$PIPELINE_CONFIG")
          PIPELINE=$(yq -r '.alm.pipeline_name // "(unset)"' "$PIPELINE_CONFIG")
          {
            echo "## GitHub Actions is done. Power Platform Pipelines takes over here."
            echo ""
            echo "The unmanaged solution \`${SOLUTION}\` in **DEV** now matches this commit,"
            echo "with customisations published."
            echo ""
            echo "Promotion **DEV → TST/ACC → PRD** is performed by Power Platform Pipelines"
            echo "(pipeline: \`${PIPELINE}\`), which exports the solution from DEV itself."
            echo "GitHub Actions does not import into TST/ACC or PRD and does not hand"
            echo "Pipelines an artefact — see the responsibility diagram at the top of"
            echo "\`.github/workflows/ci.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 4. TST/ACC — combined Test and Acceptance (ADR-006).
  #
  #    Auto after stage-dev when promote_mode is `cli`. When promote_mode is
  #    `manual`, put required reviewers on the `tst_acc` GitHub Environment and
  #    approve only after promoting in the Pipelines UI — the approval gate is
  #    the wait, and the version check below refuses to run post_deploy against
  #    an environment that was never promoted.
  #
  #    There is deliberately NO `APPROVE ACC` gate: there is no Acc hop.
  # ───────────────────────────────────────────────────────────────────────────
  promote-tst-acc:
    name: Promote to TST/ACC
    runs-on: ubuntu-latest
    needs: [validate, stage-dev]
    environment: tst_acc
    permissions:
      id-token: write
      contents: read
    env:
      SLUG: ${{ needs.validate.outputs.slug }}
      TARGET_ENV: tst_acc
      # `pac pipeline deploy` connects to the DEVELOPMENT environment.
      ENV_URL_DEV: ${{ secrets.ENV_URL_DEV }}
      # Referenced literally by this environment's smoke-test commands.
      ENV_URL_TEST: ${{ secrets.ENV_URL_TEST }}
      ENV_URL: ${{ secrets.ENV_URL_TEST }}
      PIPELINE_STAGE_ID: ${{ secrets.PIPELINE_STAGE_ID }}
      # Provisioning identity for pre/post_deploy scripts (certificate-based).
      PROVISION_APP_ID: ${{ secrets.PROVISION_APP_ID }}
      PROVISION_CERT_THUMBPRINT: ${{ secrets.PROVISION_CERT_THUMBPRINT }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Authenticates against DEV: that is where pipelines are visible and where
      # `pac pipeline deploy` is issued from. This job's identity is the
      # tst_acc-scoped app registration (environment-scoped APP_ID secret).
      - uses: ./.github/actions/setup-powerplatform
        with:
          environment-url: ${{ secrets.ENV_URL_DEV }}
          app-id: ${{ secrets.APP_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          profile-name: ci-promote-tstacc

      # ── THE PROVISIONING CERTIFICATE MUST BE ON THE RUNNER ──────────────────
      # NEW 2026-08-19. This job already exported PROVISION_APP_ID and
      # PROVISION_CERT_THUMBPRINT, but a thumbprint is a LOOKUP KEY into a certificate
      # store — not a credential. The store on a fresh ubuntu-latest runner is empty,
      # and the only copy of this certificate lives in a Mac keychain (IMP-0022). So
      # every `pwsh provisioning/**` step in pre_deploy, post_deploy and smoke_tests
      # below would have thrown inside Connect-MgGraph / Connect-PnPOnline.
      #
      # It had never surfaced because no environment above DEV has been deployed to:
      # DEV provisioning has only ever been run interactively, from that Mac. Same
      # class as IMP-0025 and IMP-0041 — a path that has never executed reports nothing.
      #
      # Requires PROVISION_CERT_PFX_BASE64 and PROVISION_CERT_PASSWORD as ENVIRONMENT
      # secrets on this environment. See .github/actions/install-provisioning-cert.
      #
      # ⚠ REVISED 2026-08-19 AFTER THE REVIEWER ANSWERED WHERE THE CERTIFICATE LIVES.
      #   It is a SELF-SIGNED certificate on the app registration, held in a Mac login
      #   KEYCHAIN — not in Key Vault and not exported anywhere. So on a Linux runner this
      #   step has nothing to install unless someone deliberately exports the .pfx into
      #   PROVISION_CERT_PFX_BASE64, and the reviewer's instruction was the opposite:
      #   "always make a call to the keychain".
      #
      #   The step therefore runs ONLY when that secret exists. When it does not, the
      #   guard below fails the job with the real reason instead of letting fourteen
      #   provisioning steps die one at a time inside Connect-MgGraph.
      #
      #   THE CURRENT ROUTE IS LOCAL: run the pre_deploy / post_deploy / smoke_test steps
      #   from the Mac that holds the keychain, where Get-ProvisioningCertificate resolves
      #   CN=REV-Provisioning-SP directly. See provisioning/common/provisioning-cert.psm1.
      - uses: ./.github/actions/install-provisioning-cert
        if: ${{ secrets.PROVISION_CERT_PFX_BASE64 != '' }}
        with:
          pfx-base64: ${{ secrets.PROVISION_CERT_PFX_BASE64 }}
          pfx-password: ${{ secrets.PROVISION_CERT_PASSWORD }}
          thumbprint: ${{ secrets.PROVISION_CERT_THUMBPRINT }}

      - name: Guard — provisioning needs a certificate this runner does not have
        if: ${{ secrets.PROVISION_CERT_PFX_BASE64 == '' }}
        run: |
          set -euo pipefail
          echo "::error::No PROVISION_CERT_PFX_BASE64 on this environment. The provisioning certificate for this project is a self-signed certificate in a Mac login keychain, which a Linux runner cannot read, so every pre_deploy/post_deploy/smoke_test step calling provisioning/**/*.ps1 would fail at Connect-MgGraph. Either run those steps locally from that Mac, or export the .pfx into PROVISION_CERT_PFX_BASE64 on this GitHub Environment (see .github/actions/install-provisioning-cert)."
          exit 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.validate.outputs.slug }}
          path: build/artifacts

      - name: Run pre_deploy steps from pipeline config
        run: |
          set -euo pipefail
          bash scripts/ci/run-config-steps.sh \
            --config "config/${SLUG}-pipeline.yml" \
            --path ".environments.${TARGET_ENV}.pre_deploy" \
            --label "pre_deploy (${TARGET_ENV})" \
            --value-field 'script' \
            --name-field 'description'

      - name: Promote via Power Platform Pipelines
        run: |
          set -euo pipefail
          bash scripts/ci/promote-via-pipelines.sh "config/${SLUG}-pipeline.yml" "${TARGET_ENV}"

      - name: Verify the expected solution version is present in TST/ACC
        run: |
          set -euo pipefail
          bash scripts/ci/verify-promoted-version.sh "config/${SLUG}-pipeline.yml" "${TARGET_ENV}" "${ENV_URL}"

      - name: Run post_deploy steps from pipeline config
        run: |
          set -euo pipefail
          bash scripts/ci/run-config-steps.sh \
            --config "config/${SLUG}-pipeline.yml" \
            --path ".environments.${TARGET_ENV}.post_deploy" \
            --label "post_deploy (${TARGET_ENV})" \
            --value-field 'script' \
            --name-field 'description'

      - name: Run smoke tests from pipeline config
        run: |
          set -euo pipefail
          bash scripts/ci/run-config-steps.sh \
            --config "config/${SLUG}-pipeline.yml" \
            --path ".environments.${TARGET_ENV}.smoke_tests" \
            --label "smoke_test (${TARGET_ENV})" \
            --value-field 'command' \
            --name-field 'description'

      # Rollback is never executed by CI. Under Pipelines the first-choice
      # rollback is redeploying a previous version from the pipeline's run
      # history, not re-importing a zip — see rollback_command in the config.
      - name: Rollback guidance (manual)
        if: failure()
        run: |
          set -euo pipefail
          PIPELINE_CONFIG="config/${SLUG}-pipeline.yml"
          ROLLBACK=$(yq -r ".environments.${TARGET_ENV}.rollback_command // \"<none configured>\"" "$PIPELINE_CONFIG")
          echo "::warning::Deployment to '${TARGET_ENV}' failed. Configured rollback route (perform manually after review):"
          echo "$ROLLBACK"

  # ───────────────────────────────────────────────────────────────────────────
  # 5. PRD — the single remaining human deployment gate below Stage 0.
  #    Runs only after a successful TST/ACC promotion. The `prd` GitHub
  #    Environment MUST carry required reviewers: that protection rule is the
  #    APPROVE PRD gate.
  #
  #    Pipelines independently enforces stage order, so PRD cannot receive a
  #    version TST/ACC has not already taken — a second, platform-level
  #    guarantee behind this job's `needs:`.
  # ───────────────────────────────────────────────────────────────────────────
  promote-prd:
    name: Promote to PRD (gated — APPROVE PRD)
    runs-on: ubuntu-latest
    needs: [validate, promote-tst-acc]
    environment: prd
    permissions:
      id-token: write
      contents: read
    env:
      SLUG: ${{ needs.validate.outputs.slug }}
      TARGET_ENV: prd
      ENV_URL_DEV: ${{ secrets.ENV_URL_DEV }}
      ENV_URL_PRD: ${{ secrets.ENV_URL_PRD }}
      ENV_URL: ${{ secrets.ENV_URL_PRD }}
      PIPELINE_STAGE_ID: ${{ secrets.PIPELINE_STAGE_ID }}
      PROVISION_APP_ID: ${{ secrets.PROVISION_APP_ID }}
      PROVISION_CERT_THUMBPRINT: ${{ secrets.PROVISION_CERT_THUMBPRINT }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-powerplatform
        with:
          environment-url: ${{ secrets.ENV_URL_DEV }}
          app-id: ${{ secrets.APP_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          profile-name: ci-promote-prd

      # ── THE PROVISIONING CERTIFICATE MUST BE ON THE RUNNER ──────────────────
      # NEW 2026-08-19. This job already exported PROVISION_APP_ID and
      # PROVISION_CERT_THUMBPRINT, but a thumbprint is a LOOKUP KEY into a certificate
      # store — not a credential. The store on a fresh ubuntu-latest runner is empty,
      # and the only copy of this certificate lives in a Mac keychain (IMP-0022). So
      # every `pwsh provisioning/**` step in pre_deploy, post_deploy and smoke_tests
      # below would have thrown inside Connect-MgGraph / Connect-PnPOnline.
      #
      # It had never surfaced because no environment above DEV has been deployed to:
      # DEV provisioning has only ever been run interactively, from that Mac. Same
      # class as IMP-0025 and IMP-0041 — a path that has never executed reports nothing.
      #
      # Requires PROVISION_CERT_PFX_BASE64 and PROVISION_CERT_PASSWORD as ENVIRONMENT
      # secrets on this environment. See .github/actions/install-provisioning-cert.
      #
      # ⚠ REVISED 2026-08-19 AFTER THE REVIEWER ANSWERED WHERE THE CERTIFICATE LIVES.
      #   It is a SELF-SIGNED certificate on the app registration, held in a Mac login
      #   KEYCHAIN — not in Key Vault and not exported anywhere. So on a Linux runner this
      #   step has nothing to install unless someone deliberately exports the .pfx into
      #   PROVISION_CERT_PFX_BASE64, and the reviewer's instruction was the opposite:
      #   "always make a call to the keychain".
      #
      #   The step therefore runs ONLY when that secret exists. When it does not, the
      #   guard below fails the job with the real reason instead of letting fourteen
      #   provisioning steps die one at a time inside Connect-MgGraph.
      #
      #   THE CURRENT ROUTE IS LOCAL: run the pre_deploy / post_deploy / smoke_test steps
      #   from the Mac that holds the keychain, where Get-ProvisioningCertificate resolves
      #   CN=REV-Provisioning-SP directly. See provisioning/common/provisioning-cert.psm1.
      - uses: ./.github/actions/install-provisioning-cert
        if: ${{ secrets.PROVISION_CERT_PFX_BASE64 != '' }}
        with:
          pfx-base64: ${{ secrets.PROVISION_CERT_PFX_BASE64 }}
          pfx-password: ${{ secrets.PROVISION_CERT_PASSWORD }}
          thumbprint: ${{ secrets.PROVISION_CERT_THUMBPRINT }}

      - name: Guard — provisioning needs a certificate this runner does not have
        if: ${{ secrets.PROVISION_CERT_PFX_BASE64 == '' }}
        run: |
          set -euo pipefail
          echo "::error::No PROVISION_CERT_PFX_BASE64 on this environment. The provisioning certificate for this project is a self-signed certificate in a Mac login keychain, which a Linux runner cannot read, so every pre_deploy/post_deploy/smoke_test step calling provisioning/**/*.ps1 would fail at Connect-MgGraph. Either run those steps locally from that Mac, or export the .pfx into PROVISION_CERT_PFX_BASE64 on this GitHub Environment (see .github/actions/install-provisioning-cert)."
          exit 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.validate.outputs.slug }}
          path: build/artifacts

      - name: Run pre_deploy steps from pipeline config
        run: |
          set -euo pipefail
          bash scripts/ci/run-config-steps.sh \
            --config "config/${SLUG}-pipeline.yml" \
            --path ".environments.${TARGET_ENV}.pre_deploy" \
            --label "pre_deploy (${TARGET_ENV})" \
            --value-field 'script' \
            --name-field 'description'

      - name: Promote via Power Platform Pipelines
        run: |
          set -euo pipefail
          bash scripts/ci/promote-via-pipelines.sh "config/${SLUG}-pipeline.yml" "${TARGET_ENV}"

      - name: Verify the expected solution version is present in PRD
        run: |
          set -euo pipefail
          bash scripts/ci/verify-promoted-version.sh "config/${SLUG}-pipeline.yml" "${TARGET_ENV}" "${ENV_URL}"

      - name: Run post_deploy steps from pipeline config
        run: |
          set -euo pipefail
          bash scripts/ci/run-config-steps.sh \
            --config "config/${SLUG}-pipeline.yml" \
            --path ".environments.${TARGET_ENV}.post_deploy" \
            --label "post_deploy (${TARGET_ENV})" \
            --value-field 'script' \
            --name-field 'description'

      - name: Run smoke tests from pipeline config
        run: |
          set -euo pipefail
          bash scripts/ci/run-config-steps.sh \
            --config "config/${SLUG}-pipeline.yml" \
            --path ".environments.${TARGET_ENV}.smoke_tests" \
            --label "smoke_test (${TARGET_ENV})" \
            --value-field 'command' \
            --name-field 'description'

      # PRD rollback is NEVER automatic (pipeline config: rollback_requires_human).
      - name: Rollback guidance (manual)
        if: failure()
        run: |
          set -euo pipefail
          PIPELINE_CONFIG="config/${SLUG}-pipeline.yml"
          ROLLBACK=$(yq -r ".environments.${TARGET_ENV}.rollback_command // \"<none configured>\"" "$PIPELINE_CONFIG")
          echo "::warning::Deployment to '${TARGET_ENV}' failed. rollback_requires_human — perform the configured rollback route manually after review:"
          echo "$ROLLBACK"
