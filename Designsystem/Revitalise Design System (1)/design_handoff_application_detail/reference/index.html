<!-- @dsCard group="Trustee Review Portal" viewport="1280x800" name="Trustee Review Portal (redesign)" subtitle="Power Platform code app restyled to fit the brand" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--grey-50)}
.rv-card{background:var(--white);border-radius:var(--radius-lg);box-shadow:0 1px 2px rgba(43,43,43,.04),0 6px 20px rgba(43,43,43,.07);transition:box-shadow var(--duration-base) var(--ease-standard),transform var(--duration-base) var(--ease-standard)}
.rv-card.rv-lift:hover{box-shadow:0 2px 4px rgba(43,43,43,.05),0 16px 40px rgba(43,43,43,.12);transform:translateY(-2px)}
.rv-card:has(> .rv-table){border-radius:16px}
.rv-table tbody tr{transition:background var(--duration-fast) var(--ease-standard)}
.rv-table tbody tr:hover{background:var(--grey-50)}
.rv-table tbody tr:last-child{border-bottom:none!important}
.rv-nav button[aria-current="page"]{box-shadow:0 4px 12px rgba(237,0,140,.28)}
.rv-nav button:not([aria-current]):hover{background:var(--grey-50)!important}
.rv-btn{transition:transform var(--duration-fast) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard)!important;min-height:44px}
.rv-btn-primary{background:linear-gradient(180deg,#ec1a8c 0%,var(--pink-600) 100%)!important;border-color:transparent!important;box-shadow:0 1px 2px rgba(158,0,87,.12),0 3px 8px rgba(230,2,127,.12)}
.rv-btn-primary:hover{background:linear-gradient(180deg,var(--pink-600) 0%,var(--pink-700) 100%)!important;box-shadow:0 2px 4px rgba(158,0,87,.14),0 6px 14px rgba(230,2,127,.16)}
.rv-btn-secondary{background:var(--white)!important;box-shadow:0 1px 2px rgba(43,43,43,.06)}
.rv-btn-secondary:hover{background:var(--pink-50)!important;box-shadow:0 2px 6px rgba(43,43,43,.08)}
.rv-btn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.rv-nav button[aria-current="page"]{background:var(--brand-primary)!important;box-shadow:0 2px 6px rgba(230,2,127,.18)!important}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./Shared.jsx"></script>
<script type="text/babel" src="./AppFrame.jsx"></script>
<script type="text/babel" src="./RoundOverview.jsx"></script>
<script type="text/babel" src="./ApplicationsList.jsx"></script>
<script type="text/babel" src="./GroupScreens.jsx"></script>
<script type="text/babel" src="./ApplicationDetail.jsx"></script>
<script type="text/babel" src="./TrusteePortalApp.jsx"></script>
</body></html>
