<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px base unit, --space-1 through --space-24" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:100%;display:flex;align-items:flex-end;gap:6px;padding:16px 20px;font-family:var(--font-body)">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:16px;height:var(--space-1);background:var(--pink-600)"></div><span style="font-size:11px;color:var(--text-muted)">1</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:16px;height:var(--space-2);background:var(--pink-600)"></div><span style="font-size:11px;color:var(--text-muted)">2</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:16px;height:var(--space-4);background:var(--pink-600)"></div><span style="font-size:11px;color:var(--text-muted)">4</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:16px;height:var(--space-6);background:var(--pink-600)"></div><span style="font-size:11px;color:var(--text-muted)">6</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:16px;height:var(--space-8);background:var(--pink-600)"></div><span style="font-size:11px;color:var(--text-muted)">8</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:16px;height:var(--space-12);background:var(--pink-600)"></div><span style="font-size:11px;color:var(--text-muted)">12</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:16px;height:var(--space-16);background:var(--pink-600)"></div><span style="font-size:11px;color:var(--text-muted)">16</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:16px;height:var(--space-24);background:var(--pink-600)"></div><span style="font-size:11px;color:var(--text-muted)">24</span></div>
</div>
