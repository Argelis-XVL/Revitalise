# ═════════════════════════════════════════════════════════════════════════════
# SPECIAL-CATEGORY COLUMN REGISTER
#
# The single source of truth for which columns of this solution hold UK GDPR
# Article 9 special-category data, safeguarding data, or data the SDD classifies
# at the highest restriction tier.
#
# Owner: Domain Owner / Compliance Lead (see constraints/README.md).
# Read at check time by:
#   * scripts/verify-domain-invariants.py    — C-DOM-030 / C-DOM-031 / C-DOM-032
#   * the `no-special-category-data-in-scoring` gate in config/<slug>-build.yml,
#     whose grep alternation must match this file exactly (the script asserts it)
#
# ── WHY A FILE AND NOT A PARAGRAPH ───────────────────────────────────────────
# This list previously existed only as a regex alternation inside a shell one-liner
# in config/revitalise-grant-automation-build.yml, maintained by hand. The build
# config's own comments record it being edited four times in eight days — six names
# added in the schema revision pass, five more in the Task 2 audit, four added and
# one removed in the form-field-corrections pass — each time by someone remembering
# to. The comment beside it says it plainly: "must grow with every future
# special-category column, or the gate silently narrows."
#
# A list that must be remembered is the same failure mode as a limit transcribed
# into a script, which is what C-TECH-060 was created to end. So the list lives
# here once, and every consumer reads it. If this file and the build gate disagree,
# verify-domain-invariants.py fails the build and names the difference.
#
# ── HOW TO ADD A COLUMN ──────────────────────────────────────────────────────
# WHO APPLIES STEP 1: not you, unless you are improvement-agent or the reviewer.
# .claude/hooks/protect-system-rules.py refuses Edit/Write against constraints/ from every
# dispatched subagent except improvement-agent, and this file lives under constraints/. So the
# agent that secures a column — normally development-agent, in the same pass that writes
# Entity.xml and FieldSecurityProfiles.xml — CANNOT write the row here, and will be refused at
# the moment it tries. It PROPOSES the row in its Dev Summary and gate output; improvement-agent
# or the reviewer APPLIES it. Steps 2-4 below are unaffected and stay with the implementing agent.
# This is friction by design, not an oversight: the hook is a control, and the fix for a control
# that refuses a legitimate write is a documented route around the keyboard, never a hole in the
# control (IMP-0622, which is what this paragraph is; the alternative — a pattern-matched
# carve-out in the hook — was proposed by that finding and refused in
# docs/improvements/2026-09-06-improvement-review.md section 3).
#
# 1. Add a row below with its entity, basis and classification source.
# 2. Secure it in Entities/<entity>/Entity.xml (<IsSecured>1</IsSecured>) and add it
#    to the field security profile, OR record a `security_exception` here with a
#    reason and an owner.
# 3. Add the same name to the FR-016 alternation in the build config.
# 4. Run: python3 scripts/verify-domain-invariants.py src/solutions/RevitaliseGrantAutomation
#
# ── AND IF YOU ARE SECURING A COLUMN THAT IS *NOT* SPECIAL-CATEGORY DATA ─────
# Every <IsSecured>1</IsSecured> column in this solution must appear in EITHER `columns:`
# above OR `pending_adjudication:` below — C-DOM-033, HARD, enforced by the same script as
# step 4. There is no third option, and that is deliberate: this procedure existed in full
# on 2026-08-27 and rev_ethnicgroup was still built, secured, flow-mapped and shipped without
# ever reaching this file, because nothing failed when it did not (IMP-0598, blocker, eight
# days undetected). A procedure that depends on being remembered is the failure mode
# C-TECH-060 was created to end — the same lesson IMP-0038 / IMP-0155 / IMP-0212 taught for
# the other hand-kept lists in this codebase.
#
# ⚠️ marks a position not yet confirmed by the party who owns it — the convention
#    used in knowledge/domain/business-rules.md. Treat as the current working
#    position, not as settled.
# ═════════════════════════════════════════════════════════════════════════════

meta:
  owner: Domain Owner / Compliance Lead (Revitalise) — DPO notified for any change
  sources:
    - "SDD FR-016 — disability, health-condition and free-text narrative data must not
       influence the automated score"
    - "SDD §7.1 — data classification; benefit status is classified at the highest
       restriction tier"
    - "TAD §3.1 / §3.3 — Article 9 column classification"
    - "docs/Import/Revitalise-DPIA-v0.1.docx, Revitalise-RoPA-v0.1.docx"
    - "UK GDPR Art. 9; Data (Use and Access) Act 2025 position recorded in the SDD"
  build_gate_step: no-special-category-data-in-scoring
  scoring_flow: >
    src/solutions/RevitaliseGrantAutomation/Workflows/REVScoringCalculateAndFlag-8F1C2A44-1002-4B7A-9E21-0A1B2C3D4E02.json

# ── The register ─────────────────────────────────────────────────────────────
# `secured: required` — the column must carry <IsSecured>1</IsSecured>.
# `secured: exception` — deliberately NOT column-secured; `reason` and `owner` are
#                        mandatory and the gate reports it on every run.
# Every row is barred from the automated score regardless of its `secured` value.
columns:

  # ── Free-text health / disability narrative ────────────────────────────────
  - name: rev_narrativeraw
    entity: rev_application
    basis: "Art. 9 — health; free-text narrative (FR-016)"
    secured: required
  - name: rev_otherconditionraw
    entity: rev_application
    basis: "Art. 9 — health condition, free text (FR-016)"
    secured: required
  - name: rev_supportrecipientotherconditionraw
    entity: rev_application
    basis: "Art. 9 — health condition of the supported person, free text"
    secured: required
  - name: rev_caresupportdescription
    entity: rev_application
    basis: "Art. 9 — care and support needs, free text"
    secured: required
  - name: rev_carecostsexplanation
    entity: rev_application
    basis: "Art. 9 — care costs narrative (reveals condition and care intensity)"
    secured: required
  - name: rev_exceptionalfundingdetail
    entity: rev_application
    basis: "Art. 9 — exceptional-circumstance narrative"
    secured: required
  - name: rev_otherexceptionalcircumstance
    entity: rev_application
    basis: "Art. 9 — exceptional-circumstance free text"
    secured: required
  - name: rev_careprovidedexample
    entity: rev_application
    basis: "Art. 9 — description of care given, free text"
    secured: required
  - name: rev_othercareprovidedtype
    entity: rev_application
    basis: "Art. 9 — care type, free text"
    secured: required
  - name: rev_consentexplanation
    entity: rev_application
    basis: "Art. 9 — consent narrative may restate condition detail"
    secured: required
  - name: rev_intakereviewnote
    entity: rev_application
    basis: "Art. 9 — intake reviewer's free-text note (TAD §3.1/§3.3)"
    secured: required

  # ── Coded health / benefit / employment attributes ─────────────────────────
  - name: rev_receivesbenefits
    entity: rev_application
    basis: "SDD §7.1 — benefit status, classified at the highest restriction tier"
    secured: required
  - name: rev_benefitprovider
    entity: rev_application
    basis: "SDD §7.1 — benefit provider, same tier as benefit status"
    secured: required
  - name: rev_employmentstatus
    entity: rev_application
    basis: "Art. 9 by TAD §3.1/§3.3 classification"
    secured: required

  # ── Racial or ethnic origin ────────────────────────────────────────────────
  # ADDED 2026-09-04 by improvement review (IMP-0598, blocker). This column had been live and
  # correctly secured since 2026-08-27 and was ABSENT from this register for eight days, while
  # its own Entity.xml Description read "UK GDPR ARTICLE 9 special-category data (Tier 4)".
  # It is also the FIRST row in this register on a table other than rev_application, which is
  # part of why the omission was easy to miss: every reader's mental model of this file was
  # "the application table's sensitive columns".
  - name: rev_ethnicgroup
    entity: rev_applicant
    basis: "Art. 9 — racial or ethnic origin (coded); TAD §3.1 Tier 4, SDD OQ-027 resolved by
            reviewer direction 2026-08-27"
    secured: required

  # ── Safeguarding ───────────────────────────────────────────────────────────
  # Not itself health data, but a safeguarding concern must never silently
  # influence a numeric score — the build gate's own belt-and-braces position.
  - name: rev_safeguardingflag
    entity: rev_application
    basis: "Safeguarding concern — barred from automated scoring by project policy"
    secured: required
  - name: rev_safeguardingnotes
    entity: rev_application
    basis: "Safeguarding concern, free text"
    secured: required

  # ── Documented security exceptions — CONFIRMED BY THE REVIEWER 2026-08-19 ──
  # These four are Article 9 and are BARRED FROM SCORING like every other row, but they
  # are deliberately readable by the trustee panel rather than column-secured.
  #
  # THE RULE, in the reviewer's own words (2026-08-19):
  #   "It's correct they can see the category but not the free text. Because the free
  #    text still needs redacting / pseudonymising in a later phase."
  #
  # So the split is not arbitrary and it is not permanent:
  #   • the CODED category is panel-visible, because the trustee panel cannot make an
  #     award decision without it;
  #   • the FREE TEXT is column-secured **because it has not been redacted yet**.
  #
  # ⏳ THIS POSTURE IS TIME-BOUND. WBS Automation #5 "Narrative Scrubbing (free-text)",
  #    Phase 3, introduces AI redaction of exactly these free-text columns. When that
  #    lands, the reason for securing them changes — the text will be redacted rather
  #    than raw — and this register must be revisited rather than assumed still correct.
  #    Do NOT relax any of these four on the strength of Phase 3 shipping: the coded
  #    categories stay panel-visible for the panel's benefit, which is a separate reason
  #    that Phase 3 does not touch.
  #
  #    Whoever implements Automation #5: re-read this block before changing IsSecured on
  #    any free-text column, and record the outcome here.
  - name: rev_conditionprofile
    entity: rev_application
    basis: "Art. 9 — health condition profile (coded)"
    secured: exception
    reason: >
      Panel-visible: the trustee panel cannot assess the application without the coded
      condition profile. Its free-text elaboration (rev_otherconditionraw) is secured
      because that text is not yet redacted — WBS Automation #5, Phase 3.
    owner: "Reviewer (Xander Lykopoulos), confirmed 2026-08-19"
  - name: rev_supportrecipientconditionprofile
    entity: rev_application
    basis: "Art. 9 — condition profile of the supported person (coded)"
    secured: exception
    reason: >
      Panel-visible, same basis as rev_conditionprofile. The free-text variant
      (rev_supportrecipientotherconditionraw) is secured pending redaction (Automation #5).
    owner: "Reviewer (Xander Lykopoulos), confirmed 2026-08-19"
  - name: rev_careprovidedtype
    entity: rev_application
    basis: "Art. 9 — type of care provided by the applicant (coded)"
    secured: exception
    reason: >
      Panel-visible category. The free-text variants (rev_othercareprovidedtype,
      rev_careprovidedexample) are secured pending redaction (Automation #5).
    owner: "Reviewer (Xander Lykopoulos), confirmed 2026-08-19"
  - name: rev_exceptionalcircumstance
    entity: rev_application
    basis: "Art. 9 — exceptional circumstance (coded)"
    secured: exception
    reason: >
      Panel-visible category. The free-text variants (rev_otherexceptionalcircumstance,
      rev_exceptionalfundingdetail) are secured pending redaction (Automation #5).
    owner: "Reviewer (Xander Lykopoulos), confirmed 2026-08-19"

# ── COLUMN-SECURED, ARTICLE 9 ADJUDICATION NOT YET RECORDED ──────────────────
#
# ⚠️ THIS BLOCK IS A DEBT, NOT A CLEARANCE. Read the next paragraph before using it.
#
# WHAT IT IS. Every attribute in this solution carrying <IsSecured>1</IsSecured> that is NOT in
# `columns:` above. C-DOM-033 requires every secured column to appear in exactly one of the two
# lists, so a NEWLY secured column lands in neither and fails the build by name. That is the whole
# mechanism, and it is the reason this block exists.
#
# WHAT IT IS NOT: a finding that these 51 columns are not Article 9 data. Nobody with the authority
# to make that call has made it. This file's owner is the Domain Owner / Compliance Lead
# (constraints/README.md), and enumerating a column here records only that it is secured and that
# its Article 9 status has not been adjudicated in writing. The ⚠️ is this file's own convention for
# a position its owner has not confirmed — see the header.
#
# WHY IT WAS BUILT THIS WAY. IMP-0598 (blocker) proposed scanning Entity.xml descriptions for
# Article-9 language. Measured against all 226 attributes on 2026-09-04, every available automatic
# signal is noise: description text case-insensitively → 9 findings / 1 true positive (11%), and its
# false positives are precisely the columns whose authors documented NON-membership most carefully
# (rev_gender's "gender is not a UK GDPR Article 9 category", rev_hearaboutus, rev_review.rev_notes1,
# and the five *redacted counterparts that name their Article 9 SOURCE) — the inverted polarity
# IMP-0422/IMP-0428 record, where better documentation produces more findings. IsSecured alone →
# 52 findings / 1 true positive (2%). REV_TrusteeRestricted membership → 36 / 1 (3%), and that one
# fails for a STATED reason: the profile's own description says it releases "the Tier 4 identifying
# AND special-category columns", so it was never built to separate them.
#
# Article 9 membership is a legal judgement about what data MEANS. No property of the XML decides
# it, so the gate asserts the one thing that is decidable — that every secured column has been
# LOOKED AT — and leaves the judgement to its owner. That is the narrowing recorded in
# docs/improvements/2026-09-04-improvement-review.md section 3.
#
# HOW TO DISCHARGE A ROW: decide, then move it. If the column IS Article 9 or highest-tier, move it
# into `columns:` with a basis. If it is not, delete it from here and record the decision in the
# column's own Entity.xml <Description>, the way rev_gender already does. Deleting a row without
# deciding re-opens IMP-0598.
#
# Enumerated from source, never typed: the list below was generated by scanning
# Entities/*/Entity.xml for IsSecured=1 and subtracting `columns:`.
