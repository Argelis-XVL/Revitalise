    # ── NEW 2026-08-14 — closes the "hand-authored solution XML is unsupported" gap ──
    # Microsoft's own documentation states that creating Entities, Attributes, Entity
    # Relationships, Option Sets, Security Roles and Field Security Profiles FROM SCRATCH
    # via solution import/customizations.xml is unsupported (only editing components first
    # exported from a real environment is): https://learn.microsoft.com/en-us/power-platform/
    # alm/when-edit-customization-file. This was discovered live against DEV — every fix to
    # the hand-authored XML under src/solutions/RevitaliseGrantAutomation/{Entities,OptionSets}
    # revealed a deeper undocumented mismatch, ending in "PrimaryName attribute not found",
    # which does not correspond to any documented customizations.xml element at all. The whole
    # schema is therefore now created ONCE in DEV via the Dataverse Web API metadata endpoints
    # instead — see ensure-schema.ps1's own header for the full rationale, the 7-step build
    # order, and every Web API shape verified (and NOT verified) this session. Runs LAST in
    # this list because it needs: REV-MS-Provisioning's admin consent (above) for
    # its Dataverse access token, and the DEV environment to exist (created 2026-08-14). Power
    # Platform Pipelines (ADR-007) promotes the resulting schema to TST/ACC and PRD from here —
    # this step never runs again after the first successful DEV run.
    - description: >
        Create the entire Phase 1 Dataverse schema in DEV — 16 global option sets, the 4
        tables and every column, the applicant→application relationship (plus one synthetic
        relationship the source XML's own rev_overriddenby lookup requires but never declares
        — see the script header), the two security roles with full privilege depth, and the
        REV_TrusteeRestricted field security profile with all 34 field permissions. DEV ONLY,
        run once. Two items need a decision before this can be treated as done, not just run:
        (1) rev_fullname and rev_costs are created as plain writable columns, not calculated —
        FormulaDefinition syntax was not verified and the script prints an instruction to
        convert them by hand in the maker portal; (2) confirm the synthetic relationship's
        NoCascade/RemoveLink defaults are acceptable (the source XML defines no cascade
        behaviour for this lookup at all, since it never declares the relationship).
      script: provisioning/dataverse/ensure-schema.ps1 -Env dev
    # ── NEW 2026-08-14 — closes D-020, found the same day as the DEV deployment above ──
    # seed-settings.ps1 was wired into the `test` and `prd` stages below (post_deploy) from
    # the day it was written, and NEVER into DEV — there was no DEV-specific settings file to
    # give it (Phase 1 deliberately has no dev-settings.json; see the comment on that file's
    # absence elsewhere in this document). The result, confirmed live 2026-08-14 with a
    # FetchXML query against rev_setting in REV-GrantApplications-DEV returning "No results
    # returned": every flow action that reads a threshold or a point map — including every
    # action in "REV | Scoring | Calculate & Flag" — had nothing to read. Runs here, in the
    # same DEV-only, run-once bucket as ensure-schema.ps1 above and behind the same
    # APPROVE TENANT gate, for the same reason: both are one-time DEV setup that Power
    # Platform Pipelines does not and cannot perform (it promotes solution components and
    # environment prerequisites, never Dataverse table ROWS). Depends on the schema step
    # immediately above (rev_setting must exist before it can be seeded) and on the solution
    # import that creates rev_setting's alternate key rev_setting_name.
    - description: >
        Seed the eleven rev_setting rows in DEV from provisioning/deploymentSettings/
        dev-scoring-settings.json — a dedicated file, not dev-settings.json (D-020;
        seed-settings.ps1's own header explains why dev-settings.json must continue not to
        exist). Values are copied from test-settings.json, including the PROVISIONAL
        KnockoutThreshold/BorderlineBand/IncomeCeiling figures already accepted for TST/ACC,
        so a developer testing the scoring flow in DEV sees the same behaviour QA sees in
        TST/ACC (SDD OQ-001/002/003 remain open for the board, i.e. for PRD only).
      script: provisioning/dataverse/seed-settings.ps1 -Env dev

environments:

  # ── DEV — added 2026-08-18 (WBS 0.4-R) ──────────────────────────────────────
  # THIS BLOCK DID NOT EXIST BEFORE. DEV was imported by GitHub Actions `stage-dev`
  # with no declared prerequisites at all, which is how the first deployment into it
  # cost fifteen import attempts. TAD §12.1 and C-TECH-050 require the things a deploy
  # cannot CREATE — only update — to be declared and run BEFORE the first import into
  # EVERY environment, and DEV is an environment.
  #
  # pipeline-agent: confirm you consume a `dev` entry. If your Stage 0.5 iterates
  # `environments` by name and only knows tst_acc/prd, these steps will be skipped
  # silently — which is the failure mode this block exists to prevent. Say so in your
  # gate output rather than assuming.
  dev:
    auto_deploy: true            # Stage Dev→Test is automatic per WORKFLOW.md
    promote_mode: n/a            # GitHub Actions `stage-dev` imports here, not Pipelines
    env_url: $ENV_URL_DEV

    # ── Stage 0.5 — environment prerequisites (C-TECH-050, C-TECH-051) ────────
    # Everything the solution import cannot create on first encounter. Re-run per
    # environment: DEV being prepared says nothing about TST/ACC or PRD.
    environment_prerequisites:
      - description: >
          Create the rev_grant entity, its attributes and the rev_grantstatus global
          option set via the Dataverse Web API before the first import that references
          them. C-TECH-050: Entities/Attributes and Global OptionSets are never assumed
          creatable by a first solution import. rev_grant was added to
          Get-RevEntityLogicalNames on 2026-08-18 — an entity absent from that list is
          one this step silently does not create (IMP-0038).
        script: provisioning/dataverse/ensure-schema.ps1 -Env dev
      - description: >
          Confirm the alternate key on rev_grant.rev_applicationid was created — it is declared
          in Entities/rev_grant/Entity.xml as <EntityKeys> and created by the SAME ensure-schema
          run as step 1, not by a separate switch (an earlier draft of this config invented a
          -AlternateKeysOnly parameter that does not exist — IMP-0042). It enforces one grant
          per application (ADR-G02). THIS CLOSES ASSUMPTION A-G01, which is
          currently OPEN: alternate keys on a lookup column are unproven in this repo.
          C-TECH-058 blocks this deploy while A-G01 is OPEN, so run this and record the
          result BEFORE reporting the deploy. If it fails, the fallback is a
          duplicate-detection rule plus a guard in the future finalise flow — weaker, and
          it must be recorded as such, not quietly accepted.
        script: provisioning/dataverse/ensure-schema.ps1 -Env dev   # same run as step 1 — the key is declared in Entity.xml
      - description: >
          Create the signed-acceptance document library inside the designated SharePoint
          site, BREAK PERMISSION INHERITANCE, and grant Contribute to the REV Admins and
          REV Service Accounts groups only. Trustees are granted nothing — they read
          Dataverse and have no business with signed PDFs (reviewer, plan gate OQ-G02).
          Inheritance must be broken because ADR-G01 shares one site across environments,
          so an inherited permission crosses an environment boundary as well as a persona
          one (TAD risk R-G05). Read the ACL back afterwards; do not trust the set call's
          exit code (IMP-0013's class).
        script: manual   # BLOCKED — see below. ensure-site.ps1 takes only -Env; -LibraryOnly does not exist
        blocked_on: >
          Three things are missing and none is a one-liner. (1) A PnP site template under
          provisioning/sharepoint/templates/ declaring the library — that folder holds only a
          README, and ensure-site.ps1 treats the template as the source of truth for libraries,
          content types and columns. (2) A dev SharePoint settings block: Get-ProvisioningSettings
          -Env dev deliberately throws, which several scripts rely on. (3) PnP/Graph permission on
          the designated site for the provisioning app. Until these exist the library is created by
          hand or not at all, and assumption A-G03 stays OPEN. IMP-0046.
      - description: >
          MANUAL — record written evidence of the SharePoint site's UK region and retain
          it with the Deployment Summary. NFR-009 and DPIA action A5 are OPEN; this slice
          adds a new store of personal data and must not widen that gap (TAD risk R-G06).
        script: manual
      - description: >
          Add the twelve new rev_grant columns to the REV_TrusteeRestricted column-security
          profile's membership set. Profile MEMBERSHIP is not a solution component
          (C-TECH-050) — the profile ships, its members do not.
        script: provisioning/dataverse/ensure-column-security-profile-members.ps1 -Env dev
      - description: >
          Bind REV Admin and REV Service Automation to their group teams so the five new
          rev_grant privileges take effect. Roles are looked up BY NAME (C-TECH-040).
        script: provisioning/dataverse/bind-roles-to-groups.ps1 -Env dev
      - description: >
          Enable auditing on rev_grant and on every secured column (NFR-014, C-DOM-010).
        script: provisioning/dataverse/ensure-auditing.ps1 -Env dev
      - description: >
          Set the rev_SpoSignedAcceptanceUrl environment variable VALUE for DEV. The
          definition ships in the solution; the value never does (C-TECH-047).
        script: provisioning/dataverse/seed-settings.ps1 -Env dev

    # ── Verification — no stage may claim a level it did not execute ──────────
    verification:
      - level: V3
        description: >
          Query EVERY declared component type by name from a list DERIVED FROM SOURCE:
          entity, attributes, globaloptionset, systemform, savedquery, entityrelationship,
          fieldsecurityprofile permissions, role privileges, environmentvariabledefinition.
          A hand-written subset omits the one that failed — savedquery and systemform were
          both absent from the list that "verified" the first DEV deploy (IMP-0013). Then
          re-run the import once to prove idempotency.
        script: provisioning/dataverse/verify-role-bindings.ps1 -Env dev
      - level: V3
        description: >
          Compare the LIVE rev_grantstatus option-set members against source. Import
          relabels matching values but never deletes omitted ones, and orphans survive
          every later import (IMP-0019). Four values expected: 1 Awarded, 2 Acceptance
          Issued, 3 Acceptance Signed, 4 Paid — and nothing else.
        script: manual
      - level: V4
        description: >
          NAMED HUMAN STEP, REQUIRED BEFORE THIS ENVIRONMENT IS CALLED DEPLOYED
          (C-TECH-053). A named person opens the rev_grant main form in REV Grant
          Administration, creates a record against a test application, SAVES it, and
          opens each of the three views. Import acceptance and designer usability are
          different properties: three components once imported cleanly, were queryable,
          and still could not be opened or saved (IMP-0012). While saving, check the form
          LABELS against each attribute's authored displayname — no test asserts label
          text (IMP-0015).
        owner: TBC — name the person in the Deployment Summary
        script: manual
      - level: V5
        description: >
          NOT REACHABLE FOR THIS SLICE, and must not be claimed. No automation writes to
          rev_grant until WBS 3.2/3.4 build the acceptance flows, so there is no
          end-to-end behaviour to execute.
        script: n/a

  # ── TST/ACC — combined Test and Acceptance ──────────────────────────────────
  tst_acc:
    auto_deploy: true            # no APPROVE ACC gate exists; see promote_mode below
    # No `gate:` key by design. Acceptance sign-off happens inside this stage
    # alongside the test-agent gate; APPROVE ACC is not a step for this feature
    # (TAD §9.1). The next human gate is APPROVE PRD.

    # ── Promotion: Power Platform Pipelines, DEV → TST/ACC ────────────────────
    # `deploy_command` is deliberately absent. GitHub Actions does not import
    # into this environment — Pipelines does. See the `alm` block.
    promote_mode: manual         # manual | cli — see alm.promotion_mechanism
    pipeline_stage_name: "Deploy to TST/ACC"
    # Stage GUID is NOT committed: it is per-tenant and does not exist yet.
    # `pac pipeline list --pipeline "REV Grant Automation Standard"` yields it;
    # store it as the PIPELINE_STAGE_ID secret on the `tst_acc` GitHub Environment.
    pipeline_stage_id: $PIPELINE_STAGE_ID
    # Only used when promote_mode is `cli`. Both are 1.0.0.0 for the first
    # release; the exact semantics of current vs new are an OPEN QUESTION
    # (alm.promotion_mechanism.not_verified) and are the second reason this
    # environment promotes manually for now.
    current_version: 1.0.0.0
    new_version: 1.0.0.0
    env_url: $ENV_URL_TEST       # ENV_URL_TEST is the TST/ACC environment (ADR-006)

    # C-TECH-007 — Tier 3/4 data must be synthetic outside PRD. Phase 1 migrates
    # no data, so the control is an explicit pre-deploy guard rather than a
    # masking transform: the deployment must not proceed if real applicant data
    # has reached this environment.
    pre_deploy:
      - description: >
          Confirm TST/ACC holds synthetic or anonymised data only — no real
          applicant PII. Test fixtures are generated by the test-agent; no
          production extract is ever imported here. Reset or segregate test data
          before an acceptance session (TAD §9.1.1).
        script: manual

    post_deploy:
      - description: >
          Create/verify the Dataverse group teams REV Admins and REV Service
          Accounts (type AAD Security Group) and bind REV Admin and REV Service
          Automation to them. Roles are looked up BY NAME in the target
          environment. No direct user-to-role assignment (C-TECH-040).
        script: provisioning/dataverse/bind-roles-to-groups.ps1 -Env test
      - description: >
          Add the group teams as members of the REV_TrusteeRestricted column
          security profile, so the process owner and the service account can read
          and write the Tier 4 columns and nobody else can (TAD §6, NFR-001).
        script: provisioning/dataverse/ensure-column-security-profile-members.ps1 -Env test
      - description: >
          Enable organisation and table auditing on rev_applicant,
          rev_application, rev_setting and rev_errorlog, and set audit retention
          to 6 years (C-DOM-010, C-DOM-011, TAD §6.5).
        script: provisioning/dataverse/ensure-auditing.ps1 -Env test
      - description: >
          Create/verify the recurring bulk-delete retention jobs: rejected
          applications (12 months), withdrawn/incomplete (6 months), orphaned
          applicants (the derived sweep, TAD §3.4 gap 1) and error log (90 days).
          The 6-year paid-grant job arrives with the rev_grant table in a later
          phase (C-DOM-003, ADR-004).
        script: provisioning/dataverse/ensure-bulk-delete-jobs.ps1 -Env test
      - description: >
          Seed/upsert the eleven rev_setting rows — Likert point map, feeling-scale
          inversion, knockout threshold, borderline band lower and upper, income
          ceiling, income-band upper-bound map, age-band map, age-range label map,
          postcode-region map, maximum circumstance score. Seven of the eleven are
          FIXED by requirements (FR-012, FR-013) or are reference data and carry real
          values in every environment; the three threshold rows are the board's criteria and are
          the only ones awaiting SDD OQ-001/002/003. TST/ACC carries clearly
          provisional test values. Upsert is by alternate key rev_setting_name, and
          rev_effectivefrom is written on create only so a pipeline re-run does not
          destroy the evidence of when a value took effect. The script fails fast,
          BEFORE any write, on any unresolved {{...}} token.
        script: provisioning/dataverse/seed-settings.ps1 -Env test
      - description: >
          Associate the REV Grant Administration model-driven app with the
          REV Admin and REV Service Automation roles.
        script: provisioning/dataverse/share-apps.ps1 -Env test
      - description: >
          MANUAL, once per environment — bind the three connection references
          (rev-dataverse, rev-teams, rev-outlook) to connections owned by the
          service account. Interactive OAuth consent is required, so this cannot
          be scripted. The four cloud flows import switched OFF and are turned on
          only after this step (TAD §12). ⚠ Blocked until the WBS 0.3 Conditional
          Access exception is confirmed for unattended sign-in.
        script: manual
      # ── NEW 2026-08-12 — closes test-agent defect D-001 (C-TECH-006 HARD) ──────
      - description: >
          MANUAL, ONCE PER ENVIRONMENT, AND BEFORE THE INTAKE FLOW IS TURNED ON —
          CONFIGURE TRIGGER AUTHENTICATION ON `REV | Intake | WordPress to Dataverse`.
          This is the PRIMARY authentication control on the solution's only public
          endpoint (NFR-008, C-TECH-006). It is a trigger SETTING, not a solution
          component: Microsoft documents it as the "Who can trigger the flow?"
          authentication parameter and publishes no workflow-definition property for it
          (https://learn.microsoft.com/en-us/power-automate/oauth-authentication), so it
          cannot ship in the managed solution and it is applied here instead.
          WHO: Wanstor (tenant administration), with the maker supplying the value.
          WHAT: set the authentication parameter to "Specific users in my tenant" and
          set Allowed users to the SERVICE PRINCIPAL OBJECT ID of rev-wordpress-intake —
          printed by the ensure-intake-client.ps1 step in tenant_prerequisites. Not the
          application (client) id: that one goes to rev_IntakeAllowedClientId.
          ⚠ Leaving Allowed users BLANK under this mode silently widens the scope back
          to the whole tenant (Microsoft's own note), and no test can detect that — so
          read the field back after saving.
          ⚠ ORDER MATTERS: configure this BEFORE turning the flow on. Between switch-on
          and configuration the endpoint is live under whatever default the trigger
          carries.
          WHETHER THIS SETTING SURVIVES A SOLUTION IMPORT IS UNVERIFIED — no environment
          exists yet — so it is configured and then verified on every deployment rather
          than assumed to have carried across. The smoke test below is what closes it.
          Record the value applied in the Deployment Summary (C-TECH-041).
        script: manual

    smoke_tests:
      - description: Imported solution version matches the artifact (C-TECH-030)
        command: pac solution list --environment $ENV_URL_TEST | grep -E 'RevitaliseGrantAutomation[[:space:]]+1\.0\.0\.0'
      # ── NEW 2026-08-12 — the executable form of C-TECH-006's `Verify By` ───────
      # "Security test: unauthenticated request → 401/403". Test-agent recorded this
      # as absent (D-001 / TC-401): no smoke test asserted it anywhere. It runs after
      # the trigger setting is applied and after the flow is turned on, and it fails
      # the deployment if the endpoint answers anything else.
      #
      # It does three things, and the second is the one that matters. A 401 alone is
      # not proof, because the flow's OWN second gate also answers 401 — so the check
      # asserts the response is NOT the definition's {"error":"unauthorised"} body,
      # which is how it distinguishes "the platform rejected this" from "the request
      # got into the workflow and the client-id header check stopped it". The latter is
      # precisely the state D-001 describes and it fails the smoke test.
      #
      # Safe against a live environment: the probe carries no personal data, omits the
      # x-rev-client-id header, and is incomplete against the trigger's `required`
      # array, so no outcome can create a row. Needs the INTAKE_ENDPOINT_URL_TEST
      # secret — the trigger URL carries its own SAS `sig=` and is a credential, so it
      # is never a value in a settings file (C-TECH-001/047).
      - description: >
          C-TECH-006 / NFR-008 — the intake endpoint rejects an unauthenticated caller
          with 401/403, and rejects it BEFORE the workflow definition runs. Also
          asserts an invalid bearer token is rejected, i.e. the token is validated
          rather than merely required.
        command: pwsh provisioning/entra/verify-intake-endpoint-auth.ps1 -Env test
      - description: >
          Group teams exist, hold exactly the TAD §6.1 roles, and no feature role
          has a direct user assignment (C-TECH-040)
        command: pwsh provisioning/dataverse/verify-role-bindings.ps1 -Env test
      - description: Entra groups and app registrations are in the expected state
        command: pwsh provisioning/entra/verify-entra.ps1 -Env test
      - description: >
          The four cloud flows are present and turned on after connection
          references are bound — REV | Intake | WordPress to Dataverse,
          REV | Scoring | Calculate & Flag, REV | Scoring | Daily Summary,
          REV | Ops | Failure Alert
        command: manual step — verify in the maker portal or via the Dataverse workflow table
      - description: >
          End-to-end intake: POST one synthetic application payload to the intake
          endpoint and assert HTTP 200 with a REV-YYYY-NNN reference, an
          Application row, a matched Applicant row, and a Teams notification
          (FR-007, FR-008, FR-009). Owned by the test-agent.
        command: manual step — test-agent Automation #4 end-to-end case
      - description: >
          Deliberate failure path: POST a malformed payload and assert HTTP 400,
          one rev_errorlog row containing no personal data, and a Teams alert
          (FR-010, C-DOM-004). Owned by the test-agent.
        command: manual step — test-agent Automation #4 negative case
      - description: >
          Replay safety: POST the same submission_id twice and assert exactly one
          Application row (TAD §5.1 idempotency guard).
        command: manual step — test-agent idempotency case

    # Rollback is a PIPELINES operation now, not a re-import. Requires the
    # "redeploy previous solution versions" setting to be enabled on the pipeline
    # (tenant_prerequisites) — without it only higher versions can be deployed.
    # Nothing here is ever executed by CI.
    rollback_command: >
      MANUAL — Power Platform Pipelines: open the Pipelines page for
      RevitaliseGrantAutomation in DEV, select Run history, choose the last known-good
      deployment to the "Deploy to TST/ACC" stage and redeploy that solution version.
      For release 1.0.0.0 there is no previous version, so the route is the one in
      `rollback_artifact` above: turn the four cloud flows off, leave the solution in
      place, fix forward.

  # ── PRD ─────────────────────────────────────────────────────────────────────
  prd:
    gate: APPROVE PRD            # the single remaining human deployment gate
    # ── Promotion: Power Platform Pipelines, TST/ACC → PRD ────────────────────
    # Pipelines independently enforces stage order — PRD cannot receive a version
    # TST/ACC has not already taken — so the APPROVE PRD gate and the platform
    # both guard this hop.
    promote_mode: manual
    pipeline_stage_name: "Deploy to PRD"
    pipeline_stage_id: $PIPELINE_STAGE_ID   # PRD GitHub Environment secret
    current_version: 1.0.0.0
    new_version: 1.0.0.0
    env_url: $ENV_URL_PRD

    pre_deploy:
      - description: >
          Confirm the three DPO decisions SDD OQ-004, OQ-005 and OQ-006 are
          recorded, and that the DPIA is concluded (Art. 35). ADR-002 is adopted
          conditionally on OQ-004; TAD risk A-R21. Go-live must not precede them.
        script: manual
      - description: >
          Confirm the board's scoring criteria are agreed (SDD OQ-001, OQ-002,
          OQ-003). prd-settings.json deliberately carries {{PENDING_OQ_...}}
          tokens for the knockout threshold, the borderline band and the income
          ceiling, so seed-settings.ps1 fails fast rather than seeding production
          with unconfirmed criteria.
        script: manual

    post_deploy:
      - description: Group teams + role bindings, roles looked up by name (C-TECH-040)
        script: provisioning/dataverse/bind-roles-to-groups.ps1 -Env prd
      - description: Column security profile membership for REV_TrusteeRestricted
        script: provisioning/dataverse/ensure-column-security-profile-members.ps1 -Env prd
      - description: Organisation + table auditing on all four tables; audit retention 6 years
        script: provisioning/dataverse/ensure-auditing.ps1 -Env prd
      - description: Recurring bulk-delete retention jobs (12m / 6m / orphan sweep / 90d)
        script: provisioning/dataverse/ensure-bulk-delete-jobs.ps1 -Env prd
      - description: >
          Seed the rev_setting rows with the board-confirmed values. Fails fast
          while any {{PENDING_OQ_...}} token remains.
        script: provisioning/dataverse/seed-settings.ps1 -Env prd
      - description: Associate the model-driven app with the two Phase 1 roles
        script: provisioning/dataverse/share-apps.ps1 -Env prd
      - description: >
          MANUAL, once — bind the three connection references to service-account
          connections (interactive OAuth), then turn the four flows on.
          ⚠ Requires the WBS 0.3 Conditional Access exception.
          ⚠ CONFIGURE TRIGGER AUTHENTICATION (next step) BEFORE TURNING THE INTAKE
          FLOW ON — not after.
        script: manual
      # ── NEW 2026-08-12 — closes test-agent defect D-001 (C-TECH-006 HARD) ──────
      - description: >
          MANUAL — CONFIGURE TRIGGER AUTHENTICATION on `REV | Intake | WordPress to
          Dataverse` in PRD, inside the APPROVE PRD gate. Same control and same value
          as TST/ACC, because weakening it in production would be the wrong way round:
          authentication parameter "Specific users in my tenant", Allowed users = the
          SERVICE PRINCIPAL OBJECT ID of rev-wordpress-intake (from the
          ensure-intake-client.ps1 output in tenant_prerequisites).
          WHO: Wanstor (tenant administration); the maker supplies the value and
          confirms the smoke test passes BEFORE the endpoint is given to Alex.
          ⚠ Do this before the flow is turned on, and read Allowed users back after
          saving — a blank list silently means "any user in the tenant".
          Record the value applied in the Deployment Summary (C-TECH-041).
        script: manual

    smoke_tests:
      - description: Imported solution version matches the artifact
        command: pac solution list --environment $ENV_URL_PRD | grep -E 'RevitaliseGrantAutomation[[:space:]]+1\.0\.0\.0'
      - description: Group teams, role bindings and absence of direct user assignments
        command: pwsh provisioning/dataverse/verify-role-bindings.ps1 -Env prd
      # ── NEW 2026-08-12 — C-TECH-006 `Verify By`, in production ─────────────────
      # Must pass before the endpoint URL is handed to Alex. Needs the
      # INTAKE_ENDPOINT_URL_PRD secret. The probe writes nothing under any outcome.
      - description: >
          C-TECH-006 / NFR-008 — the intake endpoint rejects an unauthenticated caller
          with 401/403, rejects it BEFORE the workflow definition runs, and rejects an
          invalid bearer token. A FAIL here means the one public endpoint in production
          is open, so it is a deployment-halting result, not a warning.
        command: pwsh provisioning/entra/verify-intake-endpoint-auth.ps1 -Env prd
      - description: >
          One controlled application end to end, followed by a deliberate failure
          to confirm the Error Log row and the Failure Alert both fire, then live
          triggers enabled (TAD §9 PROD promotion procedure)
        command: manual step — process owner + pipeline-agent, evidence recorded in the Deployment Summary
      - description: Error-rate baseline — zero unresolved rev_errorlog rows of severity Error or Critical from the smoke run
        command: manual step — query the Unresolved Errors view

    rollback_command: >
      MANUAL — Power Platform Pipelines: Pipelines page → Run history → the last known-good
      deployment to the "Deploy to PRD" stage → redeploy that solution version. Requires the
      pipeline's redeploy-previous-versions setting (tenant_prerequisites). If that setting is
      off, the documented workaround is to download the artefact from the pipelines host,
      increment the version in solution.xml and import manually — which is a break-glass
      route, not a rollback, and must be recorded in the Deployment Summary.
      ⚠ FOR RELEASE 1.0.0.0 THERE IS NO PREVIOUS VERSION. Uninstalling a first managed
      solution removes its tables and the data in them, so the route is: turn the four cloud
      flows off, leave the solution in place, fix forward (C-TECH-033).
    rollback_requires_human: true   # never auto-rollback in production

