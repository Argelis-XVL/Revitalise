          has been seen returning a value for a case you know should succeed (IMP-0110).

          THE CONTROLS ARE NO LONGER CHECKED BY READING THIS PARAGRAPH. The step above is an
          executable precondition and it must exit 0 within minutes of you signing in. Two
          prose warnings used to stand here, telling whoever staged this to confirm membership
          live and add an identity; both were read, and on 2026-08-23 the account that was
          added was the trustee's own test account — the one account that must never be a
          member (IMP-0228). A third warning was the wrong altitude, so they were replaced by
          a check (C-TECH-068, improvement review 18).
        owner: TBC — name the person in the Deployment Summary
        script: manual
      - level: V5
        description: >
          NOT REACHABLE FOR THIS SLICE, and must not be claimed. End-to-end for Automation #6
          means a verdict flowing through to a grant record, which is WBS 6.6's Finalise
          Decisions flow — deferred behind DocuSign (3.1/3.2) by the reviewer's own sequencing
          decision. Decision CAPTURE is testable at V4; decision ENACTMENT is not built.
        script: n/a
      # ── NEW 2026-08-19 (C-TECH-064, IMP-0085) — THE AUDIT SWITCH DOES NOT TRAVEL ──
      # Table auditing is an ENVIRONMENT setting with no representation in solution source:
      # entity-level IsAuditEnabled is absent from every Entity.xml and cannot be set by an
      # import. So it does not arrive with a new table, and no source-side gate can see that
      # it is missing. DEV held special-category health data with NO audit trail from
      # 2026-08-14 to 2026-08-19 for exactly this reason, while four Test Report revisions
      # read the ATTRIBUTE-level flags in source and recorded C-DOM-010 as PASS.
      #
      # THE TABLE LIST IS DERIVED FROM DISK, so this step covers tables that do not exist
      # yet without anyone editing it. Five are still to be built and each will ship
      # unaudited unless this runs: rev_review, rev_provider, rev_bankaccount, rev_payment,
      # rev_anonymisedstatistic (TAD §12 — "all ten tables"; five exist today).
      #
      # Adding a Dataverse table is THREE changes: the entity, a SubArea in
      # AppModuleSiteMaps/, and this switch. The first two are gated by
      # verify-shipped-content.py; this is the third.
      - level: V3
        description: >
          Confirm LIVE that auditing is on for every table this solution declares, and that
          the organisation switch and retention period are set. Read it back by query —
          never from the portal's confirmation, and never from the column-level flags, which
          are already 1 and mean nothing while the table switch is off. For every directory
          under src/solutions/RevitaliseGrantAutomation/Entities/:
          EntityDefinitions(LogicalName='<name>')?$select=IsAuditEnabled must return
          Value=true; and organizations?$select=isauditenabled,auditretentionperiodv2 must
          return True plus the retention period the environment's settings file declares
          (2192 days per test-settings.json / prd-settings.json — never -1, which would keep
          applicant data in audit history after the record itself was deleted).
          REPORT EVERY TABLE THAT FAILS BY NAME. A new table is the expected cause.
        script: manual   # awaiting the C-TECH-064 verifier — see blocked_on
        blocked_on_asserted: 2026-08-19   # re-test, do not re-read (IMP-0222)
        blocked_on: >
          The executable form of this check is the C-TECH-064 verifier, handed to
          development-agent on 2026-08-19 together with the fix that makes
          ensure-auditing.ps1 -Env dev runnable. Until it exists this is a manual step, and
          the CI runner records it as an operator checklist item on every deploy rather
          than skipping it silently. The five tables named above are the reason it must not
          be dropped: on 2026-08-19 the reviewer asked to be reminded at their deployment,
          and this step is that reminder.
      - level: V3
        description: >
          Query EVERY declared component type by name from a list DERIVED FROM SOURCE:
          entity, attributes, globaloptionset, systemform, savedquery, entityrelationship,
          fieldsecurityprofile permissions, role privileges, environmentvariabledefinition.
          A hand-written subset omits the one that failed — savedquery and systemform were
          both absent from the list that "verified" the first DEV deploy (IMP-0013). Then
          re-run the import once to prove idempotency.
        script: manual   # DEAD AS DECLARED — see blocked_on. 2026-08-19.
        blocked_on_asserted: 2026-08-19   # re-test, do not re-read (IMP-0222)
        blocked_on: >
          Same cause: `Get-ProvisioningSettings -Env dev` throws by design. This step is the
          V3 verification for the DEV stage, so a verification step that cannot execute is the
          worst of the four — it is the one that would have reported the audit defect. The
          check itself was performed by hand on 2026-08-19 against the live environment and is
          recorded in the Test Report (report revision 8). IMP-0082.
      - level: V3
        description: >
          Compare the LIVE rev_grantstatus option-set members against source. Import
          relabels matching values but never deletes omitted ones, and orphans survive
          every later import (IMP-0019). Four values expected: 1 Awarded, 2 Acceptance
          Issued, 3 Acceptance Signed, 4 Paid — and nothing else.
        script: manual
      - level: V4
        description: >
          NAMED HUMAN STEP, REQUIRED BEFORE THIS ENVIRONMENT IS CALLED DEPLOYED
          (C-TECH-053). A named person opens the rev_grant main form in REV Grant
          Administration, creates a record against a test application, SAVES it, and
          opens each of the three views. Import acceptance and designer usability are
          different properties: three components once imported cleanly, were queryable,
          and still could not be opened or saved (IMP-0012). While saving, check the form
          LABELS against each attribute's authored displayname — no test asserts label
          text (IMP-0015).
        owner: TBC — name the person in the Deployment Summary
        script: manual
      - level: V5
        description: >
          NOT REACHABLE FOR THIS SLICE, and must not be claimed. No automation writes to
          rev_grant until WBS 3.2/3.4 build the acceptance flows, so there is no
          end-to-end behaviour to execute.
        script: n/a

      # ══ TAD REVISION 5 (ADR-038) — FOUR VERIFICATIONS, AND THE FIRST ONE DECIDES ══════
      # TAD section 12.2's closing note moves which row is the exception to the sweep. It used
      # to be "a code app can invoke a solution-aware instant flow", which is now CLOSED
      # NEGATIVE. It is now "the flow's Dataverse trigger actually fires" — it decides whether
      # the design works at all, so it is verified FIRST and ALONE, by observed effect, before
      # any other wbs:6.9 verification is attempted.
      - level: V4
        description: >
          STEP 7 of TAD section 12.3, AND NOTHING ELSE COUNTS. Write rev_triggeredon on the
          rev_roundstatisticsrequest row (key CURRENT), wait, then assert that rev_computedon on
          the RESULT row — rev_roundstatisticsresult, key CURRENT — CHANGED.

          INADMISSIBLE AS EVIDENCE, every one of them: the flow's statecode; the existence of a
          callbackregistration row; that row's createdon; a matching subscriptionRequest/scope; a
          matching subscriptionRequest/runas; and a run reached by RESUBMIT, which replays the
          original payload and never touches the subscription path. C-TECH-064 clause (a): six
          successive findings each added one more metadata field to that checklist and each was
          defeated by the next incident — the terminal case passed every one of them and did not
          fire for 12 rows in 9 minutes.

          THIS CANNOT BE FIXED IN THE APP, WHICH IS WHY IT IS MANDATORY HERE. A-R47: an
          unregistered trigger and a slow computation are INDISTINGUISHABLE from the screen — both
          render status "pending" — so a permanently dead feature would report "still working" to
          every trustee, forever, with every source-side gate green.

          THEN, in the same pass and only after rev_computedon has moved: read rev_resultjson and
          confirm it is NON-EMPTY. A green run with an empty column is the exact signature of a
          nested `item` object on an UpdateRecord — the connector renders it as an action with NO
          PROPERTIES CONFIGURED and it WRITES NOTHING WHILE SUCCEEDING (IMP-0116). That failure
          mode would make this entire design silently do nothing.
        script: manual
        owner: TBC — name the person in the Deployment Summary
      - level: V5
        description: >
          A-R45 — THE GENDER RECONCILIATION. This is A-R33's check carried forward verbatim; only
          its cause changed (subscriptionRequest/runas: 3 in the workflow JSON, where it used to be
          a "run only users" connection setting no solution file could express). Retiring the risk
          row without carrying the check forward would be closing the question by deleting it.

          Sign in as a REAL TRUSTEE, open the landing screen, and reconcile the gender distribution
          against an admin-side tally of the same round. A NON-EMPTY CHART IS NOT SUFFICIENT
          EVIDENCE and neither is an empty one: an empty distribution and a genuinely empty column
          are indistinguishable (IMP-0110). What is being proven is that a PRIVILEGED identity did
          the counting — if the flow ran as the trustee, rev_gender returns null, the chart renders
          empty, and every gate stays green.
        script: manual
        owner: TBC — name the person in the Deployment Summary
      - level: V5
        description: >
          THE LIVE HALF OF TAD SECTION 6.3.3 — test-agent's assertion, and the only one that reads
          what the flow ACTUALLY PRODUCED rather than what it was specified to produce. After a
          real run, read rev_roundstatisticsresult.rev_resultjson and assert that its KEY SET
          EQUALS section 3.3's enumerated key set, and that every leaf is a number, null, or a
          string matching an ISO-8601 timestamp or a round key — NO FREE TEXT, NO ID-SHAPED VALUE,
          NO UNEXPECTED KEY.

          The source half is the build gate `flow-reads-no-trigger-body`
          (scripts/verify-flow-trigger-body-isolation.py, check B), which proves the DEFINITION
          composes the document from an enumerated field list. This step proves the OUTPUT did.
          They are different claims: the contract being right is not the same as the flow
          producing it, and no read-side column gate in this repository would ever see a row
          serialised into this column.
        script: manual
        owner: test-agent
      - level: V3
        description: >
          A-R49 — READ THE PRIVILEGE SET BACK, AND EXPECT IT RED FIRST. Confirm live that
          prvWriterev_roundstatisticsrequest is NOT bound to REV Service Automation, and that
          prvReadWorkflow is NOT bound to REV Trustee:
          roles(<roleid>)/roleprivileges_association?$select=privilegeid resolved through the
          `privileges` entity set, role resolved BY NAME.

          This is EXPECTED TO FAIL on the first run and to pass only after the manual $ref deletes
          in the post_deploy step above, because ensure-schema.ps1 grants and revokes nothing. A
          verification that cannot fail proves nothing, and this is the only signal that the write
          boundary in source is the write boundary in the environment.

          Baseline for comparison, measured 2026-08-28 BEFORE any of this rollout ran (IMP-0133 —
          capture the pre-state before the write, not after a refusal): both privileges bound at
          privilegedepthmask 8, roleprivilegeids 83a7aa39-40a2-f111-b8de-7ced8d43e1b4 and
          ea54378b-87a0-f111-b8de-70a8a5079a1b respectively.
        script: manual

  # ── TST/ACC — combined Test and Acceptance ──────────────────────────────────
  tst_acc:
    auto_deploy: true            # no APPROVE ACC gate exists; see promote_mode below
    # No `gate:` key by design. Acceptance sign-off happens inside this stage
    # alongside the test-agent gate; APPROVE ACC is not a step for this feature
    # (TAD §9.1). The next human gate is APPROVE PRD.

    # ── Promotion: Power Platform Pipelines, DEV → TST/ACC ────────────────────
    # `deploy_command` is deliberately absent. GitHub Actions does not import
    # into this environment — Pipelines does. See the `alm` block.
    promote_mode: manual         # manual | cli — see alm.promotion_mechanism
    pipeline_stage_name: "Deploy to TST/ACC"
    # Stage GUID is NOT committed: it is per-tenant and does not exist yet.
    # `pac pipeline list --pipeline "REV Grant Automation Standard"` yields it;
    # store it as the PIPELINE_STAGE_ID secret on the `tst_acc` GitHub Environment.
    pipeline_stage_id: $PIPELINE_STAGE_ID
    # Only used when promote_mode is `cli`. Both are 1.0.0.0 for the first
    # release; the exact semantics of current vs new are an OPEN QUESTION
    # (alm.promotion_mechanism.not_verified) and are the second reason this
    # environment promotes manually for now.
    current_version: 1.0.0.0
    new_version: 1.0.0.0
    env_url: $ENV_URL_TEST       # ENV_URL_TEST is the TST/ACC environment (ADR-006)

    # ── Stage 0.5 — environment prerequisites (C-TECH-050, C-TECH-051, C-TECH-065) ──
    # Added 2026-08-21 (IMP-0146). This block did not exist: `dev` had one and TST/ACC
    # and PRD opened straight into provisioning/dataverse/*.ps1, silently assuming the
    # access DEV had. On 2026-08-21 a seeding run proved that assumption false — a valid
    # token, and every call including WhoAmI rejected with 0x80072560, because the
    # environment had no application user for the provisioning identity.
    environment_prerequisites:
      - description: >
          Create a Dataverse APPLICATION USER for $PROVISION_APP_ID in this environment,
          holding the same security role it holds in DEV. Power Platform admin center ->
          the environment -> Settings -> Users + permissions -> Application users ->
          New app user. No script in this repository can do this, and no credential
          implies it: an application user is created per environment. Done for TST/ACC
          on 2026-08-21, confirmed by the probe below.
        script: manual
        blocked_on_asserted: 2026-08-21   # re-test, do not re-read (IMP-0222)
        blocked_on: >
          Requires System Administrator on the target environment. This is the same class
          of tenant act as the entries in tenant_prerequisites, not something CI performs.
      - description: >
          Prove the provisioning identity is a member of THIS Dataverse organisation before
          any other provisioning step is trusted against it (C-TECH-065). One WhoAmI call,
          and it is the difference between a four-hour diagnosis and one line of output.
        script: provisioning/dataverse/verify-environment-access.ps1 -Env test
      - description: >
          Enable the "Power Apps code apps" product feature on TST/ACC — admin centre ->
          Environments -> <env> -> Settings -> Product -> Features -> Save. Declared here
          AGAINST THE DAY promotion of the trustee Code App to this environment is permitted,
          which EX-003 does not permit today. The 403 CodeAppOperationNotAllowedInEnvironment
          is enforced by the platform PER ENVIRONMENT, so DEV being enabled says nothing about
          this one (IMP-0182) — and the feature is off by default, so the answer here is "off"
          until a human changes it.

          AND NO PUSH STEP IS COMING — but this entry is still required. Settled 2026-08-23
          (IMP-0223): a pushed Code App IS a solution component (componenttype 300), so it
          arrives here inside the managed import and needs no second `pac code push`. The
          product feature is a different thing from the push: it gates whether the environment
          will HOST a code app at all, and it is off by default. Confirm it is on before the
          first promotion that carries the app, and read the solution's component list in THIS
          environment afterwards — that the component survives the managed export has not been
          observed yet, in this or any environment.
        prerequisite_id: code-apps-feature
        script: manual   # admin-centre UI only — no pac verb, no organization attribute (IMP-0182)
        owner: reviewer (System Administrator on TST/ACC)

    # C-TECH-007 — Tier 3/4 data must be synthetic outside PRD. Phase 1 migrates
    # no data, so the control is an explicit pre-deploy guard rather than a
    # masking transform: the deployment must not proceed if real applicant data
    # has reached this environment.
    pre_deploy:
      - description: >
          Confirm TST/ACC holds synthetic or anonymised data only — no real
          applicant PII. Test fixtures are generated by the test-agent; no
          production extract is ever imported here. Reset or segregate test data
          before an acceptance session (TAD §9.1.1).
        script: manual
      - description: >
          Capture every cloud flow's statecode BEFORE promotion, so the
          post_deploy diff below can report which flows the import actually
          deactivated rather than a guess (IMP-0136: two consecutive DEV imports
          deactivated 2 of 4 flows, not all four and not zero, and nothing had
          compared before against after).
        script: >
          provisioning/dataverse/reconcile-flow-statecodes.ps1 -Env test -Mode Capture
          -SnapshotPath flow-statecodes-tst_acc-before.json

    post_deploy:
      - description: >
          Create/verify the Dataverse group teams REV Admins and REV Service
          Accounts (type AAD Security Group) and bind REV Admin and REV Service
          Automation to them. Roles are looked up BY NAME in the target
          environment. No direct user-to-role assignment (C-TECH-040).
        script: provisioning/dataverse/bind-roles-to-groups.ps1 -Env test
      - description: >
          Add the group teams as members of every column security profile the settings file
          declares — REV_TrusteeRestricted (REV Admins + REV Service Accounts, so the process
          owner and the service account can read and write the Tier 4 columns and nobody else
          can, TAD §6/NFR-001) and, since 2026-08-23 (WBS 0.4 remainder), REV_FinanceOnly
          (REV Service Accounts only — REV Admins is deliberately NOT a member, NFR-002
          separation of duties). One script call: ensure-column-security-profile-members.ps1
          already loops over `dataverse.columnSecurityProfiles` generically, so adding the
          second profile to test-settings.json (config-agent, same dispatch) was the only
          change this step needed.
        script: provisioning/dataverse/ensure-column-security-profile-members.ps1 -Env test
      - description: >
          Enable organisation and table auditing on every table `dataverse.auditing.
          auditedTables` names in test-settings.json — rev_applicant, rev_application,
          rev_grant, rev_review, rev_setting, rev_errorlog, and since 2026-08-23 (WBS 0.4
          remainder) rev_provider, rev_bankaccount, rev_payment, rev_anonymisedstatistic — and
          set audit retention to 6 years (C-DOM-010, C-DOM-011, TAD §6.5). Generic over the
          settings list; no script change needed for the four new tables.
        script: provisioning/dataverse/ensure-auditing.ps1 -Env test
      - description: >
          Create/verify the recurring bulk-delete retention jobs: rejected
          applications (12 months), withdrawn/incomplete (6 months), orphaned
          applicants (the derived sweep, TAD §3.4 gap 1) and error log (90 days).
          The 6-year paid-grant job arrives with the rev_grant table in a later
          phase (C-DOM-003, ADR-004).
        script: provisioning/dataverse/ensure-bulk-delete-jobs.ps1 -Env test
      - description: >
          Seed/upsert the fifteen rev_setting rows — Likert point map, feeling-scale
          inversion, knockout threshold, borderline band lower and upper, income
          ceiling, income-band upper-bound map, age-band map, age-range label map,
          postcode-region map, maximum circumstance score, and money-measure minimum
          population. Ten of these are FIXED by requirements (FR-012, FR-013) or are
          reference data and carry real values in every environment. The four
          threshold rows (knockout, borderline lower/upper, income ceiling) are the
          board's criteria awaiting SDD OQ-001/002/003. TST/ACC carries clearly
          provisional test values for these four. The fifteen is RoundStatisticsMoneyMeasureMinimumPopulation
          (TAD §6.3.5, OQ-043): a disclosure control, not a tunable like FR-062
          thresholds, set by reviewer decision on 2026-08-28 to k=5. Unlike
          RoundStatisticsStaleAfterSeconds (OQ-042, deliberately unseeded), this row
          MUST be seeded in all three environments identically to prevent round-render
          divergence. Upsert is by alternate key rev_setting_name, and rev_effectivefrom
          is written on create only so a pipeline re-run does not destroy the evidence of
          when a value took effect. The script fails fast, BEFORE any write, on any
          unresolved {{...}} token.
        script: provisioning/dataverse/seed-settings.ps1 -Env test
      - description: >
          Associate the REV Grant Administration model-driven app with the
          REV Admin and REV Service Automation roles.
        script: provisioning/dataverse/share-apps.ps1 -Env test
      # ── LAST scripted step, deliberately ──────────────────────────────────
      # A deactivated flow is expected platform behaviour on an unmanaged
      # --force-overwrite import (TAD's own note), not a defect in the role/
      # security/setting provisioning above — so this step runs AFTER all of
      # it, not before, and its non-zero exit on a deactivation surfaces as a
      # job failure without having blocked anything essential (IMP-0136).
      - description: >
          Diff live flow statecodes against the pre_deploy snapshot and print
          the re-activation list — the flows this import actually deactivated,
          never a count and never a guess (IMP-0136).
        script: >
          provisioning/dataverse/reconcile-flow-statecodes.ps1 -Env test -Mode Diff
          -SnapshotPath flow-statecodes-tst_acc-before.json
      - description: >
          MANUAL, once per environment — bind the three connection references
          (rev-dataverse, rev-teams, rev-outlook) to connections owned by the
          service account. Interactive OAuth consent is required, so this cannot
          be scripted. The four cloud flows import switched OFF and are turned on
          only after this step (TAD §12). ⚠ Blocked until the WBS 0.3 Conditional
          Access exception is confirmed for unattended sign-in.
        script: manual
      # ── NEW 2026-08-12 — closes test-agent defect D-001 (C-TECH-006 HARD) ──────
      - description: >
          MANUAL, ONCE PER ENVIRONMENT, AND BEFORE THE INTAKE FLOW IS TURNED ON —
          CONFIGURE TRIGGER AUTHENTICATION ON `REV | Intake | WordPress to Dataverse`.
          This is the PRIMARY authentication control on the solution's only public
          endpoint (NFR-008, C-TECH-006). It is a trigger SETTING, not a solution
          component: Microsoft documents it as the "Who can trigger the flow?"
          authentication parameter and publishes no workflow-definition property for it
          (https://learn.microsoft.com/en-us/power-automate/oauth-authentication), so it
          cannot ship in the managed solution and it is applied here instead.
          WHO: Wanstor (tenant administration), with the maker supplying the value.
          WHAT: set the authentication parameter to "Specific users in my tenant" and
          set Allowed users to the SERVICE PRINCIPAL OBJECT ID of rev-wordpress-intake —
          printed by the ensure-intake-client.ps1 step in tenant_prerequisites. Not the
          application (client) id: that one goes to rev_IntakeAllowedClientId.
          ⚠ Leaving Allowed users BLANK under this mode silently widens the scope back
          to the whole tenant (Microsoft's own note), and no test can detect that — so
          read the field back after saving.
          ⚠ ORDER MATTERS: configure this BEFORE turning the flow on. Between switch-on
          and configuration the endpoint is live under whatever default the trigger
          carries.
          WHETHER THIS SETTING SURVIVES A SOLUTION IMPORT IS UNVERIFIED — no environment
          exists yet — so it is configured and then verified on every deployment rather
          than assumed to have carried across. The smoke test below is what closes it.
          Record the value applied in the Deployment Summary (C-TECH-041).
        script: manual

    smoke_tests:
      - description: Imported solution version matches the artifact (C-TECH-030)
        command: pac solution list --environment $ENV_URL_TEST | grep -E 'RevitaliseGrantAutomation[[:space:]]+1\.0\.0\.0'
      # ── NEW 2026-08-12 — the executable form of C-TECH-006's `Verify By` ───────
      # "Security test: unauthenticated request → 401/403". Test-agent recorded this
      # as absent (D-001 / TC-401): no smoke test asserted it anywhere. It runs after
      # the trigger setting is applied and after the flow is turned on, and it fails
      # the deployment if the endpoint answers anything else.
      #
      # It does three things, and the second is the one that matters. A 401 alone is
      # not proof, because the flow's OWN second gate also answers 401 — so the check
      # asserts the response is NOT the definition's {"error":"unauthorised"} body,
      # which is how it distinguishes "the platform rejected this" from "the request
      # got into the workflow and the client-id header check stopped it". The latter is
      # precisely the state D-001 describes and it fails the smoke test.
      #
      # Safe against a live environment: the probe carries no personal data, omits the
      # x-rev-client-id header, and is incomplete against the trigger's `required`
      # array, so no outcome can create a row. Needs the INTAKE_ENDPOINT_URL_TEST
      # secret — the trigger URL carries its own SAS `sig=` and is a credential, so it
      # is never a value in a settings file (C-TECH-001/047).
      - description: >
          C-TECH-006 / NFR-008 — the intake endpoint rejects an unauthenticated caller
          with 401/403, and rejects it BEFORE the workflow definition runs. Also
          asserts an invalid bearer token is rejected, i.e. the token is validated
          rather than merely required.
        command: pwsh provisioning/entra/verify-intake-endpoint-auth.ps1 -Env test
      - description: >
          Group teams exist, hold exactly the TAD §6.1 roles, and no feature role
          has a direct user assignment (C-TECH-040)
        command: pwsh provisioning/dataverse/verify-role-bindings.ps1 -Env test
      - description: Entra groups and app registrations are in the expected state
        command: pwsh provisioning/entra/verify-entra.ps1 -Env test
      - description: >
          The four cloud flows are present and turned on after connection
          references are bound — REV | Intake | WordPress to Dataverse,
          REV | Scoring | Calculate & Flag, REV | Scoring | Daily Summary,
          REV | Ops | Failure Alert
        command: manual step — verify in the maker portal or via the Dataverse workflow table
      - description: >
          End-to-end intake: POST one synthetic application payload to the intake
          endpoint and assert HTTP 200 with a REV-YYYY-NNN reference, an
          Application row, a matched Applicant row, and a Teams notification
          (FR-007, FR-008, FR-009). Owned by the test-agent.
        command: manual step — test-agent Automation #4 end-to-end case
      - description: >
          Deliberate failure path: POST a malformed payload and assert HTTP 400,
          one rev_errorlog row containing no personal data, and a Teams alert
          (FR-010, C-DOM-004). Owned by the test-agent.
        command: manual step — test-agent Automation #4 negative case
      - description: >
          Replay safety: POST the same submission_id twice and assert exactly one
          Application row (TAD §5.1 idempotency guard).
        command: manual step — test-agent idempotency case

    # Rollback is a PIPELINES operation now, not a re-import. Requires the
    # "redeploy previous solution versions" setting to be enabled on the pipeline
    # (tenant_prerequisites) — without it only higher versions can be deployed.
    # Nothing here is ever executed by CI.
    rollback_command: >
      MANUAL — Power Platform Pipelines: open the Pipelines page for
      RevitaliseGrantAutomation in DEV, select Run history, choose the last known-good
      deployment to the "Deploy to TST/ACC" stage and redeploy that solution version.
      For release 1.0.0.0 there is no previous version, so the route is the one in
      `rollback_artifact` above: turn the four cloud flows off, leave the solution in
      place, fix forward.

  # ── PRD ─────────────────────────────────────────────────────────────────────
  prd:
    gate: APPROVE PRD            # the single remaining human deployment gate
    # ── Promotion: Power Platform Pipelines, TST/ACC → PRD ────────────────────
    # Pipelines independently enforces stage order — PRD cannot receive a version
    # TST/ACC has not already taken — so the APPROVE PRD gate and the platform
    # both guard this hop.
    promote_mode: manual
    pipeline_stage_name: "Deploy to PRD"
    pipeline_stage_id: $PIPELINE_STAGE_ID   # PRD GitHub Environment secret
    current_version: 1.0.0.0
    new_version: 1.0.0.0
    env_url: $ENV_URL_PRD

    # ── Stage 0.5 — environment prerequisites (C-TECH-050, C-TECH-051, C-TECH-065) ──
    # Added 2026-08-21 (IMP-0146), for the same reason as the TST/ACC block above. PRD
    # has never been provisioned from this identity, so its state is not merely unknown,
    # it is unlikely to work: TST/ACC did not, and it was set up the same way.
    environment_prerequisites:
      - description: >
          Create a Dataverse APPLICATION USER for $PROVISION_APP_ID in this environment,
          holding the same security role it holds in DEV. Power Platform admin center ->
          the environment -> Settings -> Users + permissions -> Application users ->
          New app user. NOT YET DONE for PRD.
        script: manual
        blocked_on_asserted: 2026-08-19   # re-test, do not re-read (IMP-0222)
        blocked_on: >
          Requires System Administrator on the production environment. Must be done and
          proven by the probe below before the first APPROVE PRD deploy.
      - description: >
          Prove the provisioning identity is a member of THIS Dataverse organisation before
          any other provisioning step is trusted against it (C-TECH-065). One WhoAmI call.
        script: provisioning/dataverse/verify-environment-access.ps1 -Env prd
      - description: >
          Enable the "Power Apps code apps" product feature on PRD — admin centre ->
          Environments -> <env> -> Settings -> Product -> Features -> Save. Declared AGAINST
          THE DAY the trustee Code App is promoted to production; EX-003 does not permit that
          today. NOT YET DONE for PRD, and it is off by default. No `pac code push` step
          exists here and none is needed: settled 2026-08-23 (IMP-0223), a pushed Code App is
          a solution component (componenttype 300) and arrives with the managed import. The
          feature toggle still gates whether this environment will host it.

          Same reasoning as the DEV and TST/ACC entries: the platform enforces
          CodeAppOperationNotAllowedInEnvironment per environment, no CLI verb sets it and none
          reads it back, so it is a named human act with a recorded outcome rather than
          anything this pipeline can perform or assert (IMP-0182).
        prerequisite_id: code-apps-feature
        script: manual   # admin-centre UI only — no pac verb, no organization attribute (IMP-0182)
        owner: reviewer (System Administrator on PRD)

    pre_deploy:
      - description: >
          Confirm the three DPO decisions SDD OQ-004, OQ-005 and OQ-006 are
          recorded, and that the DPIA is concluded (Art. 35). ADR-002 is adopted
          conditionally on OQ-004; TAD risk A-R21. Go-live must not precede them.
        script: manual
      - description: >
          Confirm the board's scoring criteria are agreed (SDD OQ-001, OQ-002,
          OQ-003). prd-settings.json deliberately carries {{PENDING_OQ_...}}
          tokens for the knockout threshold, the borderline band and the income
          ceiling, so seed-settings.ps1 fails fast rather than seeding production
          with unconfirmed criteria.
        script: manual
      - description: >
          Capture every cloud flow's statecode BEFORE promotion (IMP-0136) —
          same reason as the tst_acc pre_deploy step above.
        script: >
          provisioning/dataverse/reconcile-flow-statecodes.ps1 -Env prd -Mode Capture
          -SnapshotPath flow-statecodes-prd-before.json

    post_deploy:
      - description: Group teams + role bindings, roles looked up by name (C-TECH-040)
        script: provisioning/dataverse/bind-roles-to-groups.ps1 -Env prd
      - description: >
          Column security profile membership for REV_TrusteeRestricted (REV Admins + REV
          Service Accounts) and, since 2026-08-23 (WBS 0.4 remainder), REV_FinanceOnly
          (REV Service Accounts only — NFR-002 separation of duties). Generic over
          prd-settings.json's `dataverse.columnSecurityProfiles`; no script change needed.
        script: provisioning/dataverse/ensure-column-security-profile-members.ps1 -Env prd
      - description: >
          Organisation + table auditing on every table prd-settings.json's
          `dataverse.auditing.auditedTables` names — ten as of 2026-08-23 (WBS 0.4 remainder
          added rev_provider, rev_bankaccount, rev_payment, rev_anonymisedstatistic); audit
          retention 6 years.
        script: provisioning/dataverse/ensure-auditing.ps1 -Env prd
      - description: Recurring bulk-delete retention jobs (12m / 6m / orphan sweep / 90d)
        script: provisioning/dataverse/ensure-bulk-delete-jobs.ps1 -Env prd
      - description: >
          Seed the rev_setting rows with the board-confirmed values. Fails fast
          while any {{PENDING_OQ_...}} token remains.
        script: provisioning/dataverse/seed-settings.ps1 -Env prd
      - description: Associate the model-driven app with the two Phase 1 roles
        script: provisioning/dataverse/share-apps.ps1 -Env prd
      # ── LAST scripted step, deliberately — see the tst_acc post_deploy block
      # above for why (IMP-0136): it must not block the provisioning above it.
      - description: >
          Diff live flow statecodes against the pre_deploy snapshot and print
          the re-activation list (IMP-0136).
        script: >
          provisioning/dataverse/reconcile-flow-statecodes.ps1 -Env prd -Mode Diff
          -SnapshotPath flow-statecodes-prd-before.json
      - description: >
          MANUAL, once — bind the three connection references to service-account
          connections (interactive OAuth), then turn the four flows on.
          ⚠ Requires the WBS 0.3 Conditional Access exception.
          ⚠ CONFIGURE TRIGGER AUTHENTICATION (next step) BEFORE TURNING THE INTAKE
          FLOW ON — not after.
        script: manual
      # ── NEW 2026-08-12 — closes test-agent defect D-001 (C-TECH-006 HARD) ──────
      - description: >
          MANUAL — CONFIGURE TRIGGER AUTHENTICATION on `REV | Intake | WordPress to
          Dataverse` in PRD, inside the APPROVE PRD gate. Same control and same value
          as TST/ACC, because weakening it in production would be the wrong way round:
          authentication parameter "Specific users in my tenant", Allowed users = the
          SERVICE PRINCIPAL OBJECT ID of rev-wordpress-intake (from the
          ensure-intake-client.ps1 output in tenant_prerequisites).
          WHO: Wanstor (tenant administration); the maker supplies the value and
          confirms the smoke test passes BEFORE the endpoint is given to Alex.
          ⚠ Do this before the flow is turned on, and read Allowed users back after
          saving — a blank list silently means "any user in the tenant".
          Record the value applied in the Deployment Summary (C-TECH-041).
        script: manual

    smoke_tests:
      - description: Imported solution version matches the artifact
        command: pac solution list --environment $ENV_URL_PRD | grep -E 'RevitaliseGrantAutomation[[:space:]]+1\.0\.0\.0'
      - description: Group teams, role bindings and absence of direct user assignments
        command: pwsh provisioning/dataverse/verify-role-bindings.ps1 -Env prd
      # ── NEW 2026-08-12 — C-TECH-006 `Verify By`, in production ─────────────────
      # Must pass before the endpoint URL is handed to Alex. Needs the
      # INTAKE_ENDPOINT_URL_PRD secret. The probe writes nothing under any outcome.
      - description: >
          C-TECH-006 / NFR-008 — the intake endpoint rejects an unauthenticated caller
          with 401/403, rejects it BEFORE the workflow definition runs, and rejects an
          invalid bearer token. A FAIL here means the one public endpoint in production
          is open, so it is a deployment-halting result, not a warning.
        command: pwsh provisioning/entra/verify-intake-endpoint-auth.ps1 -Env prd
      - description: >
          One controlled application end to end, followed by a deliberate failure
          to confirm the Error Log row and the Failure Alert both fire, then live
          triggers enabled (TAD §9 PROD promotion procedure)
        command: manual step — process owner + pipeline-agent, evidence recorded in the Deployment Summary
      - description: Error-rate baseline — zero unresolved rev_errorlog rows of severity Error or Critical from the smoke run
        command: manual step — query the Unresolved Errors view

    rollback_command: >
      MANUAL — Power Platform Pipelines: Pipelines page → Run history → the last known-good
      deployment to the "Deploy to PRD" stage → redeploy that solution version. Requires the
      pipeline's redeploy-previous-versions setting (tenant_prerequisites). If that setting is
      off, the documented workaround is to download the artefact from the pipelines host,
      increment the version in solution.xml and import manually — which is a break-glass
      route, not a rollback, and must be recorded in the Deployment Summary.
      ⚠ FOR RELEASE 1.0.0.0 THERE IS NO PREVIOUS VERSION. Uninstalling a first managed
      solution removes its tables and the data in them, so the route is: turn the four cloud
      flows off, leave the solution in place, fix forward (C-TECH-033).
    rollback_requires_human: true   # never auto-rollback in production

notifications:
  on_success: Teams 1:1 chat to the process owner (rev_ProcessOwnerUpn)
  on_failure: Teams 1:1 chat to the process owner + email to the service mailbox (rev_ServiceMailbox)
  on_rollback: Teams 1:1 chat to the process owner + email to the maker

escalation:
  deployment_failure: Xander Lykopoulos (maker / Argelis Consultancy)
  data_issue: Emily (process owner, Revitalise) — DPO notified for any personal-data incident
  security_incident: Wanstor (tenant administration) — DPO notified
  tenant_prerequisites: Wanstor (WBS 0.3 service account and Conditional Access exception)
