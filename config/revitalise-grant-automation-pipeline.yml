#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ DELIBERATE, RECORDED DEVIATION FROM agents/WORKFLOW.md — TAD §9.1, ADR-006
# This feature runs on THREE environments, not four:  DEV → TST/ACC → PRD.
# Test and Acceptance are one combined environment. Consequently:
#   • there are exactly TWO deploy targets below: `tst_acc` and `prd`
#   • `tst_acc` auto-deploys after the test-agent gate and ALSO carries UAT —
#     there is no separate `APPROVE ACC` gate step, because there is no Acc hop
#   • `prd` keeps `gate: APPROVE PRD` as the single remaining human deploy gate
#   • ENV_URL_TEST and ENV_URL_ACC collapse to one value: ENV_URL_TEST is the
#     TST/ACC environment
#   • the Deployment Summary records TWO promotions per release, not three
# The provisioning scripts take -Env <dev|test|acc|prd>; for this feature
# `test` IS the combined TST/ACC environment, and its settings file is
# provisioning/deploymentSettings/test-settings.json. Stated at every call site.
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ SECOND DELIBERATE DEVIATION, NEW ON 2026-08-12 — TAD ADR-007 (`Adopted`)
# THE PROMOTION MECHANISM IS POWER PLATFORM PIPELINES, not `pac solution import`.
# The reviewer chose Microsoft's native Dataverse-based ALM product, overriding
# this TAD's own earlier recommendation of pac CLI + GitHub Actions.
#
# The `deploy_command` keys that used to live under each environment are GONE.
# They are replaced by the `alm` block below plus `promote_mode` per environment.
# Anything reading this file for a `deploy_command` must be updated — that is
# .github/workflows/ci.yml (done) and pipeline-agent (this file is its contract).
# ─────────────────────────────────────────────────────────────────────────────

feature: revitalise-grant-automation

# ⚠ THIS IS NO LONGER THE DEPLOYED ARTEFACT. Under Power Platform Pipelines the
# deployed bits are exported from DEV by the platform itself and stored
# immutably in the pipelines host. This directory is now a BUILD-VALIDATION AND
# AUDIT artefact: the solution checker output, the packed zips that prove the
# source packs cleanly, and the provisioning snapshot. See the C-TECH-030 entry
# in the Dev Summary — the constraint is still met, but by a different control.
#
# ── RESOLVED PER RUN, NOT HARDCODED (2026-08-19, C-TECH-059) ──────────────────
# This was the literal `build/artifacts/revitalise-grant-automation-20260810-1/`,
# unchanged since 2026-08-10. The BUILD config stopped hardcoding its artifact
# directory on 08-17 (IMP-0016) and now resolves a fresh `<slug>-<date>-<n>` per
# run — but this file was not part of that change, and nothing checked it. The
# result was a guaranteed CI failure that had simply never been exercised:
# ci.yml's `stage-dev` job reads `.artifact` from this file and hard-fails when
# the path is absent, and after any build on any date other than 2026-08-10 it is
# absent. (Worse than a stale date: `upload-artifact` roots the archive at the
# common ancestor of what it matched, so the dated directory does not survive the
# download either.)
#
# The same template and resolver as config/<slug>-build.yml, so the two agree by
# construction rather than by whoever remembers to edit both. `verify-pipeline-config.py`
# now fails on a literal dated path here — the gate that would have caught this.
artifact: build/artifacts/${ARTIFACT_DIR_NAME}/   # <slug>-<YYYYMMDD>-<n>, resolved at run time
artifact_dir_resolver: scripts/resolve-artifact-dir.py

# ── Environment variables this config's steps depend on ───────────────────────
# NEW 2026-08-19. build.yml has always declared its own; this file never did, so a
# missing CI secret surfaced as an opaque failure inside pac or PowerShell rather
# than as a named, one-line preflight failure. `verify-pipeline-config.py` asserts
# every `$VAR` used by any step below appears here.
#
# PROVISION_APP_ID / PROVISION_CERT_THUMBPRINT are NOT in this list: they are not
# referenced by any step's command text — the provisioning scripts read them from
# the environment themselves, via Get-ProvisioningAuthContext. They are supplied by
# ci.yml's job-level `env:` block, together with the certificate itself. See the
# "Provisioning identity" section of .github/workflows/ci.yml.
required_env_vars:
  - ENV_URL_DEV
  - ENV_URL_TEST
  - ENV_URL_PRD
  - ENV_ID_TEST
  - ENTRA_GROUP_ID_DEV
  - PIPELINE_STAGE_ID

# ── ALM: how a solution moves between environments ────────────────────────────
alm:
  tool: power-platform-pipelines          # TAD ADR-007, `Adopted` 2026-08-12
  solution_unique_name: RevitaliseGrantAutomation
  pipeline_name: "REV Grant Automation Standard"   # created in the pipelines host

  # ── THE RESPONSIBILITY BOUNDARY ─────────────────────────────────────────────
  # GitHub Actions owns: validate → build → import the UNMANAGED solution to DEV.
  # Power Platform Pipelines owns: DEV → TST/ACC → PRD.
  #
  # Pipelines CANNOT be handed a pre-built artefact. It exports the solution
  # from DEV itself the moment a deployment is requested, and then prevents any
  # modification of that artefact for the rest of its journey:
  #   "Solutions are exported as soon as a deployment request is submitted (when
  #    the maker selects Deploy from within their development environment), and
  #    the same solution artifact will be deployed... The system also prevents
  #    any tampering or modification to the exported solution artifact. This
  #    ensures customization can't bypass QA environments or your approval
  #    processes."  — https://learn.microsoft.com/en-us/power-platform/alm/pipelines
  #
  # So the ONLY hand-off point available is "make DEV's unmanaged solution match
  # the repository". That is what stage_dev_command does, and it is the whole of
  # GitHub Actions' deployment role.
  #
  # `--publish-changes` is REQUIRED, not cosmetic: "Do pipelines publish
  # unmanaged customizations before exporting the solution? Not currently."
  # Unpublished changes would be silently missing from the exported artefact.
  #
  # ⚠ This import overwrites unmanaged customisations in DEV. That is the TAD
  #   §9.2 posture — this repo is the source of truth — but a maker who edits in
  #   the portal without committing loses that work here.
  stage_dev_command: >
    pac solution import
      --path {artifact}/RevitaliseGrantAutomation.zip
      --environment {dev_env_url}
      --async --max-async-wait-time 60
      --force-overwrite --publish-changes --activate-plugins

  # ── What was verified about automating Pipelines, and what was not ──────────
  promotion_mechanism:
    verified_cli_surface: >
      `pac pipeline deploy --solutionName --stageId --currentVersion --newVersion
      [--environment] [--wait]` — "Start pipeline deployment." Documented at
      https://learn.microsoft.com/en-us/power-platform/developer/cli/reference/pipeline
      and confirmed against the locally installed pac 2.4.1, whose own help lists
      exactly those four required parameters. `pac pipeline list [--pipeline]`
      returns pipelines and their deployment stages, which is where a stage GUID
      comes from. HIGH confidence: the automation surface EXISTS and is supported.
    not_verified: >
      (1) WHETHER A SERVICE PRINCIPAL MAY *REQUEST* A PROMOTION. Every Microsoft
      example has a maker requesting the deployment from within the development
      environment. Service principals appear in the docs as the DELEGATED identity
      that PERFORMS the import after a maker requests it, and as the identity that
      calls UpdateApprovalStatus — never documented as the requester.
      (2) THE SEMANTICS OF --currentVersion / --newVersion. The reference says only
      "Current solution version" / "New solution version"; whether `current` refers
      to DEV or to the target, and whether the two may be equal on a first release,
      is not stated anywhere.
    consequence: >
      `promote_mode` therefore defaults to `manual` for this first release: CI
      stages DEV, a human promotes in the Pipelines UI, and the CI job's GitHub
      Environment approval gate is the wait. The `cli` path is fully implemented in
      scripts/ci/promote-via-pipelines.sh and can be switched on per environment
      once one UI-driven promotion has established both unknowns. Guessing either
      in a production promotion path is worse than one manual click.

  # ── What Pipelines does NOT do that pac solution import did ─────────────────
  behaviour_changes:
    - >
      NO DEPLOYMENT SETTINGS FILE. Pipelines collects connection references and
      environment variable values in its own deployment pane and does not accept
      a settings file: "For stage owner based delegated deployments, can I use a
      custom DeploymentSettings.json file? Not currently within the maker
      experience." — .../alm/delegated-deployments-setup
      provisioning/deploymentSettings/pac-import-tstacc.json and pac-import-prd.json
      are therefore NO LONGER CONSUMED by the promotion path. They are retained,
      deliberately, as the reviewed record of the values an operator must type into
      that pane — which keeps C-TECH-047 satisfied (the values are still declared
      per environment outside the solution) and keeps them under code review.
    - >
      IMPORT BEHAVIOUR IS NOT CONFIGURABLE. "Pipelines default import behavior is
      Upgrade without Overwrite customizations." `--force-overwrite`,
      `--activate-plugins` and `--settings-file` do not apply to TST/ACC or PRD.
    - >
      STAGE ORDER AND VERSION ORDER ARE ENFORCED BY THE PLATFORM. "You can't
      deploy version 1.0.0.1 to production before it has been deployed to test."
      This is a stronger guarantee than the previous job-dependency chain could
      give, and it is the reason C-TECH-030's intent survives the tooling change.
    - >
      ROLLBACK CHANGES SHAPE. Re-importing a previous managed zip is no longer the
      first-choice route: "If the pipeline setting is enabled, you can redeploy
      previous solution versions from the run history view on the Pipelines page."
      That setting must be enabled on the pipeline — see tenant_prerequisites.
    - >
      UNMANAGED SOLUTIONS CANNOT BE DEPLOYED to targets ("Can I deploy unmanaged
      solutions? No."), which is consistent with TAD §9: TST/ACC and PRD receive
      managed solutions only.

# First release of this solution — no previous managed package exists yet.
# ⚠ Rolling back a FIRST managed import is not symmetrical with a later one:
# uninstalling the managed solution removes its tables and the data in them.
# For release 1.0.0.0 the rollback route is therefore: (a) turn off the four
# cloud flows, (b) leave the solution in place, (c) fix forward. Populate
# rollback_artifact after the first successful PRD deployment (C-TECH-033).
rollback_artifact: ""

