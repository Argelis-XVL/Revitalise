# Model Configuration
# SINGLE SOURCE OF TRUTH for model assignments across all agents.
# Agent .md files reference tiers only — never hardcode model IDs there.
#
# How to apply:
#   Claude Code:  set ANTHROPIC_MODEL env var before invoking each agent, or
#                 pass --model flag:  claude --model claude-haiku-4-5
#   API / custom orchestrator: read this file and pass model: <id> per request
#
# ── MODEL IDS — REVISED 2026-08-19 ───────────────────────────────────────────
# This block said "current as of 2026-07" and resolved `strategic` to
# `claude-opus-4-8`. Opus 5 has since shipped and is what the sessions doing this
# work actually run on, so the file that calls itself the single source of truth
# for model assignment was naming a superseded model — and a third value again
# (`claude-opus-4-6`) appears in logs/routing.log's own escalation notes. Three
# places disagreeing about one value is the condition this file exists to prevent.
#
# ⚠ THIS IS THE ONLY PLACE A MODEL ID MAY APPEAR. Agent files declare a TIER.
#   When a new Claude generation ships, verify against the Anthropic models page
#   and edit these three lines and nothing else.
#
#   claude-opus-5     — highest capability
#   claude-sonnet-5   — near-Opus on coding and agentic work
#   claude-haiku-4-5  — fastest, lowest cost
#
# Pricing is deliberately NOT restated here. The previous version carried per-MTok
# figures and an intro-pricing expiry date, which is the same defect IMP-0029
# recorded on the commercial side: a repo document restating a number it does not
# own, which then goes stale silently and is inherited by everything downstream.
# Cite the pricing page at the moment a budget is being made.

# ─── Tier definitions ────────────────────────────────────────────────────────

tiers:
  strategic:
    model: claude-opus-5
    use_when: >
      Novel design decisions with long-lived consequences,
      complex trade-off analysis, security architecture,
      or any task where a wrong answer is expensive to reverse.

  standard:
    model: claude-sonnet-5
    use_when: >
      Structured document production, code generation within known patterns,
      test case derivation, architecture within an established stack,
      moderate reasoning with clear inputs.

  mechanical:
    model: claude-haiku-4-5
    use_when: >
      Classification, routing, rule-following against a known YAML,
      log writing, status reporting. No novel reasoning required.

# ─── Agent assignments ────────────────────────────────────────────────────────

agents:

  lead-agent:
    tier: mechanical
    rationale: >
      Routing is a classification task against a fixed table.
      No novel reasoning. Wrong routing is recoverable in one message.

  plan-agent:
    tier: standard
    rationale: >
      SDD production requires structured thinking and requirement quality,
      but operates within well-defined templates and domain knowledge files.
    escalate_to_strategic_when:
      - Feature touches regulated data (PII, financial, medical)
      - Estimated effort is L or XL
      - More than 3 open questions at start of session

  architect-agent:
    tier: standard
    rationale: >
      Most TADs in this system are architecture within an established stack:
      the platform, data store, auth model, and deployment topology are fixed
      by knowledge/technology/, and the TAD instantiates known patterns.
      The current standard-tier model handles this at prior-Opus quality.
      Escalation covers the genuinely novel/high-risk cases — where a wrong
      decision is expensive to reverse, strategic-tier is still mandatory.
    escalate_to_strategic_when:
      - Feature touches regulated data (PII, financial, medical)
      - Estimated effort is L or XL
      - New integration topology or external system not in knowledge/technology/
      - Custom security controls, auth flows, or cryptography
      - Schema change is breaking or affects a table > 1M rows in production
      - Previous standard-tier TAD failed the gate on this feature

  development-agent:
    tier: standard
    rationale: >
      Code generation within a defined TAD and coding-standards file is a
      well-scoped pattern-following task.
    escalate_to_strategic_when:
      - Feature involves cryptography, auth flows, or custom security controls
      - No existing pattern in the codebase to follow
      - TAD contains more than 2 open ADRs marked "Proposed"

  test-agent:
    tier: standard
    rationale: >
      Test case derivation from requirements is structured analysis.
      The SDD traceability matrix provides clear inputs and pass criteria.
    escalate_to_strategic_when:
      - Security or compliance test layer is the primary concern
      - Feature has P1 defects from a previous test cycle

  # ── RE-TIERED 2026-08-17 (was `mechanical`) ─────────────────────────────────
  # The old rationale for both agents was "reads a YAML file and executes commands.
  # No reasoning required." A week of live use falsified it. These two agents are
  # the first in the workflow to touch a real tool and a real environment, so every
  # accumulated upstream guess surfaces here — and diagnosing it is genuinely hard.
  #
  # What they actually did between 08-12 and 08-17:
  #   • decompiled SolutionPackagerLib.dll with ilspycmd to recover an undocumented
  #     packer file-layout contract (IMP-0001)
  #   • determined that `pac solution check` requires a packed .zip, and that the
  #     step order in build.yml was therefore wrong (IMP-0004)
  #   • found a HARD FR-016 compliance gate that had been a silent no-op since it
  #     was written, because `! grep` inverts exit 2 into a pass (IMP-0007)
  #   • ruled out data, binding, security and XML-structure causes by live Web API
  #     query before correctly concluding a control classid was wrong (IMP-0014)
  #   • diagnosed a form-dependency block on an attribute delete and devised a
  #     transitional-import sequence to clear it (IMP-0017)
  #   • caught a *successful* import that had silently created nothing (IMP-0018)
  #
  # 21 of the week's incidents landed on these two agents. Assigning them the
  # cheapest tier while instructing them that no reasoning was required is a
  # contributing cause, not a coincidence. Full analysis:
  # docs/improvements/2026-08-17-failure-analysis-and-self-learning-design.md §2.1
  #
  # Cost note: these two run far less often than development-agent and their token
  # volume is small (a config plus tool output), so the tier change is cheap.

  build-agent:
    tier: standard
    rationale: >
      Executing the build is mechanical; deciding whether the build config itself is
      correct, and diagnosing what a tool's output actually means, is not. This agent
      owns the preflight over its own gates and the triage of every tool warning —
      both tasks where a plausible-but-wrong conclusion ships a defect downstream.
    escalate_to_strategic_when:
      - A gate or packer contract must be recovered by decompilation or reverse-engineering
      - The same step has failed twice with different hypotheses about the cause
      - A HARD constraint gate is found to be defective (a false PASS on compliance)

  pipeline-agent:
    tier: standard
    rationale: >
      Deploy commands are scripted, but this agent is the first to see the target
      platform's real behaviour, behind irreversible-ish gates. Distinguishing "the
      tool exited 0" from "the component exists and works" is the single most
      error-prone judgement in this system, and the one with the least recoverable
      consequences in TST/ACC and PRD.
    escalate_to_strategic_when:
      - An import has failed twice on the same component with different errors
      - A deploy failure's cause is not named by the platform's own detailed error record
      - The target is PRD, or any environment where rollback has not been exercised
      - A schema change requires a destructive step (delete/recreate) to land

  improvement-agent:
    tier: strategic
    rationale: >
      The only agent that edits the rules governing every future feature. It converts
      findings into constraints, gates, skills and agent-file changes — and a wrong or
      over-broad constraint is sticky, expensive to reverse, and silently taxes every
      later run. It must also judge ALTITUDE: whether a finding is a one-off, an
      instance of a class, or a general law. Getting that wrong is how a system
      accumulates one gate per incident forever, which is exactly what the manual loop
      did before this agent existed (two separate description-length gates for one
      underlying class). This is `tiers.strategic.use_when` almost verbatim: a wrong
      answer is expensive to reverse.
    escalate_to_strategic_when:
      - Always. This agent has no lower tier.

# ─── Sub-agent assignments (spawned by development-agent) ────────────────────

sub_agents:

  data-agent:
    tier: standard
    rationale: Schema work follows patterns in the TAD and coding standards.
    escalate_to_strategic_when:
      - Migration affects a table with > 1M rows in production
      - Schema change involves a breaking API contract

  backend-agent:
    tier: standard

  frontend-agent:
    tier: standard

  automation-agent:
    tier: standard
    escalate_to_strategic_when:
      - Workflow involves distributed transactions or saga patterns

  identity-agent:
    tier: standard
    rationale: >
      Security role design and group-team binding follow the documented patterns
      in security-model.md and entra-id.md. Tenant-impacting identity work is
      inherently higher risk — escalation conditions are broader than other sub-agents.
    escalate_to_strategic_when:
      - New app registration, or any change to API permissions / admin consent
      - Custom auth flow, token handling, or certificate management logic
      - Security role design spans business units or uses record sharing

  m365-agent:
    tier: standard
    rationale: >
      SharePoint and Teams provisioning follows scripted, idempotent patterns
      (PnP templates, Graph calls) documented in sharepoint.md and teams.md.
    escalate_to_strategic_when:
      - New site collection topology or cross-tenant sharing design
      - Teams app requires custom bot / messaging extension (beyond tab surfacing)

  config-agent:
    tier: mechanical
    rationale: >
      Environment config and feature flags are rule-following tasks
      with no novel reasoning.

# ─── Prompt caching (biggest cost lever after model choice) ──────────────────
#
# The Anthropic prompt cache is a PREFIX match: identical leading bytes of a
# request are re-served at ~0.1x input price (writes cost 1.25x once).
# Rules for this system:
#
#   1. Stable-first ordering. Knowledge files, constraint files, and templates
#      are the stable prefix; the feature request and per-turn instructions
#      come last. Never interpolate timestamps or per-run values into the
#      shared context.
#   2. Caches are per-model. Every model switch (e.g. Sonnet dev-agent to
#      Haiku build-agent) starts cold. Prefer running consecutive same-tier
#      agents back-to-back. The cache TTL depends on how the session is
#      configured — this file previously asserted a flat 5 minutes as though it
#      were a property of the system; treat it as "shorter than you think, and
#      not worth designing an agent order around beyond keeping same-tier work
#      adjacent".
#   3. Within one Claude Code session, files already read are already in
#      context — agents must NOT re-read a knowledge/constraint/template file
#      that an earlier agent loaded this session.
#   4. Minimum cacheable prefix is ~2-4K tokens depending on model; the
#      knowledge + constraint set easily clears this.

# ─── Cost reference (indicative — recheck pricing before budgeting) ──────────
#
# Estimates include input context (knowledge files, templates, constraints,
# prior documents), which dominates cost — not just output tokens.
#
# Task                        Tier          ~in / ~out tokens
# ─────────────────────────────────────────────────────────────────────────────
# Route a request             mechanical    2K / 0.2K
# Produce SDD                 standard      15K / 4K
# Produce TAD                 standard      25K / 6K
# Produce TAD (escalated)     strategic     25K / 6K
# Implement feature           standard      50K / 15K
# Produce test report         standard      30K / 8K
# Execute build               standard      5K / 1K      (re-tiered 2026-08-17)
# Execute pipeline (3 envs)   standard      8K / 2K      (re-tiered 2026-08-17)
# ─────────────────────────────────────────────────────────────────────────────
# TOKEN VOLUMES ONLY — no prices. Multiply by current published per-MTok rates at
# the moment you need a figure; do not restate them here (2026-08-19: the previous
# table's prices had gone stale along with the model ids above, and an intro-pricing
# expiry it carried had passed). Prompt caching on the shared knowledge/constraint
# prefix typically cuts the input side substantially on revision cycles and
# multi-feature sessions, so these are upper bounds per invocation, not per feature.
#
# ⚠ The build and pipeline rows still show small volumes because they read a config
#   plus tool output. That was the *original* argument for putting them on the
#   cheapest tier, and it was falsified — see the re-tiering note above. Volume is
#   not difficulty.
