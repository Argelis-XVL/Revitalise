# Build Configuration — Revitalise Grant Application Automation (Phase 1)
# Generated by: development-agent   2026-08-10
# Revised:      development-agent   2026-08-12 — OIDC auth; ADR-007 resolved to Pipelines
# Consumed by:  build-agent, .github/workflows/ci.yml
#
# Scope of this build: Phase 1 only — Automation #4 (WordPress → Dataverse intake),
# Automation #2 (scoring engine) and the operational failure-alert child flow.
# Automation #1 (the application form) ships as a specification document, not as a
# build artifact: docs/development/revitalise-grant-automation-form-validation-spec.md
#
# ── ADR-007 IS NOW RESOLVED, AND NOT THE WAY THIS FILE ORIGINALLY SAID ────────
# The first version of this file recorded ADR-007 as settled in favour of pac CLI +
# GitHub Actions "by the act of generating this file". The reviewer has since chosen
# POWER PLATFORM PIPELINES, and ADR-007 is `Adopted` on that basis (2026-08-12).
#
# What that changes for the BUILD: almost nothing, and that is the point. Every step
# below still runs, because they are all validation of the solution SOURCE in this
# repository — the secret scan, the XML/JSON parse, root-component resolution, field
# security coverage, the FR-016 special-category grep, the solution checker, and both
# pack steps. Source of truth is still this repo (TAD §9.2).
#
# What it changes for the ARTEFACT: `RevitaliseGrantAutomation-managed.zip` is NO
# LONGER THE DEPLOYED ARTEFACT. Power Platform Pipelines exports the solution from
# DEV itself and stores it immutably in the pipelines host. The zips packed here now
# prove the source packs cleanly and serve as the build/audit record; the UNMANAGED
# zip additionally IS deployed — into DEV, as the hand-off to Pipelines. See
# config/revitalise-grant-automation-pipeline.yml → `alm`, and the Dev Summary's
# C-TECH-030 entry.

feature: revitalise-grant-automation
build_tool: pac

# ── ARTIFACT OUTPUT IS RESOLVED PER BUILD, NOT HARDCODED (2026-08-17, IMP-0016) ──
# This was `build/artifacts/revitalise-grant-automation-20260810-1/`, hardcoded in seven
# places and reused unchanged for every build from 08-10 to 08-17. Six builds wrote into
# that one directory: the manifests for builds #1-#3 no longer exist anywhere, and #6
# overwrote #5 on disk. The manifest is the richest structured failure record this system
# produces, and the build config was deleting it.
#
# `artifact_output` is now a TEMPLATE. build-agent resolves it ONCE, before step 1, by
# running `scripts/resolve-artifact-dir.py --feature <feature>`, and exports the result as
# $ARTIFACT_DIR for every step below. Every step references "$ARTIFACT_DIR" — never a
# literal path — so the convention in agents/WORKFLOW.md
# (`build/artifacts/<slug>-<date>-<n>/`) is enforced by construction rather than by
# whoever remembers to bump the number.
artifact_output: build/artifacts/${ARTIFACT_DIR_NAME}/   # <slug>-<YYYYMMDD>-<n>, resolved at run time
artifact_dir_resolver: scripts/resolve-artifact-dir.py

# ── Artifacts ─────────────────────────────────────────────────────────────────
# There is deliberately NO teams-app artifact: Phase 1 uses Microsoft Teams as a
# 1:1 chat notification via the Teams connector (TAD ADR-015) — no team is
# provisioned and no Teams app package is installed.
#
# ── code-app ADDED 2026-08-21 (WBS 6.1–6.5, Automation #6) ────────────────────
# This line previously read "There is no code-app artifact: the trustee portal Code App is
# Phase 3." Phase 3 has started. The trustee portal is a Power Apps Code App per TAD ADR-003
# (Canvas was rejected as out-of-palette), built under src/code-apps/trustee-review-portal.
#
# WHAT THE ARTIFACT IS, AND WHAT IT IS NOT. `dist/` is the Vite production build — the bytes
# `pac code push` uploads. It is captured here so the artifact is self-describing and the
# deployed bundle is reproducible from the build record, exactly as the packed solution zip is.
# It is NOT a solution component in this artifact: whether the code app travels INSIDE the
# managed solution or is pushed per environment is TAD §9.3's documented deviation, and the
# answer is unknown until a real `pac code push` has been run once — no code app exists in any
# environment yet (`pac code list` against DEV returns none, confirmed 2026-08-21). The
# pipeline config carries both routes with the deviation recorded; this artifact supports
# either.
artifacts:
  - type: solution
    path: RevitaliseGrantAutomation-managed.zip
  - type: provisioning
    path: provisioning/
  - type: code-app
    path: code-app/
  # NEW 2026-08-12 (C-TECH-014). The Pester result file and the JaCoCo coverage report,
  # so the coverage figure is evidence in the build record rather than a line in a log
  # that scrolls away — the same reasoning revision 0.5 applied to package contents.
  - type: test-results
    path: test-results/

# ── Steps ─────────────────────────────────────────────────────────────────────
# Executed in order. Any non-zero exit halts the build and reports FAILED.
# `pac solution check` and `pac solution pack` both require an authenticated pac
# profile against DEV; step `auth` creates it from CI secrets (never echoed).
steps:
  # ── PREFLIGHT — THE GATE OVER THE GATES. RUNS FIRST, ALWAYS (2026-08-17) ──────
  # Three of this file's own gates were found broken in live use, each having reported
  # PASS while checking nothing:
  #   • `lint` ran BEFORE `pack-managed` and pointed --path at the source FOLDER, but
  #     `pac solution check` requires a packed .zip. Broken from the day it was written;
  #     survived builds #1-#4 because `auth` (and so `lint`) was deferred every time.
  #   • `no-special-category-data-in-scoring` — a HARD FR-016 compliance gate — targeted a
  #     path missing its `.json`. `grep -r` on a nonexistent path exits 2, and the leading
  #     `!` inverts any non-zero exit into a pass. It never read the scoring flow, ever.
  #   • `secret-scan` lacked `--no-git` for two revisions, scanning commit history instead
  #     of the working tree, and recorded PASS over none of the delivered source.
  #
  # A gate that cannot fail is worse than no gate: it manufactures the confidence that
  # stops anyone looking. This step asserts, statically and in about a second, that every
  # step's declared inputs exist or are produced by an EARLIER step, that no gate uses the
  # inverted-grep pattern without a registered negative test, and that every gate has a
  # known-bad fixture proving it can fail (src/tests/build/BuildGates.Tests.ps1).
  #
  # IMP-0004, IMP-0007, IMP-0002. Design: docs/improvements/
  # 2026-08-17-failure-analysis-and-self-learning-design.md §4.4.
  - name: preflight-build-config
    command: python3 scripts/verify-build-config.py config/revitalise-grant-automation-build.yml

  # ── NEW 2026-08-21 (IMP-0175) — THE BUILD CHECKS WHAT IT HANDS OFF TO ────────
  # A green build that hands a red pipeline config to pipeline-agent has not finished; it has
  # moved the failure to a machine with less context. Until this step existed, nothing in any
  # build ran `verify-pipeline-config.py`: CI's validate job does, but IMP-0165 records that CI
  # had never actually fired on a matching branch trigger, so C-TECH-062 and C-TECH-065 — both
  # HARD, both in build-agent's own scope — were enforced only by an agent choosing to run the
  # script by hand. On 2026-08-21 one did, and found 18 unresolved, unowned {{PLACEHOLDER}}
  # tokens across test-settings.json and prd-settings.json (IMP-0175, `blocker`).
  #
  # It targets THIS FEATURE'S OWN pipeline config, deliberately: the pair (build.yml,
  # pipeline.yml) is what a hand-off consists of, and checking a different feature's pipeline
  # would be the two-invocation-paths-disagree class wearing a helpful face.
  - name: pipeline-config-preflight
    command: python3 scripts/verify-pipeline-config.py config/revitalise-grant-automation-pipeline.yml

  - name: clean
    command: rm -rf build/exports/RevitaliseGrantAutomation && mkdir -p build/exports/RevitaliseGrantAutomation "$ARTIFACT_DIR"

  - name: verify-tooling
    command: pac help > /dev/null && pwsh -NoProfile -Command '$PSVersionTable.PSVersion.Major -ge 7 || exit 1' && python3 --version

  # C-TECH-044 — RESOLVED 2026-08-12. No client secret: the GitHub OIDC token is
  # exchanged for an Entra token by pac itself.
  #   --githubFederated : "Use GitHub Federation for Service Principal Auth;
  #                        requires --tenant and --applicationId arguments"
  #   https://learn.microsoft.com/en-us/power-platform/developer/cli/reference/auth
  # Requires `permissions: id-token: write` on the calling job, which supplies
  # ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN — both are in required_env_vars below so a
  # missing permission fails with a clear message instead of an opaque auth error.
  # No azure/login step is needed. Flagged (Preview) in the CLI's own help text,
  # which is why the pac version is pinned in .github/actions/setup-powerplatform.
  # ── `when: ci` ADDED 2026-08-19 (IMP-0041) ───────────────────────────────────
  # This step needs ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN, which GitHub injects only inside an
  # Actions run. It was therefore "deferred" on every local build — builds #1-#4 all reported
  # SUCCESS with `auth` and `lint` deferred and "not a defect" beside them, which collectively
  # hid a broken `lint` step through four green builds. A deferral that repeats is not a
  # footnote, it is an undeclared coverage boundary. `when:` makes it declared and checkable:
  # preflight validates it, and build-agent records an out-of-context skip as exactly that
  # rather than as a deferral with a rising counter.
  - name: auth
    when: ci
    command: pac auth create --githubFederated --applicationId "$APP_ID" --tenant "$TENANT_ID" --environment "$ENV_URL_DEV" --name revdev

  # C-TECH-001 — no secret, credential, token or connection string may reach the artifact.
  # Fails the build on any finding rather than warning.
  #
  # --no-git IS LOAD-BEARING AND WAS MISSING UNTIL REVISION 0.8 (test report D-006).
  # `gitleaks detect` without it scans COMMIT HISTORY, not the working tree. The files this
  # build actually packages are the ones on disk, and for two revisions none of the 47 files
  # under src/solutions/ was tracked in git — so the gate scanned two commits of unrelated
  # history, reported PASS, and covered none of the delivered source. Every recorded PASS for
  # C-TECH-001 since then has rested on a human re-running the scan by hand with --no-git,
  # while build/artifacts/.../manifest.json already claimed the step had run as
  # `secret-scan (--no-git)`. The document was ahead of the config; this line closes that.
  #
  # --no-git also makes the gate correct in CI rather than only locally: on a committed branch
  # `detect` would happen to cover these files, which is precisely why the hole was easy to
  # miss. Scanning the working tree is what the build should assert either way, because the
  # working tree is what `pac solution pack` reads.
  # --config ADDED 2026-08-19 (IMP-0057). Without it the scan covers build/artifacts/ —
  # the build's OWN output — so on any machine that has run a build it scans the previous
  # run's deploy logs. That produced three `generic-api-key` findings against the literal
  # text `ParameterKey=""` (an EMPTY attribute in a Dataverse import-job record): the gate
  # failing, on nothing, in a gitignored directory. A gate that fires on nothing teaches
  # people to ignore it. .gitleaks.toml extends the DEFAULT rules and only narrows the
  # path set; provisioning/ stays fully in scope, which is what caught a real certificate
  # in build #5 (IMP-0003).
  - name: secret-scan
    command: gitleaks detect --source . --no-git --no-banner --redact --exit-code 1 --config .gitleaks.toml

  # Source-level validation of the unpacked solution. This is the closest thing to a
  # unit test suite that hand-authored solution source has: XML well-formedness on
  # every component file, JSON parse on every cloud-flow definition, and two grep
  # gates that enforce constraints the platform cannot enforce for us.
  # EXTRACTED FROM AN INLINE ONE-LINER, 2026-08-17. This was two `python3 -c "..."` programs
  # with the solution path hardcoded inside them, which meant the gate could not be pointed
  # at a fixture and therefore could not be proven able to fail — the precise condition that
  # let three other gates in this file record PASS while reading nothing. It is now a script
  # taking a path, with a negative test in src/tests/build/BuildGates.Tests.ps1.
  - name: source-validate
    command: python3 scripts/verify-source-parses.py src/solutions/RevitaliseGrantAutomation --expect-flows 4

  # Every component declared in Other/Solution.xml <RootComponents> must have a definition
  # file on disk, and vice versa. `pac solution pack` reports a missing component as a
  # generic packing error late in the build; this fails in one second with the exact
  # component type and schema name. It is the check that catches a half-finished component
  # (a folder created but never filled), which is the failure mode this source has already
  # had once.
  - name: root-components-resolve
    command: python3 scripts/verify-solution-root-components.py src/solutions/RevitaliseGrantAutomation

  # ── NEW 2026-08-19 (improvement review) — ONE GATE FOR TWO FINDINGS ─────────
  # `pac solution pack` validates a folder against its OWN layout rules, never against what
  # Dataverse accepts. So a hand-authored component can be well-formed XML, pack with exit 0,
  # and be rejected or silently ignored by the target — the class
  # `platform-contract-guessed-not-groundtruthed`, seven recorded instances, the most
  # expensive one in the digest.
  #
  #   IMP-0045 (blocker) an environmentvariabledefinition.xml carrying an XML declaration and
  #     a comment. Import failed FOUR times with `0x80040216 — An unexpected error occurred`
  #     at ImportXml.GetComponentsList, naming no component at all.
  #   IMP-0037 (rework) an option set missing the optionset-level <Descriptions> and
  #     <displaynames> that sit after </options> — invisible to the `head -12` read the shape
  #     was copied from.
  #
  # Both are one defect: the authored element set differs from the one the platform requires.
  # skills/how-to-promote-a-finding.md §2 forbids an instance patch for the second instance of
  # a class, so this is ONE gate reading ONE reference table
  # (constraints/technology/component-shapes.yml). A future component type is a block in that
  # file, not another script.
  - name: component-shape
    command: >
      python3 scripts/verify-component-shape.py
      src/solutions/RevitaliseGrantAutomation
      --shapes constraints/technology/component-shapes.yml

  # ── WIRED 2026-08-21 (IMP-0174) — THE STEP THAT REVIEW 6 SAID WAS ALREADY HERE ─
  # C-TECH-066. Every column the approved TAD §3.1 names must exist in Entity.xml, or carry an
  # owned, dated deferral in contract/tad-deferrals.json; and every column §3.1 marks
  # trustee-visible must sit on a table the REV Trustee role can actually read.
  #
  # WHY IT SITS BESIDE component-shape: both compare authored solution source against a
  # specification the packer knows nothing about, both cost about a second, and both fail on an
  # unreadable input rather than passing over nothing. An ABSENT column is the one schema defect
  # every other gate in this file is structurally blind to — it is absent from both sides of
  # every source-against-source comparison — which is how twelve columns went missing for eleven
  # days with every schema gate green (IMP-0158, IMP-0159).
  #
  # THIS STEP IS THE POINT OF IMP-0174, NOT THE SCRIPT. The script and the constraint row landed
  # on 2026-08-20 and improvement review 6 recorded them APPLIED as "wired as a build gate". They
  # were not: no steps: block anywhere named the script, so the gate existed, passed --selftest,
  # and could never fire. A HARD constraint whose Verify By says "wired as a build gate" is
  # satisfied by a line in a steps: block and by nothing else — grep the config, never the review.
  - name: tad-coverage
    command: python3 scripts/verify-tad-coverage.py

  # ── NEW 2026-08-14 (D-018) ──────────────────────────────────────────────────
  # Every entity folder's FormXml/ and SavedQueries/ content must be reachable through a
  # matching marker element in that entity's Entity.xml. Without it, `pac solution pack`
  # drops the folder's content SILENTLY — 0 warnings, 0 errors — and the component simply
  # never reaches the target environment. This is exactly how this solution shipped to DEV
  # with 8 SavedQueries files and 4 FormXml files on disk and 0 views + 0 forms actually
  # created: root-components-resolve above does not catch it (SavedQueries/FormXml are not
  # RootComponent-declared types), and neither pac solution pack nor pac solution check
  # warns — both reported clean. See docs/development/revitalise-grant-automation-
  # dev-deployment-handover.md §6 and Dev Summary revision 1.0 (D-018) for the full
  # experiment that isolated the cause.
  - name: forms-and-views-reachable
    command: python3 scripts/verify-forms-and-views-reachable.py src/solutions/RevitaliseGrantAutomation

  # ── NEW 2026-08-19 — REACHABLE BY A HUMAN, NOT JUST BY THE PACKER ────────────
  # `forms-and-views-reachable` above asks whether `pac solution pack` will KEEP a form or
  # view. That is a different question from whether anyone can NAVIGATE to it, and the gap
  # between the two shipped a whole table: rev_grant went out in WBS 0.4 with a main form and
  # three saved queries and no SubArea in AppModuleSiteMaps/, so none of it was reachable in
  # the app. Every structural gate passed. The reviewer found it (IMP-0052).
  #
  # ONE GATE FOR THE CLASS, NOT A FOURTH PATCH. `no-assertion-on-shipped-content` has four
  # recorded instances and skills/how-to-promote-a-finding.md §2 forbids another instance
  # patch. This script carries two of the three checks — navigability (IMP-0052) and shipped
  # prose naming a deleted column (IMP-0008) — and DECLARES the third (form label text vs the
  # attribute's own displayname, IMP-0015) as not yet implemented, because it needs a
  # precedence rule that is a decision rather than a lookup. Declared, not silently omitted.
  # `--cards` added 2026-08-21 (IMP-0131). Check 4: every readable Adaptive Card payload under
  # docs/development/cards/ must parse equal to a body/messageBody string actually shipped in a
  # flow definition, and no card may ship without a readable file. The two copies drifted
  # silently before this — the daily-summary notes.md still said "THIS IS NOT AN ADAPTIVE CARD"
  # a day after the card shipped. Ninth instance of `no-assertion-on-shipped-content`, so it
  # lives in this gate rather than in a tenth script.
  - name: shipped-content
    command: >
      python3 scripts/verify-shipped-content.py src/solutions/RevitaliseGrantAutomation
      --cards docs/development/cards

  # ── CONSOLIDATED 2026-08-18 (improvement review; replaces two gates) ────────
  # One gate for the whole class `platform-field-length-limit-unenforced`, replacing
  # `workflow-description-length` (C-TECH-049, retired) and `setting-description-length`
  # (D-021, retired). Those two hardcoded 256 and 500 respectively and each looked at one
  # field on one surface — two instance patches for one class, with nothing covering the
  # third instance. Both incidents were real: 62 flow descriptions over the designer's save
  # cap on the first DEV import, and 4 of 11 seed rows rejected live by Dataverse mid-run
  # after 7 had already written (IMP-0009).
  #
  # This gate reads `<MaxLength>` from the solution's own Entities/*/Entity.xml, so a schema
  # change moves the limit with it; carries platform-fixed limits no schema declares in one
  # named table with citations; and covers settings-row `key` (rev_name, 100) and `value`
  # (rev_value, 4000) as well as `description` — neither of the first two was ever checked.
  # It fails on an unreadable schema and on a path with no scannable surface, so it cannot
  # report PASS over nothing (IMP-0007). C-TECH-060.
  - name: field-length-limits
    command: >
      python3 scripts/verify-field-length-limits.py
      src/solutions/RevitaliseGrantAutomation
      provisioning/deploymentSettings

  # Every column marked IsSecured=1 must be released by a field security profile, and no
  # profile should release a column that is not secured. A secured column missing from
  # REV_TrusteeRestricted is unreadable and unwritable by every application persona - the
  # symptom is a blank field nobody can account for, or an intake create that fails with a
  # permission error naming a column the developer believed was fine. The schema revision pass
  # added seventeen secured columns in one change, which is exactly the size of change where
  # one omission goes unnoticed.
  # ── NEW 2026-08-18 (WBS 0.4-R, rev_grant) ───────────────────────────────────
  # Hand-authored form ids for rev_grant were written with a non-hex character in them
  # ({a1000000-...-00000000ga01} — note the `g`). `pac solution pack` accepted the folder and
  # exited 0: the file is well-formed XML so source-validate passes, and the ids are not
  # RootComponents so verify-solution-root-components never sees them. Same shape as every
  # expensive defect in the digest — a plausible hand-authored value the packer does not
  # validate, failing later in an environment with an unhelpful error. IMP-0036.
  - name: guid-syntax
    command: python3 scripts/verify-guid-syntax.py src/solutions/RevitaliseGrantAutomation

  - name: field-security-coverage
    command: python3 scripts/verify-field-security-coverage.py src/solutions/RevitaliseGrantAutomation

  # ── NEW 2026-08-21 (WBS 6.1) — THE INVERSION THAT ALMOST SHIPPED ─────────────
  # `field-security-coverage` above checks which COLUMNS are secured. Nothing checked WHO the
  # profile releases them to, and that is the half where the dangerous mistake lives.
  #
  # On 2026-08-21 a dispatch instruction said "bind REV Trustee to the existing
  # REV_TrusteeRestricted field security profile." That is backwards. A profile's membership
  # list is who it GRANTS the secured columns to — so adding the trustee team would have
  # released ~51 Tier 4 columns to trustees, `rev_application.rev_narrativeraw` (Article 9)
  # among them. NON-MEMBERSHIP IS THE CONTROL. The agent caught it and refused before writing
  # anything, so nothing was exposed (IMP-0153, `blocker`).
  #
  # It was caught by a person reading carefully. Nothing here could have caught it:
  #   • FieldSecurityProfiles.xml carries only FieldPermissions — no membership at all, so no
  #     gate over solution source can see it.
  #   • Membership is per-environment state, applied by ensure-column-security-profile-members.ps1
  #     from provisioning/deploymentSettings/<env>-settings.json → columnSecurityProfiles[].memberTeams.
  #   • verify-field-security-coverage.py never reads memberTeams.
  # The one file where the mistake would be made had no gate on it. This is that gate.
  #
  # IT DERIVES, IT DOES NOT TRANSCRIBE. Asserting `memberTeams == ["REV Admins", "REV Service
  # Accounts"]` would be a transcription, and C-TECH-060's lesson is that transcriptions drift
  # from what they claim to assert. Instead it reads groupTeams[] from the same settings file,
  # collects every team holding a trustee-facing role, and fails if any of them appears in any
  # profile's membership — so it keeps working through renames and covers the next such persona
  # on the day it is added.
  - name: no-trustee-in-column-security-profile
    command: python3 scripts/verify-column-security-membership.py provisioning/deploymentSettings

  # ── NEW 2026-08-19 (improvement review) — THE FIRST EXECUTABLE DOMAIN GATE ───
  # Until this step existed, `constraints/domain/` had no mechanical enforcement of any
  # kind: thirteen of its fifteen rows were verified by "TAD §6 documents…" and the other
  # two — C-DOM-030 and C-DOM-031, both in scope, one HARD — were still the scaffolding's
  # literal `[PLACEHOLDER] Replace with your first domain-specific constraint`. A HARD
  # constraint whose rule text is a placeholder always passes (IMP-0035, blocker).
  #
  # The asymmetry was structural, not accidental: 32 of 47 findings in the improvement log
  # come from build-agent and pipeline-agent, so the learning loop only ever fed the
  # technology side. Nothing about Article 9 data, safeguarding, or the scoring-fairness
  # position was enforced by anything that runs.
  #
  # It reads constraints/domain/special-category-register.yml — which is now the single
  # source of truth for the column list — and asserts three things:
  #   C-DOM-030  every registered column exists, AND the FR-016 alternation below contains
  #              EXACTLY the register's columns. That list was hand-maintained inside the
  #              shell one-liner and edited four times in eight days (see the comment on
  #              that step); a name dropped from it narrows a HARD compliance gate silently.
  #   C-DOM-031  every registered column is IsSecured=1, unless the register carries an
  #              explicit exception with a reason and a named owner. Four do today, and
  #              they are printed on every run rather than becoming invisible.
  #   C-DOM-032  every registered column is IsAuditEnabled=1 — special-category data with
  #              no audit trail cannot answer "who saw this, and when" (C-DOM-010/011).
  #
  # Runs BEFORE no-special-category-data-in-scoring, because it is what proves that gate's
  # column list is still the right list. C-TECH-060's discipline applied to a list instead
  # of a length: read at check time, never transcribed.
  - name: domain-invariants
    command: >
      python3 scripts/verify-domain-invariants.py
      src/solutions/RevitaliseGrantAutomation
      --register constraints/domain/special-category-register.yml
      --build-config config/revitalise-grant-automation-build.yml

  # FR-016 (HARD requirement, and the DUAA 2025 position): disability data, health-condition
  # data and the free-text narrative must not influence the automated score. The scoring flow
  # receives the whole row from its Dataverse trigger, so the guarantee is that no expression
  # in that flow REFERENCES a special-category column. That is a grep-able property, so it is
  # gated here rather than left as a promise in a document.
  #
  # THE LIST GREW WITH THE SCHEMA REVISION PASS and must grow with every future
  # special-category column, or the gate silently narrows. Note in particular that the
  # original four-name list would NOT have caught rev_supportrecipientotherconditionraw: it
  # does not contain the substring "rev_otherconditionraw". Six names added:
  # rev_supportrecipientotherconditionraw, rev_caresupportdescription, rev_carersupport,
  # rev_carecostsexplanation, rev_exceptionalfundingdetail, rev_otherexceptionalcircumstance.
  # rev_receivesbenefits and rev_benefitprovider are included too: SDD section 7.1 classifies
  # benefit status at the highest restriction tier, so it must not reach an automated decision
  # either - and the eligibility check that DOES use finance reads rev_incomeband alone.
  #
  # 2026-08-16 (Task 2 audit): five more names added. rev_careprovidedtype /
  # rev_othercareprovidedtype / rev_careprovidedexample are the new applicant-caregiving-role
  # columns - Article 9 special-category data on the same basis as rev_conditionprofile.
  # rev_safeguardingflag / rev_safeguardingnotes are not themselves disability/health data, but a
  # safeguarding concern must never silently influence a numeric score either (see the comment on
  # rev_safeguardingflag in Entities/rev_application/Entity.xml) - included here as the same
  # grep-able belt-and-braces guarantee, not because FR-016's letter requires it.
  #
  # 2026-08-17 (form-field-corrections pass): rev_carersupport REMOVED (the column no longer
  # exists, W6/FR-063). rev_exceptionalcircumstance, rev_employmentstatus,
  # rev_consentexplanation and rev_intakereviewnote ADDED - all four are Article 9 (TAD section
  # 3.1/3.3), so this gate applies to them regardless of whether they are also column-secured
  # (rev_conditionprofile is the existing precedent: Article 9, trustee-visible, still barred
  # here).
  #
  # PATH DEFECT FOUND AND FIXED IN THE SAME EDIT (2026-08-17): the target below was missing
  # its .json extension. `grep -r` on a non-existent literal path exits 2 (error, not "no
  # match"), and the leading `!` inverts ANY non-zero exit to a pass - so this gate has been
  # a silent no-op, never actually reading the flow, since whenever this line was written.
  # Found incidentally while extending the alternation list for this pass; fixed here because
  # a HARD compliance gate discovered broken should not be left broken once noticed, even
  # though the breakage itself predates and is unrelated to this pass. Flagged in the Dev
  # Summary as an out-of-scope finding, not folded in silently as though it were planned work.
  - name: no-special-category-data-in-scoring
    command: >
      ! grep -rnE "body/(rev_narrativeraw|rev_otherconditionraw|rev_conditionprofile|rev_supportrecipientconditionprofile|rev_supportrecipientotherconditionraw|rev_caresupportdescription|rev_carecostsexplanation|rev_exceptionalfundingdetail|rev_otherexceptionalcircumstance|rev_receivesbenefits|rev_benefitprovider|rev_careprovidedtype|rev_othercareprovidedtype|rev_careprovidedexample|rev_safeguardingflag|rev_safeguardingnotes|rev_exceptionalcircumstance|rev_employmentstatus|rev_consentexplanation|rev_intakereviewnote)"
      src/solutions/RevitaliseGrantAutomation/Workflows/REVScoringCalculateAndFlag-8F1C2A44-1002-4B7A-9E21-0A1B2C3D4E02.json
      && echo "FR-016 gate: the scoring flow reads no special-category column"

  # C-TECH-047 — no environment-specific value may be embedded in a flow or a
  # solution component. Every per-environment value is an environment variable or a
  # deployment setting. This gate greps for the shapes that would breach it.
  - name: no-hardcoded-environment-values
    command: >
      ! grep -rniE 'https://[a-z0-9-]+\.crm[0-9]*\.dynamics\.com|\.sharepoint\.com|@revitalise\.org' src/solutions/RevitaliseGrantAutomation
      && echo "C-TECH-047 gate: no environment URLs, SPO URLs or tenant UPNs in solution source"

  # FR-017 / NFR-019 — thresholds, the Likert point map, the income ceiling and the
  # redaction threshold live in rev_setting rows, never in flow logic. This gate
  # fails if a threshold key name appears in a flow definition next to a literal
  # numeric default, which is the shape a regression would take.
  # ── ONE GATE FOR THREE BLOCKERS, 2026-08-21 ─────────────────────────────────
  # Class `platform-contract-guessed-not-groundtruthed`, x16. Three of those instances are
  # cloud-flow shapes that pack, import and report Activated, then fail or silently do nothing
  # at run time — each found by a human, in an environment, after a deploy:
  #   * IMP-0124  select( / filter( used as EXPRESSIONS. No such functions exist; Select and
  #               Filter array are ACTIONS. TD-08 passed and TD-07 failed on the same action,
  #               because if() evaluates only the branch it takes.
  #   * IMP-0112  an alternate-key literal in a connector Row ID. The Web API accepts
  #               rev_settings(rev_name='X') and the CONNECTOR does not — eleven consecutive
  #               failed runs on the scoring flow's first live test.
  #   * IMP-0116  a nested `item` object on an UpdateRecord. CreateRecord accepts it,
  #               UpdateRecord does not: NO PROPERTIES CONFIGURED in the designer, writes
  #               nothing while SUCCEEDING.
  # Two were patched as instances; skills/how-to-promote-a-finding.md §2 forbids a third
  # instance patch, so this is the class gate. It currently FAILS on six live instances in the
  # intake flow (IMP-0112's own prediction) — that is the gate working, not a false positive.
  - name: flow-definition-language
    command: python3 scripts/verify-flow-definition-language.py src/solutions/RevitaliseGrantAutomation

  - name: no-hardcoded-thresholds
    command: >
      ! grep -rnE '"(KnockoutThreshold|BorderlineBandLower|BorderlineBandUpper|IncomeCeiling)"[[:space:]]*:[[:space:]]*[0-9]' src/solutions/RevitaliseGrantAutomation/Workflows
      && echo "FR-017 gate: no threshold literals in flow definitions"

  # C-TECH-042 — every provisioning script must parse and must expose the -Env
  # parameter contract before it can be shipped in the provisioning artifact.
  - name: provisioning-syntax
    command: >
      pwsh -NoProfile -Command '
        $fail = $false
        Get-ChildItem -Recurse -Filter *.ps1 provisioning | ForEach-Object {
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { Write-Output "PARSE FAILED - $($_.Name)"; $fail = $true }
        }
        if ($fail) { exit 1 } else { Write-Output "PowerShell parse OK" }'

  # ── TRUSTEE REVIEW PORTAL CODE APP — NEW 2026-08-21 (WBS 6.1–6.5) ────────────
  # The first Code App in this repository (TAD ADR-003). Everything above this block operates
  # on hand-authored solution XML; this block compiles and tests a real TypeScript project,
  # so it brings its own toolchain. `npm` is declared in required_tools below.
  #
  # THE `--prefix` FORM IS GROUND-TRUTHED, NOT ASSUMED. `npm --prefix <dir> run <script>`
  # (prefix BEFORE the subcommand) was executed from the repository root on 2026-08-21 and
  # both typecheck and build exit 0 with Vite resolving its config correctly. The other
  # ordering — `npm run build --prefix <dir>` — passes `--prefix` through to the script
  # instead, which is a different command that happens not to error.
  #
  # ORDER IS DELIBERATE: install, then the security gate, then correctness, then the bundle.
  # The security gate is a static source scan and needs no node_modules, but it runs before
  # typecheck so that an app naming a secured column fails on THAT, not on a compile error
  # that hides it.
  - name: code-app-install
    command: npm --prefix src/code-apps/trustee-review-portal ci

  # ── THE ANONYMISATION CONTROL, AS A BUILD GATE ───────────────────────────────
  # FR-036/NFR-003/ADR-002: identifying data must never reach a trustee. The runtime control
  # is Dataverse column security — `REV Trustee` is deliberately NOT a member of
  # REV_TrusteeRestricted, so the ~51 secured columns come back empty for a trustee whatever
  # the app asks for. This gate is defence in depth on top of that, and it matters for a
  # reason that is easy to miss: THE SAME APP CODE RUNS FOR THE PROCESS OWNER, who IS a
  # profile member (TAD §6.1 gives Emily portal access), so a query naming a secured column
  # is not harmless — it is populated for her.
  #
  # The forbidden set is DERIVED from FieldSecurityProfiles.xml at check time, not
  # transcribed: every <AttributeName> under a <FieldPermission> is a column the platform is
  # hiding from someone, so securing a 52nd column covers it here the same day with no edit
  # (C-TECH-060's rule applied to a list instead of a length). Several documents in this repo
  # still say "39 secured columns"; source says 51, and this gate reads source.
  #
  # It ALSO fails when the fail-closed visibility columns are ABSENT, because "references no
  # secured column" is trivially true of an app that queries nothing — including an empty
  # directory. TAD §5.5 makes trustee visibility a conjunction (rev_eligibleforround AND
  # rev_redactionreleased); all three of those plus rev_narrativeredacted must be present in
  # AUTHORED source. Generator output under src/generated/ and .power/ is excluded from the
  # forbidden scan only — a secured column name there is Microsoft's text, not ours — and is
  # never accepted as evidence that we implemented anything.
  - name: no-secured-columns-in-code-app
    command: >
      python3 scripts/verify-code-app-column-bindings.py
      src/code-apps/trustee-review-portal
      src/solutions/RevitaliseGrantAutomation/Other/FieldSecurityProfiles.xml

  # `strict: true`, no `any` (knowledge/technology/code-apps.md → TypeScript). Note what this
  # step does NOT cover: src/generated/services/MicrosoftDataverseService.ts is excluded from
  # tsconfig because `pac code add-data-source` emitted a file that does not parse — a
  # generated parameter named `MSCRM.IncludeMipSensitivityLabel` contains a `.`, which is not
  # a legal TypeScript identifier. That is a platform defect, reproduced and recorded in
  # src/code-apps/trustee-review-portal/src/dataverse/README.md, not a lint exemption of
  # convenience. The file stays committed as ground truth.
  - name: code-app-typecheck
    command: npm --prefix src/code-apps/trustee-review-portal run typecheck

  - name: code-app-lint
    command: npm --prefix src/code-apps/trustee-review-portal run lint

  # Vitest + React Testing Library against a mocked repository module. ⚠ WHAT THIS DOES NOT
  # PROVE, stated so a green step is not over-read: every test mocks the Dataverse boundary,
  # so none of them exercises column security, a real connector response, or the Power Apps
  # host. A passing suite here is V1/V2 evidence about our own logic. The control itself is
  # proven only by the V4 access test in the pipeline config, signed off by a human holding
  # ONLY the trustee role — and that needs a positive control, because in DEV the profile has
  # no members at all and every principal reads those columns as empty.
  - name: code-app-unit-tests
    command: npm --prefix src/code-apps/trustee-review-portal run coverage

  - name: code-app-build
    command: npm --prefix src/code-apps/trustee-review-portal run build

  # dist/ is what `pac code push` uploads, so it belongs in the artifact for the same reason
  # the packed solution zip does: the deployed bundle must be reproducible from the build
  # record. dist/ is gitignored, so this copy is the only durable copy.
  - name: package-code-app
    command: mkdir -p "$ARTIFACT_DIR"/code-app && cp -R src/code-apps/trustee-review-portal/dist/. "$ARTIFACT_DIR"/code-app/

  # ── C-TECH-014 (HARD) — NEW 2026-08-12, closes test-agent defect D-005 ────────
  # The repository previously contained no automated test of any kind, and
  # coding-standards.md defined no coverage threshold, so C-TECH-014 could not be
  # satisfied as written. Both halves are now in place:
  #   • knowledge/technology/coding-standards.md → Test Coverage defines the threshold
  #     (80% line coverage over provisioning/{common,entra,dataverse}, build-failing)
  #     and states why the declarative solution source is out of coverage scope;
  #   • src/tests/ holds the suite — 528 tests: contract tests over all 20 provisioning
  #     scripts, unit tests for provisioning-common.ps1, behavioural tests that run the
  #     Phase 1 scripts against mocked Graph and Dataverse Web API calls, invariant tests
  #     over the deploymentSettings files, and static invariant tests over the scoring and
  #     intake flow definitions.
  #
  # THE THRESHOLD IS PASSED EXPLICITLY rather than left to the script's default, so the
  # number the build enforces is visible in this file and changing it is a reviewed diff.
  # The runner exits non-zero below it — Pester's own CoveragePercentTarget is a reporting
  # target that still exits 0, and a coverage gate that does not fail the build is not a
  # gate.
  #
  # Pester is PINNED to 5.7.1 (C-TECH-020). Pester 6 is available and largely compatible,
  # but the suite and the coverage figure were verified against 5.7.1.
  #
  # ⚠ WHAT THIS DOES NOT COVER, stated so the green step is not over-read: no test here
  # executes a cloud flow, enforces column security or produces an audit record. Those
  # need a live Dataverse environment, which does not exist (test report §0). This step
  # covers the provisioning scripts and the STATIC structure of the flow definitions.
  # ⚠ SHAPE OF THIS COMMAND IS LOAD-BEARING — FIXED 2026-08-17 (IMP-0025).
  # It previously put the `Install-Module` call on a MORE-INDENTED line inside the `>` folded
  # scalar. YAML preserves newlines on more-indented lines in a folded block, so the value yq
  # handed to `bash -c` was genuinely multi-line, with `&& pwsh …` starting its own line — a
  # bash syntax error ("syntax error near unexpected token `&&'"). This step would have failed
  # on EVERY CI run. It was never caught because every build to date ran interactively, with
  # the agent invoking Pester directly, and never through scripts/ci/run-config-steps.sh.
  # Keep every line at the SAME indentation and put continuation operators at line END, so the
  # folded scalar collapses to one line. `preflight-build-config` now shell-parses every
  # command with `bash -n`, so this class cannot recur silently.
  # ── SPLIT IN TWO, 2026-08-21 (IMP-0132) ─────────────────────────────────────
  # This step used to carry BOTH gates: the test count and the C-TECH-014 coverage threshold.
  # A manifest's `gates_executed` holds one string per step, so a partial result fits the
  # schema — and on 2026-08-20 three manifests recorded "782 passed, 1 failed, 1 skipped" and
  # omitted the percentage entirely, while coverage had fallen from 89.13% to 67.78% the day
  # the four test-data scripts landed. A HARD constraint went from passing to failing and no
  # artifact in the repository said so, for a day and three deploys.
  #
  # `-CoverageThreshold 0` is NOT the gate being weakened. It means "measure and report, do
  # not decide": the deciding is done by the `coverage-threshold` step below, which is a
  # separate named step and therefore cannot be omitted from a manifest without leaving a
  # visible hole. The threshold now lives in exactly one place (that step), because a number
  # in two places drifts and the path that passes it explicitly hides the drift (IMP-0051).
  - name: unit-tests
    command: >
      pwsh -NoProfile -Command 'Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop' &&
      pwsh -NoProfile -File src/tests/Invoke-Tests.ps1
      -CodeCoverage -CoverageThreshold 0
      -OutputPath "$ARTIFACT_DIR"/test-results

  # C-TECH-014 (HARD) — the coverage decision, as its own step, reading the JaCoCo report the
  # step above writes rather than re-running a 37-second suite.
  #
  # IT ENFORCES THE METRIC THE STANDARD DECLARES. coding-standards.md says "80% LINE
  # coverage"; Pester's own CoveragePercent is command/instruction based. On the 2026-08-21
  # report those are different numbers — 70.00% by line, 67.78% by instruction — so the
  # document and the runner had been disagreeing about which quantity C-TECH-014 governs.
  # This gate reads the LINE counters, which is what the standard says.
  #
  # Exclusions are enumerated in config/coverage-exclusions.json, each with a reason and a
  # substitute proof; the gate FAILS on an entry that carries neither, on an expired deferral,
  # on an uncapped list, and on a report that measures nothing. Proven able to fail by its own
  # `--selftest` (9 cases), which the preflight now EXECUTES rather than trusting a step name
  # to appear in a Pester file.
  - name: coverage-threshold
    command: >
      python3 scripts/verify-coverage-threshold.py
      "$ARTIFACT_DIR"/test-results/coverage.xml
      --threshold 80
      --exclusions config/coverage-exclusions.json

  - name: pack-managed
    command: pac solution pack --zipfile "$ARTIFACT_DIR"/RevitaliseGrantAutomation-managed.zip --folder src/solutions/RevitaliseGrantAutomation --packagetype Managed --errorlevel Info

  - name: pack-unmanaged
    command: pac solution pack --zipfile "$ARTIFACT_DIR"/RevitaliseGrantAutomation.zip --folder src/solutions/RevitaliseGrantAutomation --packagetype Unmanaged --errorlevel Info

  # MOVED AFTER pack-managed, 2026-08-16 — found live, by actually running this build with a
  # live pac auth session for the first time (every previous build deferred both `auth` and
  # `lint` for lack of one). `pac solution check --path` takes a PACKED SOLUTION FILE
  # (glob-matched .zip), not an unpacked source folder: `--path
  # src/solutions/RevitaliseGrantAutomation` fails immediately with "the value passed to
  # '--path' is invalid... could not be found" — the folder exists, but isn't a solution file.
  # This step silently depended on pack-managed's output while running before it in every
  # prior revision; nothing caught it because `auth` (and so `lint`) was always the deferred
  # step, never actually executed. Points at the managed zip now, after pack-managed produces
  # it.
  # `--outputDirectory` writes NOTHING on this repo's path — it contains spaces, and pac
  # silently fails the download while printing "Finished downloading 1 files" (IMP-0010,
  # third occurrence IMP-0079). The 0/0/0/0/0 severity table exists only on stdout, which
  # nothing captured, so in CI the artifact carried no solution-checker result at all — the
  # only evidence for a HARD gate lived in a console log that CI throws away. Tee it into
  # the artifact and fail if the log is empty. `set -o pipefail` keeps pac's exit code
  # rather than tee's.
  - name: lint
    command: >
      set -o pipefail &&
      mkdir -p "$ARTIFACT_DIR"/solution-checker &&
      pac solution check --path "$ARTIFACT_DIR"/RevitaliseGrantAutomation-managed.zip --outputDirectory "$ARTIFACT_DIR"/solution-checker --geo Europe 2>&1 | tee "$ARTIFACT_DIR"/solution-checker/pac-solution-check-stdout.log &&
      test -s "$ARTIFACT_DIR"/solution-checker/pac-solution-check-stdout.log

  # Snapshot of the provisioning scripts and per-environment settings that the
  # pipeline will execute, so the artifact is self-describing and reproducible.
  - name: package-provisioning
    command: mkdir -p "$ARTIFACT_DIR"/provisioning && cp -R provisioning/. "$ARTIFACT_DIR"/provisioning/

# Artifact integrity — pipeline-agent verifies before deploying (C-TECH-030).
artifact_checksum: sha256

# Environment variable names that must be present for the build to proceed.
# Values come from CI secrets — never hardcoded here (C-TECH-001).
#
# ── C-TECH-044 IS RESOLVED, NOT WARNED ON ─────────────────────────────────────
# CLIENT_SECRET IS GONE. There is no client secret anywhere in this pipeline: the
# deploy identities authenticate with a GitHub federated credential (OIDC) and the
# provisioning identity is certificate-based (PROVISION_CERT_THUMBPRINT). The
# constraint asked for "federated credentials (OIDC) or certificates over client
# secrets"; both halves of the pipeline now satisfy it, so the SOFT warning carried
# in the previous three Dev Summary revisions is closed rather than carried again.
# ⚠ If a CLIENT_SECRET secret still exists in the repository's GitHub secrets,
#   DELETE IT — it is now unreferenced, and an unreferenced credential is one
#   nobody rotates and nobody notices leaking.
#
# APP_ID is an ENVIRONMENT-SCOPED GitHub secret: DEV, TST/ACC and PRD each have
# their own deploy app registration, so the value differs per GitHub Environment
# while the name stays the same. See the ci.yml header, section 4.
#
# The two ACTIONS_ID_TOKEN_* variables are injected by GitHub itself when the job
# declares `permissions: id-token: write`. They are listed here deliberately: it
# turns a forgotten permission block into a named, one-line build failure instead
# of a confusing failure inside `pac auth create`.
# ── Tooling contract — NEW 2026-08-19 (IMP-0077) ──────────────────────────────
# Every binary the steps below, or the shared CI runner, actually invoke. Declared here rather
# than hand-listed inside the `verify-tooling` step, because that step named pac, pwsh and
# python3 and missed `yq` — which scripts/ci/run-config-steps.sh needs to read THIS FILE, and
# without which the only path ci.yml uses to execute a build cannot run at all. That was the
# fourth instance of `two-invocation-paths-disagree`, so the fix is derivation, not another
# hand-written list: `scripts/verify-build-config.py --context <ci|local>` asserts every step's
# first token is declared here and that every declared tool resolves on PATH.
#
# `context: always` means the tool is needed on every machine that runs this build.
required_tools:
  - name: python3
    context: always
  - name: pac
    context: always
  - name: pwsh
    context: always
  - name: gitleaks
    context: always
  # Not invoked by any step below — invoked by scripts/ci/run-config-steps.sh, which is how
  # ci.yml executes every step above. GitHub-hosted runners ship it; this Mac did not until
  # 2026-08-19. Declared `always` because a machine without it cannot run the real build path.
  - name: yq
    context: always
  # NEW 2026-08-21 (WBS 6.1–6.5). The trustee portal Code App is a React/Vite/TypeScript
  # project, so the build now needs a Node toolchain it never needed before. Verified locally
  # on 2026-08-21: node v24.14.1, npm 11.11.0. `pac` ≥ 1.44 is required for `pac code` and
  # this machine has 2.4.1. Declared `always` because a machine without npm cannot build the
  # code-app artifact, and `verify-build-config.py --context` asserts every step's first token
  # is declared here and resolves on PATH — which is what caught `yq` being missing (IMP-0077).
  - name: npm
    context: always

required_env_vars:
  - APP_ID
  - TENANT_ID
  - ENV_URL_DEV
  - BUILD_VERSION
  - ACTIONS_ID_TOKEN_REQUEST_URL
  - ACTIONS_ID_TOKEN_REQUEST_TOKEN
