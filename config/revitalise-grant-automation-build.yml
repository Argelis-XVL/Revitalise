# Build Configuration — Revitalise Grant Application Automation (Phase 1)
# Generated by: development-agent   2026-08-10
# Revised:      development-agent   2026-08-12 — OIDC auth; ADR-007 resolved to Pipelines
# Consumed by:  build-agent, .github/workflows/ci.yml
#
# Scope of this build: Phase 1 only — Automation #4 (WordPress → Dataverse intake),
# Automation #2 (scoring engine) and the operational failure-alert child flow.
# Automation #1 (the application form) ships as a specification document, not as a
# build artifact: docs/development/revitalise-grant-automation-form-validation-spec.md
#
# ── ADR-007 IS NOW RESOLVED, AND NOT THE WAY THIS FILE ORIGINALLY SAID ────────
# The first version of this file recorded ADR-007 as settled in favour of pac CLI +
# GitHub Actions "by the act of generating this file". The reviewer has since chosen
# POWER PLATFORM PIPELINES, and ADR-007 is `Adopted` on that basis (2026-08-12).
#
# What that changes for the BUILD: almost nothing, and that is the point. Every step
# below still runs, because they are all validation of the solution SOURCE in this
# repository — the secret scan, the XML/JSON parse, root-component resolution, field
# security coverage, the FR-016 special-category grep, the solution checker, and both
# pack steps. Source of truth is still this repo (TAD §9.2).
#
# What it changes for the ARTEFACT: `RevitaliseGrantAutomation-managed.zip` is NO
# LONGER THE DEPLOYED ARTEFACT. Power Platform Pipelines exports the solution from
# DEV itself and stores it immutably in the pipelines host. The zips packed here now
# prove the source packs cleanly and serve as the build/audit record; the UNMANAGED
# zip additionally IS deployed — into DEV, as the hand-off to Pipelines. See
# config/revitalise-grant-automation-pipeline.yml → `alm`, and the Dev Summary's
# C-TECH-030 entry.

feature: revitalise-grant-automation
build_tool: pac
artifact_output: build/artifacts/revitalise-grant-automation-20260810-1/

# ── Artifacts ─────────────────────────────────────────────────────────────────
# Two artifact types only. There is deliberately NO teams-app artifact: Phase 1
# uses Microsoft Teams as a 1:1 chat notification via the Teams connector
# (TAD ADR-015) — no team is provisioned and no Teams app package is installed.
# There is no code-app artifact: the trustee portal Code App is Phase 3.
artifacts:
  - type: solution
    path: RevitaliseGrantAutomation-managed.zip
  - type: provisioning
    path: provisioning/
  # NEW 2026-08-12 (C-TECH-014). The Pester result file and the JaCoCo coverage report,
  # so the coverage figure is evidence in the build record rather than a line in a log
  # that scrolls away — the same reasoning revision 0.5 applied to package contents.
  - type: test-results
    path: test-results/

# ── Steps ─────────────────────────────────────────────────────────────────────
# Executed in order. Any non-zero exit halts the build and reports FAILED.
# `pac solution check` and `pac solution pack` both require an authenticated pac
# profile against DEV; step `auth` creates it from CI secrets (never echoed).
steps:
  - name: clean
    command: rm -rf build/exports/RevitaliseGrantAutomation && mkdir -p build/exports/RevitaliseGrantAutomation build/artifacts/revitalise-grant-automation-20260810-1

  - name: verify-tooling
    command: pac help > /dev/null && pwsh -NoProfile -Command '$PSVersionTable.PSVersion.Major -ge 7 || exit 1' && python3 --version

  # C-TECH-044 — RESOLVED 2026-08-12. No client secret: the GitHub OIDC token is
  # exchanged for an Entra token by pac itself.
  #   --githubFederated : "Use GitHub Federation for Service Principal Auth;
  #                        requires --tenant and --applicationId arguments"
  #   https://learn.microsoft.com/en-us/power-platform/developer/cli/reference/auth
  # Requires `permissions: id-token: write` on the calling job, which supplies
  # ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN — both are in required_env_vars below so a
  # missing permission fails with a clear message instead of an opaque auth error.
  # No azure/login step is needed. Flagged (Preview) in the CLI's own help text,
  # which is why the pac version is pinned in .github/actions/setup-powerplatform.
  - name: auth
    command: pac auth create --githubFederated --applicationId "$APP_ID" --tenant "$TENANT_ID" --environment "$ENV_URL_DEV" --name revdev

  # C-TECH-001 — no secret, credential, token or connection string may reach the artifact.
  # Fails the build on any finding rather than warning.
  #
  # --no-git IS LOAD-BEARING AND WAS MISSING UNTIL REVISION 0.8 (test report D-006).
  # `gitleaks detect` without it scans COMMIT HISTORY, not the working tree. The files this
  # build actually packages are the ones on disk, and for two revisions none of the 47 files
  # under src/solutions/ was tracked in git — so the gate scanned two commits of unrelated
  # history, reported PASS, and covered none of the delivered source. Every recorded PASS for
  # C-TECH-001 since then has rested on a human re-running the scan by hand with --no-git,
  # while build/artifacts/.../manifest.json already claimed the step had run as
  # `secret-scan (--no-git)`. The document was ahead of the config; this line closes that.
  #
  # --no-git also makes the gate correct in CI rather than only locally: on a committed branch
  # `detect` would happen to cover these files, which is precisely why the hole was easy to
  # miss. Scanning the working tree is what the build should assert either way, because the
  # working tree is what `pac solution pack` reads.
  - name: secret-scan
    command: gitleaks detect --source . --no-git --no-banner --redact --exit-code 1

  # Source-level validation of the unpacked solution. This is the closest thing to a
  # unit test suite that hand-authored solution source has: XML well-formedness on
  # every component file, JSON parse on every cloud-flow definition, and two grep
  # gates that enforce constraints the platform cannot enforce for us.
  - name: source-validate
    command: >
      python3 -c "import glob,sys,xml.etree.ElementTree as ET;
      files=glob.glob('src/solutions/RevitaliseGrantAutomation/**/*.xml',recursive=True);
      [ET.parse(f) for f in files];
      print(f'XML OK: {len(files)} files')"
      && python3 -c "import glob,json,sys;
      files=glob.glob('src/solutions/RevitaliseGrantAutomation/Workflows/**/*.json',recursive=True);
      [json.load(open(f,encoding='utf-8')) for f in files];
      sys.exit('expected 4 cloud flow definitions, found %d' % len(files)) if len(files)!=4 else None;
      print(f'Flow JSON OK: {len(files)} files')"

  # Every component declared in Other/Solution.xml <RootComponents> must have a definition
  # file on disk, and vice versa. `pac solution pack` reports a missing component as a
  # generic packing error late in the build; this fails in one second with the exact
  # component type and schema name. It is the check that catches a half-finished component
  # (a folder created but never filled), which is the failure mode this source has already
  # had once.
  - name: root-components-resolve
    command: python3 scripts/verify-solution-root-components.py src/solutions/RevitaliseGrantAutomation

  # ── NEW 2026-08-14 (D-018) ──────────────────────────────────────────────────
  # Every entity folder's FormXml/ and SavedQueries/ content must be reachable through a
  # matching marker element in that entity's Entity.xml. Without it, `pac solution pack`
  # drops the folder's content SILENTLY — 0 warnings, 0 errors — and the component simply
  # never reaches the target environment. This is exactly how this solution shipped to DEV
  # with 8 SavedQueries files and 4 FormXml files on disk and 0 views + 0 forms actually
  # created: root-components-resolve above does not catch it (SavedQueries/FormXml are not
  # RootComponent-declared types), and neither pac solution pack nor pac solution check
  # warns — both reported clean. See docs/development/revitalise-grant-automation-
  # dev-deployment-handover.md §6 and Dev Summary revision 1.0 (D-018) for the full
  # experiment that isolated the cause.
  - name: forms-and-views-reachable
    command: python3 scripts/verify-forms-and-views-reachable.py src/solutions/RevitaliseGrantAutomation

  # ── NEW 2026-08-14 (D-021) ──────────────────────────────────────────────────
  # rev_setting.rev_description has MaxLength=500 (Entities/rev_setting/Entity.xml). Nothing
  # else in this build reads provisioning/deploymentSettings/*.json, so nothing else could
  # ever have caught a description written in this project's normal verbose style exceeding
  # it — discovered only by actually running seed-settings.ps1 -Env dev against live DEV,
  # where 4 of 11 rows failed. Same failure class as workflow-description-length above.
  - name: setting-description-length
    command: python3 scripts/verify-setting-description-length.py provisioning/deploymentSettings

  # Every column marked IsSecured=1 must be released by a field security profile, and no
  # profile should release a column that is not secured. A secured column missing from
  # REV_TrusteeRestricted is unreadable and unwritable by every application persona - the
  # symptom is a blank field nobody can account for, or an intake create that fails with a
  # permission error naming a column the developer believed was fine. The schema revision pass
  # added seventeen secured columns in one change, which is exactly the size of change where
  # one omission goes unnoticed.
  - name: field-security-coverage
    command: python3 scripts/verify-field-security-coverage.py src/solutions/RevitaliseGrantAutomation

  # Power Automate hard-caps every action/trigger/parameter/schema-property `description` at
  # 256 characters. Neither `pac solution pack` nor `pac solution import` enforces this -
  # both succeed silently - so the failure surfaces only when a maker opens the flow in the
  # designer and cannot save it, with no indication which of dozens of actions is the
  # culprit. Discovered live during DEV deployment (revision 1.0, Dev Summary §2.7) after
  # every flow in this solution was found to have descriptions of this project's normal,
  # verbose documentation style - fine as an XML comment, fatal as a flow field. Full
  # reasoning for every condensed description now lives in a companion
  # Workflows/<FlowName>.notes.md file rather than being lost.
  - name: workflow-description-length
    command: python3 scripts/verify-workflow-description-length.py src/solutions/RevitaliseGrantAutomation

  # FR-016 (HARD requirement, and the DUAA 2025 position): disability data, health-condition
  # data and the free-text narrative must not influence the automated score. The scoring flow
  # receives the whole row from its Dataverse trigger, so the guarantee is that no expression
  # in that flow REFERENCES a special-category column. That is a grep-able property, so it is
  # gated here rather than left as a promise in a document.
  #
  # THE LIST GREW WITH THE SCHEMA REVISION PASS and must grow with every future
  # special-category column, or the gate silently narrows. Note in particular that the
  # original four-name list would NOT have caught rev_supportrecipientotherconditionraw: it
  # does not contain the substring "rev_otherconditionraw". Six names added:
  # rev_supportrecipientotherconditionraw, rev_caresupportdescription, rev_carersupport,
  # rev_carecostsexplanation, rev_exceptionalfundingdetail, rev_otherexceptionalcircumstance.
  # rev_receivesbenefits and rev_benefitprovider are included too: SDD section 7.1 classifies
  # benefit status at the highest restriction tier, so it must not reach an automated decision
  # either - and the eligibility check that DOES use finance reads rev_incomeband alone.
  - name: no-special-category-data-in-scoring
    command: >
      ! grep -rnE "body/(rev_narrativeraw|rev_otherconditionraw|rev_conditionprofile|rev_supportrecipientconditionprofile|rev_supportrecipientotherconditionraw|rev_caresupportdescription|rev_carersupport|rev_carecostsexplanation|rev_exceptionalfundingdetail|rev_otherexceptionalcircumstance|rev_receivesbenefits|rev_benefitprovider)"
      src/solutions/RevitaliseGrantAutomation/Workflows/REVScoringCalculateAndFlag-8F1C2A44-1002-4B7A-9E21-0A1B2C3D4E02
      && echo "FR-016 gate: the scoring flow reads no special-category column"

  # C-TECH-047 — no environment-specific value may be embedded in a flow or a
  # solution component. Every per-environment value is an environment variable or a
  # deployment setting. This gate greps for the shapes that would breach it.
  - name: no-hardcoded-environment-values
    command: >
      ! grep -rniE 'https://[a-z0-9-]+\.crm[0-9]*\.dynamics\.com|\.sharepoint\.com|@revitalise\.org' src/solutions/RevitaliseGrantAutomation
      && echo "C-TECH-047 gate: no environment URLs, SPO URLs or tenant UPNs in solution source"

  # FR-017 / NFR-019 — thresholds, the Likert point map, the income ceiling and the
  # redaction threshold live in rev_setting rows, never in flow logic. This gate
  # fails if a threshold key name appears in a flow definition next to a literal
  # numeric default, which is the shape a regression would take.
  - name: no-hardcoded-thresholds
    command: >
      ! grep -rnE '"(KnockoutThreshold|BorderlineBandLower|BorderlineBandUpper|IncomeCeiling)"[[:space:]]*:[[:space:]]*[0-9]' src/solutions/RevitaliseGrantAutomation/Workflows
      && echo "FR-017 gate: no threshold literals in flow definitions"

  # C-TECH-042 — every provisioning script must parse and must expose the -Env
  # parameter contract before it can be shipped in the provisioning artifact.
  - name: provisioning-syntax
    command: >
      pwsh -NoProfile -Command '
        $fail = $false
        Get-ChildItem -Recurse -Filter *.ps1 provisioning | ForEach-Object {
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { Write-Output "PARSE FAILED - $($_.Name)"; $fail = $true }
        }
        if ($fail) { exit 1 } else { Write-Output "PowerShell parse OK" }'

  # ── C-TECH-014 (HARD) — NEW 2026-08-12, closes test-agent defect D-005 ────────
  # The repository previously contained no automated test of any kind, and
  # coding-standards.md defined no coverage threshold, so C-TECH-014 could not be
  # satisfied as written. Both halves are now in place:
  #   • knowledge/technology/coding-standards.md → Test Coverage defines the threshold
  #     (80% line coverage over provisioning/{common,entra,dataverse}, build-failing)
  #     and states why the declarative solution source is out of coverage scope;
  #   • src/tests/ holds the suite — 528 tests: contract tests over all 20 provisioning
  #     scripts, unit tests for provisioning-common.ps1, behavioural tests that run the
  #     Phase 1 scripts against mocked Graph and Dataverse Web API calls, invariant tests
  #     over the deploymentSettings files, and static invariant tests over the scoring and
  #     intake flow definitions.
  #
  # THE THRESHOLD IS PASSED EXPLICITLY rather than left to the script's default, so the
  # number the build enforces is visible in this file and changing it is a reviewed diff.
  # The runner exits non-zero below it — Pester's own CoveragePercentTarget is a reporting
  # target that still exits 0, and a coverage gate that does not fail the build is not a
  # gate.
  #
  # Pester is PINNED to 5.7.1 (C-TECH-020). Pester 6 is available and largely compatible,
  # but the suite and the coverage figure were verified against 5.7.1.
  #
  # ⚠ WHAT THIS DOES NOT COVER, stated so the green step is not over-read: no test here
  # executes a cloud flow, enforces column security or produces an audit record. Those
  # need a live Dataverse environment, which does not exist (test report §0). This step
  # covers the provisioning scripts and the STATIC structure of the flow definitions.
  - name: unit-tests
    command: >
      pwsh -NoProfile -Command '
        Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop'
      && pwsh -NoProfile -File src/tests/Invoke-Tests.ps1
      -CodeCoverage -CoverageThreshold 80
      -OutputPath build/artifacts/revitalise-grant-automation-20260810-1/test-results

  - name: lint
    command: pac solution check --path src/solutions/RevitaliseGrantAutomation --outputDirectory build/artifacts/revitalise-grant-automation-20260810-1/solution-checker --geo Europe

  - name: pack-managed
    command: pac solution pack --zipfile build/artifacts/revitalise-grant-automation-20260810-1/RevitaliseGrantAutomation-managed.zip --folder src/solutions/RevitaliseGrantAutomation --packagetype Managed --errorlevel Info

  - name: pack-unmanaged
    command: pac solution pack --zipfile build/artifacts/revitalise-grant-automation-20260810-1/RevitaliseGrantAutomation.zip --folder src/solutions/RevitaliseGrantAutomation --packagetype Unmanaged --errorlevel Info

  # Snapshot of the provisioning scripts and per-environment settings that the
  # pipeline will execute, so the artifact is self-describing and reproducible.
  - name: package-provisioning
    command: mkdir -p build/artifacts/revitalise-grant-automation-20260810-1/provisioning && cp -R provisioning/. build/artifacts/revitalise-grant-automation-20260810-1/provisioning/

# Artifact integrity — pipeline-agent verifies before deploying (C-TECH-030).
artifact_checksum: sha256

# Environment variable names that must be present for the build to proceed.
# Values come from CI secrets — never hardcoded here (C-TECH-001).
#
# ── C-TECH-044 IS RESOLVED, NOT WARNED ON ─────────────────────────────────────
# CLIENT_SECRET IS GONE. There is no client secret anywhere in this pipeline: the
# deploy identities authenticate with a GitHub federated credential (OIDC) and the
# provisioning identity is certificate-based (PROVISION_CERT_THUMBPRINT). The
# constraint asked for "federated credentials (OIDC) or certificates over client
# secrets"; both halves of the pipeline now satisfy it, so the SOFT warning carried
# in the previous three Dev Summary revisions is closed rather than carried again.
# ⚠ If a CLIENT_SECRET secret still exists in the repository's GitHub secrets,
#   DELETE IT — it is now unreferenced, and an unreferenced credential is one
#   nobody rotates and nobody notices leaking.
#
# APP_ID is an ENVIRONMENT-SCOPED GitHub secret: DEV, TST/ACC and PRD each have
# their own deploy app registration, so the value differs per GitHub Environment
# while the name stays the same. See the ci.yml header, section 4.
#
# The two ACTIONS_ID_TOKEN_* variables are injected by GitHub itself when the job
# declares `permissions: id-token: write`. They are listed here deliberately: it
# turns a forgotten permission block into a named, one-line build failure instead
# of a confusing failure inside `pac auth create`.
required_env_vars:
  - APP_ID
  - TENANT_ID
  - ENV_URL_DEV
  - BUILD_VERSION
  - ACTIONS_ID_TOKEN_REQUEST_URL
  - ACTIONS_ID_TOKEN_REQUEST_TOKEN
