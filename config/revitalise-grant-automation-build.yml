# Build Configuration — Revitalise Grant Application Automation (Phase 1)
# Consumed by: build-agent, .github/workflows/ci.yml
# Scope: Phase 1 — Automation #4 (WordPress -> Dataverse intake), Automation #2 (scoring)
# and the operational failure-alert child flow. Automation #1 ships as a specification
# document, not a build artifact: docs/development/revitalise-grant-automation-form-validation-spec.md
# Deployment is Power Platform Pipelines (ADR-007): the managed zip packed here is the build/audit
# record, NOT the deployed artefact; the UNMANAGED zip is deployed into DEV as the hand-off.
# History: docs/development/revitalise-grant-automation-build-config-history.md#feature

feature: revitalise-grant-automation
build_tool: pac

# ARTIFACT OUTPUT IS RESOLVED PER BUILD, NEVER HARDCODED.
# build-agent runs `scripts/resolve-artifact-dir.py --feature <feature>` ONCE, before step 1, and
# exports the result as $ARTIFACT_DIR. Every step references "$ARTIFACT_DIR" — never a literal path.
# History: docs/development/revitalise-grant-automation-build-config-history.md#artifact_output
artifact_output: build/artifacts/${ARTIFACT_DIR_NAME}/   # <slug>-<YYYYMMDD>-<n>, resolved at run time
artifact_dir_resolver: scripts/resolve-artifact-dir.py

# There is deliberately NO teams-app artifact: Phase 1 uses Teams as a 1:1 chat notification
# via the connector (TAD ADR-015) — no team is provisioned and no Teams app package is installed.
# The code-app artifact is `dist/`, the Vite production build — the bytes `pac code push` uploads.
# Whether the code app travels inside the managed solution or is pushed per environment is TAD
# §9.3's documented deviation; this artifact supports either.
# History: docs/development/revitalise-grant-automation-build-config-history.md#artifacts
artifacts:
  - type: solution
    path: RevitaliseGrantAutomation-managed.zip
  - type: provisioning
    path: provisioning/
  - type: code-app
    path: code-app/
  # NEW 2026-08-12 (C-TECH-014). The Pester result file and the JaCoCo coverage report,
  # so the coverage figure is evidence in the build record rather than a line in a log
  # that scrolls away — the same reasoning revision 0.5 applied to package contents.
  - type: test-results
    path: test-results/

# ── Steps ─────────────────────────────────────────────────────────────────────
# Executed in order. Any non-zero exit halts the build and reports FAILED.
# `pac solution check` and `pac solution pack` both require an authenticated pac
# profile against DEV; step `auth` creates it from CI secrets (never echoed).
steps:
  # PREFLIGHT — THE GATE OVER THE GATES. RUNS FIRST, ALWAYS.
  # Asserts statically, in about a second, that every step's declared inputs exist or are produced
  # by an EARLIER step, that no gate uses the inverted-grep pattern without a registered negative
  # test, and that every gate has a known-bad fixture proving it can fail
  # (src/tests/build/BuildGates.Tests.ps1).
  # History: docs/development/revitalise-grant-automation-build-config-history.md#preflight-build-config
  - name: preflight-build-config
    command: python3 scripts/verify-build-config.py config/revitalise-grant-automation-build.yml

  # The build checks what it hands off to: this feature's OWN pipeline config, deliberately.
  # A green build that hands a red pipeline config to pipeline-agent has not finished.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#pipeline-config-preflight
  - name: pipeline-config-preflight
    command: python3 scripts/verify-pipeline-config.py config/revitalise-grant-automation-pipeline.yml

  # HARD, ~1s, pure Python. Position is deliberate: beside the two preflights, before `clean` does
  # any work. Does NOT replace the BuildGates.Tests.ps1 assertions — both hold the gate.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#improvement-log-check
  - name: improvement-log-check
    command: python3 scripts/verify-improvement-log.py --check

  # HARD. Every provisioning script in the declared coverage scope is NAMED by some test.
  # SCOPE IS DERIVED, never listed here: knowledge/technology/coding-standards.md's coverage-scope
  # row is parsed at runtime, and a missing declaration ABORTS rather than passing over nothing.
  # Being NAMED by a test is not behavioural coverage — `verify-coverage-threshold.py` remains the
  # instrument that measures executed lines. This is the leading indicator that names the file.
  # *** IT IS RED AS OF 2026-08-28 ON THREE TRUE POSITIVES. Owner: development-agent. The fix is a
  # mocked-Dataverse behavioural test per script, or a coverage-exclusions.json entry carrying a
  # reason and a proven_able_to_fail. That is the finding, not a gate defect. DO NOT DELETE THE STEP.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#provisioning-test-presence
  - name: provisioning-test-presence
    command: python3 scripts/verify-provisioning-test-presence.py

  # HARD, ~1s. A <Description> reading "UNUSED FROM REVISION n ... Written by nothing" is a factual
  # claim about writers. A RETAINED column is a live write target, not a comment.
  # Baselines, if ever needed, go in config/gate-baselines.json — owned, dated, and suppressing the
  # FAIL only, never the report.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#superseded-column-writers
  - name: superseded-column-writers
    command: python3 scripts/verify-superseded-column-writers.py

  - name: workflow-syntax
    command: python3 scripts/verify-workflow-syntax.py --root .github --repo-root .

  # Generated-artefact currency (HARD, ~1s each). A generated artefact carries NO staleness signal
  # at its point of use, so "the files were regenerated" must be MEASURED, never inherited.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#subagents-current
  - name: subagents-current
    command: python3 scripts/generate-subagents.py --check

  - name: digest-current
    command: python3 scripts/generate-known-failure-modes.py --check

  # Document-consistency gates (SOFT — report, never block).
  # `--warn-only` IS THE MECHANISM: scripts/ci/run-config-steps.sh halts on the first non-zero exit
  # and has no per-step record-but-continue mode, so a gate that must report without blocking exits
  # 0 and prints. All of these fail on the CURRENT tree by design — each was measured against a real
  # defect before being wired, and none of those defects should stop a build.
  # A commercial gate NEVER halts a build (CLAUDE.md, Commercial Rules).
  # History: docs/development/revitalise-grant-automation-build-config-history.md#change-order-requirements
  - name: change-order-requirements
    command: python3 scripts/verify-change-order-requirements.py --warn-only

  - name: routing-reconciliation
    command: python3 scripts/verify-routing-reconciliation.py --warn-only

  - name: review-document
    command: python3 scripts/verify-review-document.py --warn-only

  - name: commercial-events
    command: python3 scripts/verify-commercial-events.py --warn-only

  # SOFT. A citation line asserting a status for a repo path, compared against that document's own
  # `Status:` line. SOFT is a CORRECTNESS point, not caution: the gate cannot tell which side is
  # stale, and a gate that cannot name the wrong half must not block.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#document-status-consistency
  - name: document-status-consistency
    command: python3 scripts/verify-document-status-consistency.py --warn-only

  # HARD. One identifier means one requirement across docs/plans/. It compares DECLARED allocation
  # ranges, not the ids a document happens to contain.
  # *** WHAT HARD COSTS: a new plan document with NO `id-allocation` declaration FAILS the build
  # rather than warning. That is the intent — a missing declaration is how the collision became
  # invisible. agents/plan-agent.md activation step 4a is what makes declaring it a step.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#requirement-id-uniqueness
  - name: requirement-id-uniqueness
    command: python3 scripts/verify-requirement-id-uniqueness.py

  - name: clean
    command: rm -rf build/exports/RevitaliseGrantAutomation && mkdir -p build/exports/RevitaliseGrantAutomation "$ARTIFACT_DIR"

  - name: verify-tooling
    command: pac help > /dev/null && pwsh -NoProfile -Command '$PSVersionTable.PSVersion.Major -ge 7 || exit 1' && python3 --version

  # C-TECH-044 — no client secret: the GitHub OIDC token is exchanged for an Entra token by pac.
  # `--githubFederated` requires --tenant and --applicationId, and `permissions: id-token: write`
  # on the calling job, which supplies ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN — both declared in
  # required_env_vars below so a missing permission fails with a clear message.
  # `when: ci` is DECLARED, not deferred: these vars exist only inside an Actions run, so
  # build-agent records an out-of-context skip as exactly that.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#auth
  - name: auth
    when: ci
    command: pac auth create --githubFederated --applicationId "$APP_ID" --tenant "$TENANT_ID" --environment "$ENV_URL_DEV" --name revdev

  # C-TECH-001 — no secret, credential, token or connection string may reach the artifact.
  # *** BOTH FLAGS ARE LOAD-BEARING. `--no-git`: without it `gitleaks detect` scans COMMIT HISTORY,
  # not the working tree, and the working tree is what `pac solution pack` reads. `--config`:
  # without it the scan covers build/artifacts/ — the build's OWN output — and fires on nothing.
  # .gitleaks.toml extends the DEFAULT rules and only narrows the path set; provisioning/ stays
  # fully in scope.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#secret-scan
  - name: secret-scan
    command: gitleaks detect --source . --no-git --no-banner --redact --exit-code 1 --config .gitleaks.toml

  # C-TECH-064's SOURCE-SIDE half. Every table under src/solutions/*/Entities/ must be declared in
  # `dataverse.auditing.auditedTables` in every deployment settings file that declares the key.
  # It checks the DECLARATION, never the switch — table-level auditing is entity METADATA, absent
  # from every Entity.xml here. A settings file that OMITS the key entirely is REPORTED, not failed.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#audited-tables
  - name: audited-tables
    command: python3 scripts/verify-audited-tables.py

  # No gate under scripts/ selects an input the repository IGNORES.
  # *** Only ANCHORED glob patterns applied to the repository root are expanded. A script that reads
  # an ignored path BY DESIGN declares it in a line containing `GATE-INPUT-TRACKING: <why>` and is
  # skipped AND NAMED. It finds nothing at rest — that is a regression lock, not coverage.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#gate-input-tracking
  - name: gate-input-tracking
    command: python3 scripts/verify-gate-input-tracking.py

  # A knowledge file's claims about the LOCAL TOOLCHAIN, checked against the local toolchain.
  # Three machine-settleable claim shapes: is a package installed (npm ls -g AND the resolved
  # binary, never PATH alone), is the version in prose the version in the tree, and does every
  # documented `pa <group> <cmd>` appear in that CLI's own --help. It cannot check prose.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#toolchain-claims
  - name: toolchain-claims
    command: python3 scripts/verify-toolchain-claims.py

  # C-TECH-052 — the register must not say OPEN about work its own document says is closed.
  # It compares a row only against claims in the SAME document; a closure evidenced elsewhere is
  # invisible, which the script's docstring states rather than hides.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#assumption-register
  - name: assumption-register
    command: python3 scripts/verify-assumption-register.py

  # HARD — C-TECH-052's other half: an OPEN row must carry its `A-nnn` marker in the source its
  # `Where` column names.
  # *** RESIDUAL: it greps the FILE, not the LINE. A `Where` column naming no resolvable file is
  # reported and NOT failed. Files under environmentvariabledefinitions/ are EXEMPT — a comment
  # there fails solution import with 0x80040216 — and so is generator output under src/generated/.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#assumption-markers
  - name: assumption-markers
    command: python3 scripts/verify-assumption-markers.py

  # SOFT — C-TECH-067. A test asserting a count of SOLUTION SOURCE must derive it, or say in a
  # comment that it is count-coupled by design. SOFT deliberately, and it exits 0 even with
  # findings: a gate that blocks to warn about a maybe-stale literal reproduces the harm it names.
  # It also cannot read intent. Promote to HARD when the live count reaches zero and holds.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#source-derived-test-counts
  - name: source-derived-test-counts
    command: python3 scripts/verify-source-derived-test-counts.py

  # SOFT via `--warn-only` (same mechanism as the block above). A stale number in prose misleads a
  # human and breaks nothing at runtime.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#derived-counts
  - name: derived-counts
    command: python3 scripts/verify-derived-counts.py --warn-only

  # SOFT — every source path a Dev Summary cites is TRACKED BY GIT (C-TECH-053's deploy-side rung).
  # It asserts on GIT'S ANSWER, never on wording. SOFT is deliberate: an in-flight feature
  # legitimately cites uncommitted work, and a HARD gate would be red for the whole of every feature.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#dev-summary-artefacts-committed
  - name: dev-summary-artefacts-committed
    command: python3 scripts/verify-dev-summary-artefacts-committed.py --warn-only

  # HARD — C-TECH-069. Every reader of the solution's repeatable, name-keyed source must survive a
  # SECOND instance of what it reads. HARD rather than SOFT, unlike its sibling above: a reader that
  # silently returns nothing when a second instance exists is a live security or provisioning defect,
  # invisible at every level below a live run.
  # The reader list is DERIVED by scanning for mentions of the source artefacts, never declared.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#source-reader-plurality
  - name: source-reader-plurality
    command: python3 scripts/verify-source-reader-plurality.py

  # Source-level validation of the unpacked solution: XML well-formedness on every component file,
  # JSON parse on every cloud-flow definition, and two grep gates.
  # *** `--expect-flows manifest` REPLACED A HARDCODED `5`. The count comes from Other/Solution.xml's
  # <RootComponent type="29"> entries, an independent source in the same tree, so the check stays
  # failable instead of becoming a tautology against the glob it guards. DO NOT PUT A NUMBER BACK HERE.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#source-validate
  - name: source-validate
    command: python3 scripts/verify-source-parses.py src/solutions/RevitaliseGrantAutomation --expect-flows manifest

  # Every component declared in Other/Solution.xml <RootComponents> must have a definition
  # file on disk, and vice versa. `pac solution pack` reports a missing component as a
  # generic packing error late in the build; this fails in one second with the exact
  # component type and schema name. It is the check that catches a half-finished component
  # (a folder created but never filled), which is the failure mode this source has already
  # had once.
  - name: root-components-resolve
    command: python3 scripts/verify-solution-root-components.py src/solutions/RevitaliseGrantAutomation

  # `pac solution pack` validates a folder against its OWN layout rules, never against what Dataverse
  # accepts — so a hand-authored component can be well-formed XML, pack with exit 0, and be rejected
  # or silently ignored by the target.
  # *** ONE gate reading ONE reference table (constraints/technology/component-shapes.yml).
  # A FUTURE COMPONENT TYPE IS A BLOCK IN THAT FILE, NOT ANOTHER SCRIPT.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#component-shape
  - name: component-shape
    command: >
      python3 scripts/verify-component-shape.py
      src/solutions/RevitaliseGrantAutomation
      --shapes constraints/technology/component-shapes.yml

  # C-TECH-066. Every column the approved TAD §3.1 names must exist in Entity.xml, or carry an owned,
  # dated deferral in contract/tad-deferrals.json; and every column §3.1 marks trustee-visible must
  # sit on a table the REV Trustee role can actually read.
  # An ABSENT column is the one schema defect every source-against-source gate is structurally blind
  # to — it is absent from both sides of the comparison.
  # A HARD constraint whose Verify By says "wired as a build gate" is satisfied by a line in a
  # steps: block and by nothing else — grep the config, never the review.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#tad-coverage
  - name: tad-coverage
    command: python3 scripts/verify-tad-coverage.py

  # Every entity folder's FormXml/ and SavedQueries/ content must be reachable through a matching
  # marker element in that entity's Entity.xml. Without it `pac solution pack` drops the folder's
  # content SILENTLY — 0 warnings, 0 errors — and the component never reaches the target.
  # `root-components-resolve` above does not catch it: SavedQueries/FormXml are not
  # RootComponent-declared types, and neither pack nor check warns.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#forms-and-views-reachable
  - name: forms-and-views-reachable
    command: python3 scripts/verify-forms-and-views-reachable.py src/solutions/RevitaliseGrantAutomation

  # Reachable by a HUMAN, not just by the packer — navigability, shipped prose naming a deleted
  # column, and (via `--cards`) every readable Adaptive Card payload under docs/development/cards/
  # parsing equal to a body/messageBody string actually shipped in a flow definition.
  # It DECLARES one check as not yet implemented (form label text vs the attribute's own displayname)
  # because it needs a precedence rule that is a decision rather than a lookup. Declared, not omitted.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#shipped-content
  - name: shipped-content
    command: >
      python3 scripts/verify-shipped-content.py src/solutions/RevitaliseGrantAutomation
      --cards docs/development/cards

  # C-TECH-060. One gate for the whole class `platform-field-length-limit-unenforced`.
  # It reads `<MaxLength>` from the solution's own Entities/*/Entity.xml, so a schema change moves the
  # limit with it; carries platform-fixed limits no schema declares in one named table with citations;
  # and covers settings-row `key` and `value` as well as `description`. It fails on an unreadable
  # schema and on a path with no scannable surface, so it cannot report PASS over nothing.
  # *** `--check-fixtures` asserts each '*-length' known-bad fixture still exceeds the CURRENT declared
  # limit — widening a <MaxLength> otherwise silently disarms the negative test.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#field-length-limits
  - name: field-length-limits
    command: >
      python3 scripts/verify-field-length-limits.py
      --check-fixtures
      src/solutions/RevitaliseGrantAutomation
      provisioning/deploymentSettings

  # Hand-authored ids must be syntactically valid GUIDs. `pac solution pack` accepts a non-hex
  # character and exits 0: the file is well-formed XML so source-validate passes, and form ids are
  # not RootComponents so verify-solution-root-components never sees them.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#guid-syntax
  - name: guid-syntax
    command: python3 scripts/verify-guid-syntax.py src/solutions/RevitaliseGrantAutomation

  - name: field-security-coverage
    command: python3 scripts/verify-field-security-coverage.py src/solutions/RevitaliseGrantAutomation

  # A table's <OwnershipType> decides which privileges EXIST for it. An OrganizationOwned table has no
  # individual owner, so Dataverse creates no Assign and no Share privilege at all — a role requesting
  # one binds against a privilege GUID that cannot be resolved, and it fails.
  # IT DERIVES, IT DOES NOT TRANSCRIBE: ownership is read from each table's own <OwnershipType>. No
  # list of which tables are organization-owned is held anywhere in the gate.
  # It reports ONLY a privilege the platform cannot create. Withholding Delete is a POLICY decision
  # about a privilege that really exists, and this gate must never conflate the two.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#role-privilege-ownership
  - name: role-privilege-ownership
    command: python3 scripts/verify-role-privilege-ownership.py src/solutions/RevitaliseGrantAutomation

  # C-TECH-071. A SOURCE-VS-SOURCE GATE CANNOT CATCH A SOURCE-VS-CREATION-PATH GAP AT ANY STRICTNESS.
  # A lookup cannot be created as a standalone attribute, so every property a lookup will ever have
  # must be on the relationship body or it is never set at all.
  # IT DERIVES: the property list is read from ConvertFrom-RevEntityXml's own parsed object, so adding
  # a property to the parser fails this gate until somebody records — in writing — whether each builder
  # emits it, cannot carry it (with a reason), or has a known gap (with an owner).
  # History: docs/development/revitalise-grant-automation-build-config-history.md#declared-property-reaches-creation-path
  - name: declared-property-reaches-creation-path
    command: python3 scripts/verify-declared-property-reaches-creation-path.py .

  # C-TECH-042, second clause. IDEMPOTENT IS NOT CONVERGENT: a create-only step reports EXISTS and
  # skips forever, so it cannot deliver a property corrected in source later.
  # *** Every numbered step in provisioning/**/*.ps1 is classified from its own code and, if it only
  # creates, MUST declare:  # CONVERGENCE: immutable | reconciled by step <id> |
  # no source-declared properties | UNRESOLVED owner:<agent>
  # Absence FAILS. A declaration naming a step that does not exist, or that does not itself reconcile,
  # FAILS. An honestly-open UNRESOLVED warns with its owner named, every run.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#provisioning-step-convergence
  - name: provisioning-step-convergence
    command: python3 scripts/verify-provisioning-step-convergence.py .

  # HARD — C-TECH-073. A DATA RECORD AND A METADATA ENDPOINT TAKE OPPOSITE VERBS, AND LOOK IDENTICAL
  # HERE. A Dataverse Web API metadata write is PUT with the COMPLETE current object; PATCH is
  # rejected outright. It reads the ENDPOINT FAMILY, so GlobalOptionSetDefinitions and
  # RelationshipDefinitions are covered before anyone writes against them for the first time.
  # *** RESIDUAL: it reads the verb and the URI, never whether a PUT body is the complete object.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#metadata-write-verbs
  - name: metadata-write-verbs
    command: python3 scripts/verify-metadata-write-verbs.py

  # SOFT via `--warn-only`. Every constraint's Verify By must name something that actually runs.
  # SOFT is a DELIVERY decision, not a rules one: it exits 1 on the real tree today because
  # C-TECH-064's live audit rung is reachable only by a step declared `script: manual` and the
  # executable form is still unwritten delivery work. HARD would block every build until it exists.
  # *** One thing it does NOT downgrade: extracting zero paths still exits 1, because that is the
  # gate reporting on ITSELF, and broken tooling in a build step stops the build whatever its severity.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#constraint-verifiers
  - name: constraint-verifiers
    command: python3 scripts/verify-constraint-verifiers.py --warn-only

  # FR-036/NFR-003/ADR-002. `field-security-coverage` checks which COLUMNS are secured; this checks
  # WHO the profile releases them to, and that is the half where the dangerous mistake lives.
  # *** A PROFILE'S MEMBERSHIP LIST IS WHO IT GRANTS THE SECURED COLUMNS TO. NON-MEMBERSHIP IS THE
  # CONTROL — the trustee team must NEVER be added to REV_TrusteeRestricted.
  # IT DERIVES: it reads groupTeams[] from the same settings file, collects every team holding a
  # trustee-facing role, and fails if any appears in any profile's membership — so it keeps working
  # through renames and covers the next such persona on the day it is added.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#no-trustee-in-column-security-profile
  - name: no-trustee-in-column-security-profile
    command: python3 scripts/verify-column-security-membership.py provisioning/deploymentSettings

  # The first executable domain gate. It reads constraints/domain/special-category-register.yml —
  # the single source of truth for the column list — and asserts:
  #   C-DOM-030  every registered column exists, AND the FR-016 alternation below contains EXACTLY
  #              the register's columns.
  #   C-DOM-031  every registered column is IsSecured=1, unless the register carries an explicit
  #              exception with a reason and a named owner. Four do today, printed on every run.
  #   C-DOM-032  every registered column is IsAuditEnabled=1.
  # Runs BEFORE no-special-category-data-in-scoring, because it is what proves that gate's column
  # list is still the right list.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#domain-invariants
  - name: domain-invariants
    command: >
      python3 scripts/verify-domain-invariants.py
      src/solutions/RevitaliseGrantAutomation
      --register constraints/domain/special-category-register.yml
      --build-config config/revitalise-grant-automation-build.yml

  # FR-016 (HARD, and the DUAA 2025 position): disability data, health-condition data and the free-text
  # narrative must not influence the automated score. The scoring flow receives the whole row from its
  # Dataverse trigger, so the guarantee is that no expression REFERENCES a special-category column.
  # *** THE ALTERNATION BELOW MUST GROW WITH EVERY FUTURE SPECIAL-CATEGORY COLUMN, or the gate
  # silently narrows. It is checked against the register by `domain-invariants` above (C-DOM-030),
  # which is what stops a name being dropped from it unnoticed. Substring matching is NOT enough:
  # the original four-name list would not have caught rev_supportrecipientotherconditionraw.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#no-special-category-data-in-scoring
  - name: no-special-category-data-in-scoring
    command: >
      ! grep -rnE "body/(rev_narrativeraw|rev_otherconditionraw|rev_conditionprofile|rev_supportrecipientconditionprofile|rev_supportrecipientotherconditionraw|rev_caresupportdescription|rev_carecostsexplanation|rev_exceptionalfundingdetail|rev_otherexceptionalcircumstance|rev_receivesbenefits|rev_benefitprovider|rev_careprovidedtype|rev_othercareprovidedtype|rev_careprovidedexample|rev_safeguardingflag|rev_safeguardingnotes|rev_exceptionalcircumstance|rev_employmentstatus|rev_consentexplanation|rev_intakereviewnote)"
      src/solutions/RevitaliseGrantAutomation/Workflows/REVScoringCalculateAndFlag-8F1C2A44-1002-4B7A-9E21-0A1B2C3D4E02.json
      && echo "FR-016 gate: the scoring flow reads no special-category column"

  # C-TECH-047 — no environment-specific value may be embedded in a flow or a
  # solution component. Every per-environment value is an environment variable or a
  # deployment setting. This gate greps for the shapes that would breach it.
  - name: no-hardcoded-environment-values
    command: >
      ! grep -rniE 'https://[a-z0-9-]+\.crm[0-9]*\.dynamics\.com|\.sharepoint\.com|@revitalise\.org' src/solutions/RevitaliseGrantAutomation
      && echo "C-TECH-047 gate: no environment URLs, SPO URLs or tenant UPNs in solution source"

  # FR-017 / NFR-019 and the cloud-flow language contract. Thresholds, the Likert point map, the income
  # ceiling and the redaction threshold live in rev_setting rows, never in flow logic.
  # It also catches the three flow shapes that pack, import and report Activated then fail or silently
  # do nothing at run time: select(/filter( as EXPRESSIONS, an alternate-key literal in a connector
  # Row ID, and a nested `item` object on an UpdateRecord.
  # *** This gate is GREEN on the current tree. If it goes red, it has found something new.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#flow-definition-language
  - name: flow-definition-language
    command: python3 scripts/verify-flow-definition-language.py src/solutions/RevitaliseGrantAutomation

  - name: no-hardcoded-thresholds
    command: >
      ! grep -rnE '"(KnockoutThreshold|BorderlineBandLower|BorderlineBandUpper|IncomeCeiling)"[[:space:]]*:[[:space:]]*[0-9]' src/solutions/RevitaliseGrantAutomation/Workflows
      && echo "FR-017 gate: no threshold literals in flow definitions"

  # TAD §6.3.1 + §6.3.3, ADR-038. Two properties of REV | Portal | Round Statistics:
  #   A  THE FLOW READS NOTHING FROM ITS TRIGGER BODY. A Dataverse row trigger HANDS the flow the row
  #      and its modifier; the flow must re-read what it needs by its own queries. rev_triggeredon
  #      exists only as a change to fire on.
  #   B  THE RESULT DOCUMENT IS COMPOSED FROM AN ENUMERATED FIELD LIST, never from a serialised row
  #      object. Every column gate in this repository is READ-side, so a wholesale row serialisation
  #      into a column a trustee reads would be invisible to all of them.
  # The gate FAILS, never passes, when its target file is missing, unparseable, trigger-less, or has
  # reverted to the Power Apps trigger. Check B's personal-data seed is DERIVED from Entities/*/Entity.xml.
  # ONE exempt template exists (an XPath sum() over a Select, which returns a NUMBER and cannot carry a
  # row). `xpath`/`join`/`xml` are deliberately NOT on the reducing-function allow-list.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#flow-reads-no-trigger-body
  - name: flow-reads-no-trigger-body
    command: >
      python3 scripts/verify-flow-trigger-body-isolation.py
      --solution src/solutions/RevitaliseGrantAutomation
      src/solutions/RevitaliseGrantAutomation/Workflows/REVPortalRoundStatistics-8F1C2A44-1005-4B7A-9E21-0A1B2C3D4E05.json

  # C-TECH-042 — every provisioning script must parse and must expose the -Env
  # parameter contract before it can be shipped in the provisioning artifact.
  - name: provisioning-syntax
    command: >
      pwsh -NoProfile -Command '
        $fail = $false
        Get-ChildItem -Recurse -Filter *.ps1 provisioning | ForEach-Object {
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { Write-Output "PARSE FAILED - $($_.Name)"; $fail = $true }
        }
        if ($fail) { exit 1 } else { Write-Output "PowerShell parse OK" }'

  # STEP ORDER: `design-doc-claims` and `doc-line-links` are sub-second source-only checks with no
  # dependency on packaging or any prior step, and are deliberately front-loaded ahead of the code-app
  # steps so a dangling line-link does not cost a full `npm ci` before it is reported.
  # NOT a batching change: run-config-steps.sh halts on the first non-zero exit and has no
  # record-but-continue mode, so batching would need THAT file changed.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#step-order-static-gates-front-loaded

  # HARD. A design document's checkable factual claims against the source that settles them — only the
  # two claim types that can be checked without reading intent:
  #   (a) a document asserting a `rev_*` column does not exist / was never built, where Entity.xml
  #       declares it;
  #   (b) every contrast ratio a markdown TABLE ROW states, recomputed by the WCAG 2.1 formula from
  #       the hex values that row itself names.
  # Covers `docs/plans/` as well as `docs/architecture/`, because no other gate reads docs/plans/.
  # *** IT IS RED AS OF 2026-08-28 ON THREE TRUE POSITIVES, all in
  # docs/architecture/trustee-portal-visual-refresh-architecture.md. Owner: architect-agent.
  # That is the finding, not a gate defect. DO NOT DELETE THE STEP.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#design-doc-claims
  - name: design-doc-claims
    command: python3 scripts/verify-design-doc-claims.py docs/architecture docs/plans

  # HARD. An identifier-labelled line-link must land where its label says: does the target line, or the
  # heading of the section containing it, carry the identifier the link's own label names? Asserts on
  # VALUES only — no prose semantics anywhere.
  # SCOPE IS DELIBERATELY NARROW — the two directories whose documents are actively owned. Over the
  # whole docs/ tree it is 61 findings, 56 of them in approved deliverables and historical reviews no
  # dispatch is authorised to edit. Named, not silently skipped.
  # *** IT IS RED AS OF 2026-08-28 ON FIVE TRUE POSITIVES in docs/plans/revitalise-grant-automation-plan.md.
  # Owner: plan-agent, with architect-agent for the target sections. The cheapest correct fix is to drop
  # `#Lnnn` and cite the section identifier alone. That is the finding, not a gate defect. DO NOT DELETE.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#doc-line-links
  - name: doc-line-links
    command: python3 scripts/verify-doc-line-links.py docs/architecture docs/plans

  # TRUSTEE REVIEW PORTAL CODE APP (TAD ADR-003). This block compiles and tests a real TypeScript
  # project, so it brings its own toolchain; `npm` is declared in required_tools below.
  # *** THE `--prefix` FORM IS GROUND-TRUTHED: `npm --prefix <dir> run <script>`, prefix BEFORE the
  # subcommand. The other ordering passes `--prefix` through to the script instead, which is a
  # different command that happens not to error.
  # *** ORDER IS DELIBERATE: install, then the security gate, then correctness, then the bundle. The
  # security gate is a static source scan and needs no node_modules, but it runs before typecheck so
  # that an app naming a secured column fails on THAT, not on a compile error that hides it.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#code-app-install
  - name: code-app-install
    command: npm --prefix src/code-apps/trustee-review-portal ci

  # HARD — C-TECH-074, the advisory half. The lockfile-drift half needs no step: `code-app-install`
  # above runs `npm ci`, which fails by design when package.json and package-lock.json disagree.
  # *** RESIDUAL, and why C-TECH-022's licence half STAYS RETIRED: `npm audit` reports what the registry
  # knows today and says nothing about licences or provenance. No licence checker is installed, and a
  # Verify By naming an absent tool is what earned C-TECH-022 its retirement. This step covers the code
  # app only — no other manifest exists in this repository.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#code-app-audit
  - name: code-app-audit
    command: npm --prefix src/code-apps/trustee-review-portal audit --audit-level=high

  # ADR-032's field catalogue, DERIVED not hand-typed. FR-078 renders the eleven REV_TrusteeRestricted
  # "Group B" columns as a restricted state WITHOUT ever binding them, because the process owner IS a
  # profile member and would otherwise see their real values on a screen designed to be anonymous.
  # `--check` re-validates the committed generated file against the CURRENT profile and Entity.xml.
  # *** RUNS BEFORE `no-secured-columns-in-code-app` and before typecheck/build: the app imports this
  # file, so a stale or missing catalogue is a compile-time failure this step turns into a named one.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#trustee-field-catalogue
  - name: trustee-field-catalogue
    command: python3 scripts/generate-trustee-field-catalogue.py --check

  # THE ANONYMISATION CONTROL, AS A BUILD GATE. FR-036/NFR-003/ADR-002 — identifying data must never
  # reach a trustee. Defence in depth on top of Dataverse column security, and it matters for a reason
  # easy to miss: THE SAME APP CODE RUNS FOR THE PROCESS OWNER, who IS a profile member, so a query
  # naming a secured column is not harmless — it is populated for her.
  # The forbidden set is DERIVED from FieldSecurityProfiles.xml at check time, not transcribed, so
  # securing a further column covers it here the same day with no edit.
  # It ALSO fails when the fail-closed visibility columns are ABSENT, because "references no secured
  # column" is trivially true of an app that queries nothing.
  # *** SCOPED BY TABLE, NOT BY A PROFILE DENY-LIST. There is no `--exclude-profile` argument and there
  # must not be one: a deny-list means the day a third profile lands, the default is a false positive
  # and nothing reminds anyone to decide. Generator output under src/generated/ and .power/ is excluded
  # from the forbidden scan only, and is never accepted as evidence that we implemented anything.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#no-secured-columns-in-code-app
  - name: no-secured-columns-in-code-app
    command: >
      python3 scripts/verify-code-app-column-bindings.py
      src/code-apps/trustee-review-portal
      src/solutions/RevitaliseGrantAutomation/Other/FieldSecurityProfiles.xml

  # HARD. Check A: every non-module stylesheet under the app's src/ is side-effect imported by
  # src/main.tsx. Check B: src/test/harness.tsx renders the same theme object main.tsx renders.
  # WHY A GATE AND NOT A TEST: every token assertion in ds-tokens.test.ts reads the stylesheet OFF DISK,
  # because vitest.config.ts sets no `css` option and vitest processes no CSS at all. That technique
  # proves what a file SAYS and can never see a deleted import. This enumerates from disk instead.
  # Deliberate narrowings: a *.module.css is excluded, and a harness omitting PowerProvider passes.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#code-app-composition-root
  - name: code-app-composition-root
    command: python3 scripts/verify-code-app-composition-root.py src/code-apps

  # HARD. Every entity set the app registers in READ_SERVICES resolves to a Dataverse-type entry in the
  # GENERATED dataSourcesInfo the SDK actually reads.
  # *** ORDERED BEFORE typecheck, lint, unit-tests AND build, all four of which pass with the defect
  # present: the failure is observable only at V4, a real signed-in user. The tests mock the SDK and a
  # mock never resolves a data source.
  # *** TO ACCEPT A FINDING TEMPORARILY, add an entry to config/gate-baselines.json with
  # "gate": "code-app-data-sources" and "matches": "<entity-set>", plus a reason, an owner, a clearing
  # action and a dated `expires`. DO NOT reach for an inline flag: `--allow` was RETIRED on 2026-08-29
  # and is now a usage error. The register suppresses the FAIL and never the report, and an expired
  # entry fails. Do not delete the step.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#code-app-data-sources
  - name: code-app-data-sources
    command: >
      python3 scripts/verify-code-app-data-sources.py
      src/code-apps/trustee-review-portal

  # C-TECH-075 (HARD). A supplied design drop is intake'd by full directory enumeration, not by the
  # first folder found: any subdirectory of `Designsystem/` whose name matches a deliverable under
  # src/code-apps/ must be cited by a document in docs/architecture/.
  # THIS IS A VALUE COMPARISON, NOT A PHRASE MATCH — a directory listing against cited paths.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#design-source-coverage
  - name: design-source-coverage
    command: python3 scripts/verify-design-source-coverage.py

  # C-TECH-076 (HARD). An authored CSS declaration whose correctness is ARITHMETIC against another
  # declared value, because jsdom computes no layout and no vitest assertion here can see one.
  #   CHECK A  a rule setting a font-size above the ambient body size declares its own line-height.
  #            FluentProvider's root sets line-height 22px; above that the inherited line box is
  #            smaller than the glyphs and wrapped lines overlap. The ambient size is READ from the
  #            token file's own --text-base, never transcribed. clamp() is judged on its MAXIMUM.
  #   CHECK B  a repeat(auto-fit|auto-fill, minmax(<floor>, ...)) floor stated in purely absolute units
  #            sets a minimum TRACK WIDTH and can never cap a COLUMN COUNT.
  # *** Both assert on VALUES, never on a comment phrase. There is deliberately NO comment escape
  # hatch: the escape is a DECLARED VALUE — an explicit repeat(N, ...) track list, or a
  # container-relative term in the floor.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#css-arithmetic
  - name: css-arithmetic
    command: python3 scripts/verify-css-arithmetic.py

  # `strict: true`, no `any` (knowledge/technology/code-apps.md → TypeScript). Note what this
  # step does NOT cover: src/generated/services/MicrosoftDataverseService.ts is excluded from
  # tsconfig because `pac code add-data-source` emitted a file that does not parse — a
  # generated parameter named `MSCRM.IncludeMipSensitivityLabel` contains a `.`, which is not
  # a legal TypeScript identifier. That is a platform defect, reproduced and recorded in
  # src/code-apps/trustee-review-portal/src/dataverse/README.md, not a lint exemption of
  # convenience. The file stays committed as ground truth.
  - name: code-app-typecheck
    command: npm --prefix src/code-apps/trustee-review-portal run typecheck

  - name: code-app-lint
    command: npm --prefix src/code-apps/trustee-review-portal run lint

  # Vitest + React Testing Library against a mocked repository module. ⚠ WHAT THIS DOES NOT
  # PROVE, stated so a green step is not over-read: every test mocks the Dataverse boundary,
  # so none of them exercises column security, a real connector response, or the Power Apps
  # host. A passing suite here is V1/V2 evidence about our own logic. The control itself is
  # proven only by the V4 access test in the pipeline config, signed off by a human holding
  # ONLY the trustee role — and that needs a positive control, because in DEV the profile has
  # no members at all and every principal reads those columns as empty.
  - name: code-app-unit-tests
    command: npm --prefix src/code-apps/trustee-review-portal run coverage

  - name: code-app-build
    command: npm --prefix src/code-apps/trustee-review-portal run build

  # dist/ is what `pac code push` uploads, so it belongs in the artifact for the same reason
  # the packed solution zip does: the deployed bundle must be reproducible from the build
  # record. dist/ is gitignored, so this copy is the only durable copy.
  - name: package-code-app
    command: mkdir -p "$ARTIFACT_DIR"/code-app && cp -R src/code-apps/trustee-review-portal/dist/. "$ARTIFACT_DIR"/code-app/

  # C-TECH-014 (HARD). The suite: contract tests over the provisioning scripts, unit tests, behavioural
  # tests against mocked Graph and Dataverse Web API calls, invariant tests over the deploymentSettings
  # files, and static invariant tests over the scoring and intake flow definitions.
  # Pester is PINNED to 5.7.1 (C-TECH-020).
  # *** WHAT THIS DOES NOT COVER, so a green step is not over-read: no test here executes a cloud flow,
  # enforces column security or produces an audit record. Those need a live Dataverse environment.
  # *** `-CoverageThreshold 0` IS NOT THE GATE BEING WEAKENED. It means "measure and report, do not
  # decide": the deciding is the `coverage-threshold` step below, a separate named step that cannot be
  # omitted from a manifest without leaving a visible hole. The threshold lives in exactly one place.
  # *** SHAPE OF THIS COMMAND IS LOAD-BEARING. In a `>` folded scalar, keep every line at the SAME
  # indentation and put continuation operators at line END. A more-indented line keeps its newline and
  # yields a bash syntax error. `preflight-build-config` shell-parses every command with `bash -n`.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#unit-tests
  - name: unit-tests
    command: >
      pwsh -NoProfile -Command 'Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop' &&
      pwsh -NoProfile -File src/tests/Invoke-Tests.ps1
      -CodeCoverage -CoverageThreshold 0
      -OutputPath "$ARTIFACT_DIR"/test-results

  # C-TECH-014 (HARD) — the coverage DECISION, as its own step, reading the JaCoCo report the step above
  # writes rather than re-running the suite.
  # IT ENFORCES THE METRIC THE STANDARD DECLARES: coding-standards.md says "80% LINE coverage", while
  # Pester's own CoveragePercent is command/instruction based. This gate reads the LINE counters.
  # Exclusions are enumerated in config/coverage-exclusions.json, each with a reason and a substitute
  # proof; the gate FAILS on an entry that carries neither, on an expired deferral, on an uncapped list,
  # and on a report that measures nothing.
  # History: docs/development/revitalise-grant-automation-build-config-history.md#coverage-threshold
  - name: coverage-threshold
    command: >
      python3 scripts/verify-coverage-threshold.py
      "$ARTIFACT_DIR"/test-results/coverage.xml
      --threshold 80
      --exclusions config/coverage-exclusions.json

  - name: pack-managed
    command: pac solution pack --zipfile "$ARTIFACT_DIR"/RevitaliseGrantAutomation-managed.zip --folder src/solutions/RevitaliseGrantAutomation --packagetype Managed --errorlevel Info

  - name: pack-unmanaged
    command: pac solution pack --zipfile "$ARTIFACT_DIR"/RevitaliseGrantAutomation.zip --folder src/solutions/RevitaliseGrantAutomation --packagetype Unmanaged --errorlevel Info

  # *** MUST RUN AFTER pack-managed. `pac solution check --path` takes a PACKED SOLUTION FILE
  # (glob-matched .zip), not an unpacked source folder — pointing it at the source folder fails
  # immediately with "the value passed to '--path' is invalid".
  # *** `--outputDirectory` WRITES NOTHING. pac silently fails the download while printing "Finished
  # downloading 1 files". The behaviour is unconditional — it is NOT caused by this repo's path
  # containing spaces, which was tested and disproved. The severity table exists only on stdout, so
  # tee it into the artifact and fail if the log is empty. `set -o pipefail` keeps pac's exit code
  # rather than tee's.
  # *** NOT `timeout 180 pac ...`: `timeout` is GNU coreutils and DOES NOT EXIST on macOS, and builds
  # run from the Mac while CI runs ubuntu-latest. scripts/run-with-timeout.sh uses timeout/gtimeout when
  # present and a portable poll-and-kill otherwise (C-TECH-054). 180s is ~5x the documented duration, so
  # a slow-but-working check completes while a stall fails fast. Exit 124 means "timed out".
  # History: docs/development/revitalise-grant-automation-build-config-history.md#lint
  - name: lint
    command: >
      set -o pipefail &&
      mkdir -p "$ARTIFACT_DIR"/solution-checker &&
      scripts/run-with-timeout.sh 180 pac solution check --path "$ARTIFACT_DIR"/RevitaliseGrantAutomation-managed.zip --outputDirectory "$ARTIFACT_DIR"/solution-checker --geo Europe 2>&1 | tee "$ARTIFACT_DIR"/solution-checker/pac-solution-check-stdout.log &&
      test -s "$ARTIFACT_DIR"/solution-checker/pac-solution-check-stdout.log

  # Snapshot of the provisioning scripts and per-environment settings that the
  # pipeline will execute, so the artifact is self-describing and reproducible.
  - name: package-provisioning
    command: mkdir -p "$ARTIFACT_DIR"/provisioning && cp -R provisioning/. "$ARTIFACT_DIR"/provisioning/

# Artifact integrity — pipeline-agent verifies before deploying (C-TECH-030).
artifact_checksum: sha256

# Environment variable names that must be present for the build to proceed.
# Values come from CI secrets — never hardcoded here (C-TECH-001).
# There is NO CLIENT_SECRET: deploy identities authenticate with a GitHub federated credential (OIDC)
# and the provisioning identity is certificate-based (PROVISION_CERT_THUMBPRINT), satisfying C-TECH-044.
# *** If a CLIENT_SECRET still exists in the repository's GitHub secrets, DELETE IT — it is
# unreferenced, and an unreferenced credential is one nobody rotates and nobody notices leaking.
# APP_ID is an ENVIRONMENT-SCOPED GitHub secret: DEV, TST/ACC and PRD each have their own deploy app
# registration, so the value differs per GitHub Environment while the name stays the same.
# The two ACTIONS_ID_TOKEN_* variables are injected by GitHub when the job declares
# `permissions: id-token: write`. Listed deliberately: it turns a forgotten permission block into a
# named, one-line build failure instead of a confusing failure inside `pac auth create`.
# TOOLING CONTRACT: every binary the steps, or the shared CI runner, actually invoke is declared in
# required_tools. `scripts/verify-build-config.py --context <ci|local>` asserts every step's first
# token is declared there and that every declared tool resolves on PATH.
# `context: always` means the tool is needed on every machine that runs this build.
# History: docs/development/revitalise-grant-automation-build-config-history.md#required_tools
required_tools:
  - name: python3
    context: always
  - name: pac
    context: always
  - name: pwsh
    context: always
  - name: gitleaks
    context: always
  # Not invoked by any step below — invoked by scripts/ci/run-config-steps.sh, which is how
  # ci.yml executes every step above. GitHub-hosted runners ship it; this Mac did not until
  # 2026-08-19. Declared `always` because a machine without it cannot run the real build path.
  - name: yq
    context: always
  # NEW 2026-08-21 (WBS 6.1–6.5). The trustee portal Code App is a React/Vite/TypeScript
  # project, so the build now needs a Node toolchain it never needed before. Verified locally
  # on 2026-08-21: node v24.14.1, npm 11.11.0. `pac` ≥ 1.44 is required for `pac code` and
  # this machine has 2.4.1. Declared `always` because a machine without npm cannot build the
  # code-app artifact, and `verify-build-config.py --context` asserts every step's first token
  # is declared here and resolves on PATH — which is what caught `yq` being missing (IMP-0077).
  - name: npm
    context: always

required_env_vars:
  - APP_ID
  - TENANT_ID
  - ENV_URL_DEV
  - BUILD_VERSION
  - ACTIONS_ID_TOKEN_REQUEST_URL
  - ACTIONS_ID_TOKEN_REQUEST_TOKEN
