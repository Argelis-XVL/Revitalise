# ── D-5: is WBS v0.5 accepted, or an internal working revision? ───────────────
# THE MOST CONSEQUENTIAL ANSWER — D-5 was blocking D-1 and D-2.
d5_wbs_status:
  answer: ACCEPTED_BY_CLIENT
  quote: "WBS0.5 is the customer approved one."
  consequence: >
    WBS v0.5 is part of the Agreed Specification under Build Terms B1. It is
    therefore the authority for SCOPE and for the task breakdown, and a task
    absent from it is unquoted work rather than an ambiguity.

# ── D-1 / D-2: the phase-hours variances ──────────────────────────────────────
# Both were framed as "the agreement says X, the WBS says Y". The reviewer's
# answer reframes them: the two documents GROUP work differently on purpose.
d1_d2_phase_mapping:
  answer: GROUPING_DIFFERS_TOTAL_SHOULD_MATCH
  quote: >
    "The agreement combines phases of the WBS together, so that is not one on one.
     It should reflect the same amount of hours though. I believe 292 in total."
  consequence: >
    Do NOT compare a WBS phase against an agreement phase — the mapping is
    many-to-one and a per-phase variance is expected, not a defect. The
    reconciliation that matters is the TOTAL.
  finance_workstream_note: >
    D-2 asked whether Automation #8 (Finance) is a change order. Under D-5 it is
    IN the accepted specification, so it is in scope; whether it is inside the
    agreement's fee is a total-hours question, answered by the reconciliation below.

# ── HOURS: reconciled 2026-08-19, but the WBS needs a revision ────────────────
# First recorded as a discrepancy (WBS 177-277 against a stated 292). The reviewer
# then supplied the missing piece: 20 hours of DocuSign platform selection and
# trialling that the WBS never carried. With those added the two documents agree.
hours_reconciliation:
  status: EXPLAINED_WBS_REVISION_NEEDED
  wbs_v05_total:
    low: 177
    high: 277
    tasks: 61
    automations: 9
    method: >
      Computed 2026-08-19 by summing 'Hours (Low)' and 'Hours (High)' across all 61 rows
      of the 'WBS Detail' sheet. Cross-checks against the workbook's own 'Summary' TOTAL
      row (177 / 277) and against 'Phase Timeline' once task 0.10 - labelled 'Phases 1-4'
      in Detail but counted under Phase 0 in Summary - is accounted for. The workbook is
      internally consistent.
    per_phase:
      phase_0: { low: 32, high: 52, tasks: 9 }
      phase_1: { low: 36, high: 54, tasks: 13 }
      phase_2: { low: 36, high: 54, tasks: 13 }
      phase_3: { low: 39, high: 61, tasks: 15 }
      phase_4: { low: 29, high: 47, tasks: 10 }
      phases_1_to_4: { low: 5, high: 9, tasks: 1 }

  # ── THE GAP IS EXPLAINED (reviewer, 2026-08-19) ────────────────────────────
  missing_from_wbs:
    hours: 20
    scope: "Selecting and trialling the DocuSign platform"
    quote: "the WBS was missing 20 hours of work for selecting and trialing the docusign platform"
    belongs_to: >
      Automation #3 (DocuSign Acceptance Workflow), Phase 1. Platform SELECTION and TRIAL
      is distinct from BUILDING the workflow, and the WBS carries only the build.
    corrected_wbs_total: { low: 197, high: 297 }
    reconciles: >
      292 falls inside the corrected 197-297 band, near the high end. The agreement and the
      accepted WBS are consistent once the 20 hours are added; the apparent 15-hour
      shortfall was the WBS being incomplete, not the two documents disagreeing.

  agreement_total_stated_by_reviewer: 292
  agreement_total_verified: false
  why_not_verified: >
    The signed agreement is a PDF drawn with subset fonts and a custom glyph encoding, and
    this machine has no PDF text extractor (no poppler, no pypdf, no Quartz). 292 remains
    the reviewer's stated figure rather than one read from the document - but it is now
    CONSISTENT with the corrected WBS, which is the check that mattered.

  action_required: >
    Issue WBS v0.6 adding the 20-hour DocuSign selection/trial task to Automation #3,
    Phase 1. Until then the accepted baseline understates the engagement by 20 hours and
    any schedule or capacity figure built on it is short by that much. THIS FILE DOES NOT
    AMEND THE WBS: v0.5 is the customer-accepted specification (D-5), so amending it is a
    re-approval, not an edit.
  finding: IMP-0063

# ── D-3: does the committed baseline carry fees, or hours only? ───────────────
d3_fee_schedule:
  answer: HOURS_ONLY
  quote: "Hours for the baseline is perfect."
  consequence: >
    The committed baseline carries HOURS and task structure. No fee figure and no hourly
    rate appears anywhere in this repository; a fee is derived at invoicing time from
