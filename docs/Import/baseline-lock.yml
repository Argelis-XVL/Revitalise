# ── D-6: capacity ─────────────────────────────────────────────────────────────
d6_capacity:
  hours_per_week: 16
  quote: >
    "I can commit 16 hours a week physically, but use AI to deploy so move much more
     work. Keep to the estimates of the WBS, the actual time will be much less."
  estimating_rule: ESTIMATE_AT_WBS_ACTUAL_WILL_BE_LOWER
  consequence: >
    Two different numbers, and they must not be conflated:
      • ESTIMATES stay at the WBS figures. Do not re-estimate downward because AI
        assistance is expected — the WBS is the accepted specification (D-5).
      • SCHEDULE RISK is computed against 16 h/week of physical capacity.
      • ACTUAL hours are expected to come in well below estimate. A large negative
        Delta is the expected outcome here, NOT a signal that the estimate was wrong
        and NOT a signal to revise the baseline.
  caution: >
    On a time-and-materials engagement billed for hours worked, "actual will be much
    less" means the client is billed less than the estimate. Nothing should ever
    propose actuals at the ESTIMATE value — see IMP-0032, which recorded 61 empty
    Actual Hours rows six weeks in.

# ── D-7: hours already worked and invoiced ────────────────────────────────────
d7_invoiced_to_date:
  hours_invoiced: 64
  quote: "So far I have invoiced 64 hours for Phase 0 and the built of Phase 2"
  covers:
    - "Phase 0 — Platform Foundation & Governance"
    - "Phase 2 — the BUILD portion (Automation #4 WP→Dataverse Intake, Automation #2 Scoring Engine)"
  status: BILLED
  precision_note: >
    64 is a single figure for two phases; the split between them is not recorded and
    the reviewer did not give one. Any future invoice must therefore start from this
    total and not re-derive per-phase actuals for work already billed, or Phase 0 and
    Phase 2 hours will be charged twice (the exact failure D-7 was written to prevent).
  work_not_yet_invoiced:
    quote: >
      "Yes I have invoiced less than the estimates. but the client still needs to test and
       give feedback. And for this week there is another 40 hours scheduled to be completed
       on phase 2. So not everything is invoiced yet."
    scheduled_this_week: { hours: 40, phase: "Phase 2" }
    outstanding:
      - "Client testing of the delivered Phase 0 / Phase 2 work"
      - "Client feedback cycles arising from that testing"
      - "40 hours of Phase 2 work scheduled for the week of 2026-08-19"
    consequence: >
      64 INVOICED does not mean 64 WORKED, and does not mean those phases are finished.
      Phase 0 and Phase 2 are both still OPEN. Do not treat either as complete and do not
      compute a variance against a WBS estimate for a phase still in progress.

  against_estimate:
    phase_0_wbs: { low: 32, high: 52 }
    phase_2_wbs: { low: 36, high: 54 }
    combined_wbs: { low: 68, high: 106 }
    observation: >
      64 invoiced to date against a combined estimate of 68-106, with ~40 more hours
      scheduled and client testing still to come. Both phases are IN PROGRESS.
    correction: >
      An earlier version of this file read the 64 as evidence the work had come in under
      estimate, citing D-6's "actual time will be much less". That inference was WRONG and
      the reviewer corrected it: the figure is low because the work is NOT FINISHED and
      not fully invoiced, not because it was completed cheaply. Recorded because it is the
      error this file exists to prevent - a number read as a RESULT when it is a partial
      CLAIM. Same class as IMP-0030: "a Status column is a claim, not a result".

# ── D-8: are the imported application-data exports real applicant data? ───────
d8_application_data_exports:
  answer: NO_SYNTHETIC_SCHEMA_ONLY
  method: >
    Inspected 2026-08-19 without reading personal data: 163 columns and one non-header
    row whose 24 populated cells hold field descriptions and option lists rather than a
    person's values; zero email addresses, zero UK-postcode-shaped values and zero
    NHS-number-shaped values across both the .csv and the .xlsx.
  consequence: NOT_A_DATA_PROTECTION_MATTER
  finding: IMP-0058
