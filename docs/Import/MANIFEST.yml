# docs/Import/ — source manifest

**GENERATED 2026-08-19.** Regenerate by re-running the block in the commit that added it, or by
hand when a source lands. `IMP-0028`: this folder accepts any document, and until 2026-08-19
only plan-agent and architect-agent intaked from it — so a commercial source dropped here was
silently unread. A manifest makes an unread source distinguishable from an absent one.

`contains_commercial_terms: true` means the file carries fees, rates or bank details. Those are
NOT redacted from the source (a contract is a contract) but no repo document may restate them
(D-3, `C-COM-004`).

intaked_by: which agent adopts it. `pm-agent` for contractual sources (`APPROVE BASELINE`),
plan-agent / architect-agent for requirements, none for compliance references and data samples.

